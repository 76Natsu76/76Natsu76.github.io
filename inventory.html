<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Inventory</title>

  <style>
    body {
      background:#0d0f14;
      color:#e8e8e8;
      font-family:system-ui, sans-serif;
      padding:24px;
    }

    h1 {
      color:#7fffd4;
      margin-bottom:4px;
    }

    #usernameDisplay {
      opacity:0.8;
      margin-bottom:6px;
    }

    #syncIndicator {
      font-size:13px;
      opacity:0.7;
      margin-bottom:16px;
    }

    .btn {
      margin-top:16px;
      padding:10px 14px;
      border-radius:6px;
      border:1px solid #444;
      background:#1a1d24;
      color:#eee;
      cursor:pointer;
      width:100%;
      text-align:center;
    }

    .btn:hover {
      background:#222832;
    }

    /* Collapsible sections */
    .section {
      margin-top:24px;
      padding:16px;
      background:#11141c;
      border-radius:8px;
      border:1px solid #262a36;
    }

    .section h2 {
      margin-top:0;
      font-size:18px;
      color:#9af7ff;
      cursor:pointer;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .collapse-arrow {
      font-size:16px;
      opacity:0.7;
      transition:0.2s;
    }

    .collapsed .collapse-arrow {
      transform:rotate(-90deg);
    }

    .collapsed .section-content {
      display:none;
    }

    /* Item cards */
    .item-card,
    .equipment-card {
      padding:10px;
      margin:8px 0;
      background:#1a1d24;
      border-radius:6px;
      border:1px solid #333;
      display:flex;
      align-items:center;
      gap:12px;
      position:relative;
    }

    .item-card:hover,
    .equipment-card:hover {
      background:#222832;
    }

    .item-icon {
      width:48px;
      height:48px;
      border-radius:4px;
      border:1px solid #444;
      object-fit:cover;
    }

    .item-info {
      flex-grow:1;
    }

    .item-name {
      font-weight:600;
      font-size:15px;
    }

    .item-qty {
      opacity:0.8;
      font-size:13px;
      margin-top:4px;
    }

    .item-actions button {
      padding:6px 10px;
      border-radius:4px;
      border:1px solid #444;
      background:#1a1d24;
      color:#eee;
      cursor:pointer;
      font-size:12px;
      margin-left:6px;
    }

    .item-actions button:hover {
      background:#222832;
    }

    /* Tooltip */
    .tooltip {
      display:none;
      position:absolute;
      left:10px;
      top:100%;
      background:#11141c;
      border:1px solid #262a36;
      padding:10px;
      border-radius:6px;
      width:260px;
      z-index:1000;
      font-size:13px;
    }

    .item-card:hover .tooltip,
    .equipment-card:hover .tooltip {
      display:block;
    }

    /* Rarity glows */
    .rarity-common { box-shadow:0 0 6px #bfbfbf55; }
    .rarity-uncommon { box-shadow:0 0 8px #7fff7f88; }
    .rarity-rare { box-shadow:0 0 8px #7fcfff88; }
    .rarity-epic { box-shadow:0 0 10px #c77fffaa; }
    .rarity-legendary { box-shadow:0 0 12px #ffbf5faa; }
  </style>
</head>
<body>

  <h1>Inventory</h1>
  <div id="usernameDisplay"></div>
  <div id="syncIndicator">Local Save ✔</div>

  <button class="btn" onclick="refreshInventory()">Refresh</button>

  <div id="inventoryContainer">Loading...</div>

  <button class="btn" onclick="goToCharacter()">Character</button>
  <button class="btn" onclick="goToMap()">World Map</button>

  <script type="module">
    import { requireSession } from "./session-guard.js";
    import { PlayerStorage } from "./player-storage.js";
    import { ITEM_DEFINITIONS } from "./item-definitions.js";

    (async () => {
      // Match landing/world-map pattern: requireSession populates window.syncState
      await requireSession();
      const { local, remote, conflict, username } = window.syncState || {};

      if (!username) {
        document.getElementById("usernameDisplay").textContent = "No user logged in";
        document.getElementById("inventoryContainer").textContent = "No active session.";
        return;
      }

      document.getElementById("usernameDisplay").textContent =
        "Logged in as: " + username;

      // Resolve player using same conflict logic as other pages
      let rawPlayer = null;
      if (conflict === "remote-only") rawPlayer = remote;
      else if (conflict === "local-only") rawPlayer = local;
      else if (conflict === "match") rawPlayer = local || remote;
      else if (conflict === "conflict") rawPlayer = remote || local;
      else rawPlayer = local || remote;

      // Fallback to PlayerStorage if syncState is empty
      if (!rawPlayer) {
        const fallback = PlayerStorage.load(username);
        if (fallback) rawPlayer = fallback;
      }

      if (!rawPlayer) {
        document.getElementById("inventoryContainer").textContent =
          "No player data found. Visit the landing page first.";
        return;
      }

      // Cache resolved player locally (keeps everything consistent)
      PlayerStorage.save(username, rawPlayer);

      let player = rawPlayer;

      function loadInventory() {
        player = PlayerStorage.load(username) || rawPlayer;
        renderInventory(player);
      }

      function refreshInventory() {
        loadInventory();
        document.getElementById("syncIndicator").textContent = "Local Save ✔";
      }

      // expose for button onclick
      window.refreshInventory = refreshInventory;

      loadInventory();

      function sortItems(items) {
        const rarityOrder = {
          common: 1,
          uncommon: 2,
          rare: 3,
          epic: 4,
          legendary: 5,
          mythic: 6
        };
      
        return items.sort((a, b) => {
          const rA = rarityOrder[a.rarity?.toLowerCase()] || 0;
          const rB = rarityOrder[b.rarity?.toLowerCase()] || 0;
      
          if (rA !== rB) return rA - rB;
      
          const nameA = a.name.toLowerCase();
          const nameB = b.name.toLowerCase();
          if (nameA !== nameB) return nameA.localeCompare(nameB);
      
          const qA = a.quantity ?? a.qty ?? 1;
          const qB = b.quantity ?? b.qty ?? 1;
          return qB - qA;
        });
      }

      function renderInventory(p) {
        const container = document.getElementById("inventoryContainer");
        const out = [];
      
        // 1. Create empty arrays FIRST
        const consumables = [];
        const materials = [];
        const quest = [];
        const misc = [];
      
        // 2. Fill them
        for (const item of p.inventory || []) {
          const type = item.type || "misc";
          switch (type) {
            case "consumable":
              consumables.push(item);
              break;
            case "material":
              materials.push(item);
              break;
            case "quest":
              quest.push(item);
              break;
            default:
              misc.push(item);
              break;
          }
        }
      
        // 3. Sort AFTER arrays are populated
        sortItems(consumables);
        sortItems(materials);
        sortItems(quest);
        sortItems(misc);
      
        // 4. Render
        out.push(renderEquipment(p));
        out.push(renderCategory("Consumables", consumables, true));
        out.push(renderCategory("Materials", materials, false));
        out.push(renderCategory("Quest Items", quest, false));
        out.push(renderCategory("Misc", misc, false));
      
        container.innerHTML = out.join("");
      }

      function renderEquipment(p) {
        const groups = {
          weapon: [],
          armor: [],
          accessory: [],
          other: []
        };
      
        for (const [slot, item] of Object.entries(p.equipment || {})) {
          if (groups[slot]) groups[slot].push({ slot, item });
          else groups.other.push({ slot, item });
        }
      
        return `
          <div class="section collapsible">
            <h2 onclick="toggleSection(this)">
              Equipment <span class="collapse-arrow">▼</span>
            </h2>
            <div class="section-content">
      
              ${renderEquipGroup("Weapons", groups.weapon)}
              ${renderEquipGroup("Armor", groups.armor)}
              ${renderEquipGroup("Accessories", groups.accessory)}
              ${groups.other.length ? renderEquipGroup("Other", groups.other) : ""}
      
            </div>
          </div>
        `;
      }

      function renderEquipGroup(title, items) {
        if (!items.length) return "";
      
        return `
          <div class="subsection">
            <h3 style="margin:10px 0 6px; color:#c0faff;">${title}</h3>
            ${items
              .map(({ slot, item }) => {
                const rarity = (item?.rarity || "common").toLowerCase();
                const icon = item?.icon || "/assets/items/default.png";
      
                return `
                  <div class="equipment-card rarity-${rarity}">
                    <img class="item-icon" src="${icon}">
                    <div class="item-info">
                      <div class="item-name">${item.name}</div>
                      <div class="item-qty">${format(slot)}</div>
                    </div>
                    <div class="item-actions">
                      <button onclick="unequipItem('${slot}')">Unequip</button>
                    </div>
                  </div>
                `;
              })
              .join("")}
          </div>
        `;
      }
      
      function renderCategory(title, items, allowUse) {
        return `
          <div class="section collapsible">
            <h2 onclick="toggleSection(this)">
              ${title} <span class="collapse-arrow">▼</span>
            </h2>
            <div class="section-content">
              ${
                items.length === 0
                  ? "<div>No items.</div>"
                  : items
                      .map(item => {
                        const qty = item.quantity ?? item.qty ?? 1;
                        const rarity = (item.rarity || "common").toLowerCase();
                        const icon =
                          ITEM_DEFINITIONS[item.name]?.icon ||
                          item.icon ||
                          "/assets/items/default.png";

                        return `
                          <div class="item-card rarity-${rarity}">
                            <img class="item-icon" src="${icon}">
                            
                            <div class="item-info">
                              <div class="item-name">${item.name}</div>
                              <div class="item-qty">x${qty}</div>
                            </div>
                          
                            <div class="tooltip">
                              ${ITEM_DEFINITIONS[item.name]?.description || "No description available."}
                            </div>
                          
                            <div class="item-actions">
                              ${item.slot ? `<button onclick="equipItem('${item.id}')">Equip</button>` : ""}
                              ${allowUse ? `<button onclick="useItem('${item.id}')">Use</button>` : ""}
                            </div>
                          </div>
                        `;
                      })
                      .join("")
              }
            </div>
          </div>
        `;
      }

      function useItem(itemId) {
        const item = player.inventory.find(i => i.id === itemId);
        if (!item) return;

        const currentQty = item.quantity ?? item.qty ?? 1;
        const newQty = currentQty - 1;

        if ("quantity" in item) item.quantity = newQty;
        else if ("qty" in item) item.qty = newQty;
        else item.quantity = newQty;

        if (newQty <= 0) {
          player.inventory = player.inventory.filter(i => i.id !== itemId);
        }

        PlayerStorage.save(username, player);
        refreshInventory();
      }

      function equipItem(itemId) {
        const item = player.inventory.find(i => i.id === itemId);
        if (!item || !item.slot) return;

        if (!player.equipment) player.equipment = {};
        player.equipment[item.slot] = item;

        PlayerStorage.save(username, player);
        refreshInventory();
      }

      function unequipItem(slot) {
        if (!player.equipment) return;
        delete player.equipment[slot];

        PlayerStorage.save(username, player);
        refreshInventory();
      }

      function toggleSection(header) {
        header.parentElement.classList.toggle("collapsed");
      }

      function format(str) {
        return String(str)
          .toLowerCase()
          .replace(/_/g, " ")
          .replace(/\b\w/g, c => c.toUpperCase());
      }

      // expose for inline handlers
      window.useItem = useItem;
      window.equipItem = equipItem;
      window.unequipItem = unequipItem;
      window.toggleSection = toggleSection;

      window.goToCharacter = () => (window.location.href = "character.html");
      window.goToMap = () => (window.location.href = "world-map.html");
    })();
  </script>
</body>
</html>
