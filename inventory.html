<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Inventory</title>

  <style>
    body {
      background:#0d0f14;
      color:#e8e8e8;
      font-family:system-ui, sans-serif;
      padding:24px;
    }

    h1 { color:#7fffd4; margin-bottom:4px; }
    #usernameDisplay { opacity:0.8; margin-bottom:6px; }
    #syncIndicator { font-size:13px; opacity:0.7; margin-bottom:16px; }

    .btn {
      margin-top:16px;
      padding:10px 14px;
      border-radius:6px;
      border:1px solid #444;
      background:#1a1d24;
      color:#eee;
      cursor:pointer;
      width:100%;
      text-align:center;
    }
    .btn:hover { background:#222832; }

    .section {
      margin-top:24px;
      padding:16px;
      background:#11141c;
      border-radius:8px;
      border:1px solid #262a36;
    }
    .section h2 {
      margin-top:0;
      font-size:18px;
      color:#9af7ff;
      cursor:pointer;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .collapse-arrow { font-size:16px; opacity:0.7; transition:0.2s; }
    .collapsed .collapse-arrow { transform:rotate(-90deg); }
    .collapsed .section-content { display:none; }

    .item-card, .equipment-card {
      padding:10px;
      margin:8px 0;
      background:#1a1d24;
      border-radius:6px;
      border:1px solid #333;
      display:flex;
      align-items:center;
      gap:12px;
      position:relative;
    }
    .item-card:hover, .equipment-card:hover { background:#222832; }

    .item-icon {
      width:48px;
      height:48px;
      border-radius:4px;
      border:1px solid #444;
      object-fit:cover;
    }

    .item-info { flex-grow:1; }
    .item-name { font-weight:600; font-size:15px; }
    .item-qty { opacity:0.8; font-size:13px; margin-top:4px; }

    .item-actions button {
      padding:6px 10px;
      border-radius:4px;
      border:1px solid #444;
      background:#1a1d24;
      color:#eee;
      cursor:pointer;
      font-size:12px;
      margin-left:6px;
    }
    .item-actions button:hover { background:#222832; }

    .rarity-common { box-shadow:0 0 6px #bfbfbf55; }
    .rarity-uncommon { box-shadow:0 0 8px #7fff7f88; }
    .rarity-rare { box-shadow:0 0 8px #7fcfff88; }
    .rarity-epic { box-shadow:0 0 10px #c77fffaa; }
    .rarity-legendary { box-shadow:0 0 12px #ffbf5faa; }
  </style>
</head>
<body>

  <h1>Inventory</h1>
  <div id="usernameDisplay"></div>
  <div id="syncIndicator">Local Save ✔</div>

  <button class="btn" onclick="refreshInventory()">Refresh</button>

  <div id="inventoryContainer">Loading...</div>

  <button class="btn" onclick="goToCharacter()">Character</button>
  <button class="btn" onclick="goToMap()">World Map</button>

  <script type="module">
    import { PlayerStorage } from "./player-storage.js";
    import { requireSession } from "./session-guard.js";

    (async () => {
      const session = requireSession();
      const username = session?.username;

      document.getElementById("usernameDisplay").textContent =
        username ? "Logged in as: " + username : "No user logged in";

      let player =
        PlayerStorage.load(username) ||
        JSON.parse(localStorage.getItem("player_" + username) || "{}");

      normalizeInventory(player);
      savePlayer(player);

      loadInventory();

      /* ------------------------------
         REFRESH + LOAD
      ------------------------------ */
      function refreshInventory() {
        loadInventory();
        document.getElementById("syncIndicator").textContent = "Local Save ✔";
      }

      function loadInventory() {
        player =
          PlayerStorage.load(username) ||
          JSON.parse(localStorage.getItem("player_" + username) || "{}");

        normalizeInventory(player);
        savePlayer(player);

        renderInventory(player);
      }

      function savePlayer(p) {
        localStorage.setItem("player_" + username, JSON.stringify(p));
        PlayerStorage.save(username, p);
      }

      /* ------------------------------
         NORMALIZE OLD ITEMS
      ------------------------------ */
      function normalizeInventory(p) {
        if (!Array.isArray(p.inventory)) p.inventory = [];

        p.inventory = p.inventory.map(item => {
          if (item.id && item.quantity !== undefined && item.type) return item;

          return {
            id: crypto.randomUUID(),
            name: item.name,
            quantity: item.quantity ?? item.qty ?? 1,
            rarity: item.rarity ?? "common",
            type: inferItemType(item.name),
            icon: "/assets/items/default.png"
          };
        });
      }

      function inferItemType(name) {
        const n = name.toLowerCase();
        if (n.includes("meat") || n.includes("herb") || n.includes("potion")) return "consumable";
        if (n.includes("pelt") || n.includes("ore") || n.includes("bark") || n.includes("leaf")) return "material";
        if (n.includes("token") || n.includes("trophy") || n.includes("map")) return "quest";
        return "misc";
      }

      /* ------------------------------
         RENDERING
      ------------------------------ */
      function renderInventory(p) {
        const container = document.getElementById("inventoryContainer");
        const out = [];

        const consumables = [];
        const materials = [];
        const quest = [];
        const misc = [];

        for (const item of p.inventory) {
          switch (item.type) {
            case "consumable": consumables.push(item); break;
            case "material": materials.push(item); break;
            case "quest": quest.push(item); break;
            default: misc.push(item); break;
          }
        }

        out.push(renderEquipment(p));
        out.push(renderCategory("Consumables", consumables, true));
        out.push(renderCategory("Materials", materials, false));
        out.push(renderCategory("Quest Items", quest, false));
        out.push(renderCategory("Misc", misc, false));

        container.innerHTML = out.join("");
      }

      function renderEquipment(p) {
        return `
          <div class="section collapsible">
            <h2 onclick="toggleSection(this)">
              Equipment <span class="collapse-arrow">▼</span>
            </h2>
            <div class="section-content">
              ${
                Object.entries(p.equipment || {})
                  .map(
                    ([slot, item]) => `
                    <div class="equipment-card rarity-${(item?.rarity || "common").toLowerCase()}">
                      <img class="item-icon" src="${item?.icon || "/assets/items/default.png"}">
                      <div class="item-info">
                        <div class="item-name">${item ? item.name : "—"}</div>
                        <div class="item-qty">${format(slot)}</div>
                      </div>
                      ${
                        item
                          ? `<div class="item-actions">
                               <button onclick="unequipItem('${slot}')">Unequip</button>
                             </div>`
                          : ""
                      }
                    </div>
                  `
                  )
                  .join("")
              }
            </div>
          </div>
        `;
      }

      function renderCategory(title, items, allowUse) {
        return `
          <div class="section collapsible">
            <h2 onclick="toggleSection(this)">
              ${title} <span class="collapse-arrow">▼</span>
            </h2>
            <div class="section-content">
              ${
                items.length === 0
                  ? "<div>No items.</div>"
                  : items
                      .map(
                        item => `
                        <div class="item-card rarity-${(item.rarity || "common").toLowerCase()}">
                          <img class="item-icon" src="${item.icon}">
                          <div class="item-info">
                            <div class="item-name">${item.name}</div>
                            <div class="item-qty">x${item.quantity}</div>
                          </div>
                          <div class="item-actions">
                            ${item.slot ? `<button onclick="equipItem('${item.id}')">Equip</button>` : ""}
                            ${allowUse ? `<button onclick="useItem('${item.id}')">Use</button>` : ""}
                          </div>
                        </div>
                      `
                      )
                      .join("")
              }
            </div>
          </div>
        `;
      }

      /* ------------------------------
         ITEM ACTIONS
      ------------------------------ */
      function useItem(itemId) {
        const item = player.inventory.find(i => i.id === itemId);
        if (!item) return;

        item.quantity -= 1;
        if (item.quantity <= 0) {
          player.inventory = player.inventory.filter(i => i.id !== itemId);
        }

        savePlayer(player);
        refreshInventory();
      }

      function equipItem(itemId) {
        const item = player.inventory.find(i => i.id === itemId);
        if (!item || !item.slot) return;

        player.equipment[item.slot] = item;

        savePlayer(player);
        refreshInventory();
      }

      function unequipItem(slot) {
        delete player.equipment[slot];
        savePlayer(player);
        refreshInventory();
      }

      function toggleSection(header) {
        header.parentElement.classList.toggle("collapsed");
      }

      function format(str) {
        return String(str).toLowerCase().replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
      }

      /* ------------------------------
         EXPOSE GLOBALS FOR BUTTONS
      ------------------------------ */
      window.refreshInventory = refreshInventory;
      window.useItem = useItem;
      window.equipItem = equipItem;
      window.unequipItem = unequipItem;
      window.toggleSection = toggleSection;

      window.goToCharacter = () => (window.location.href = "character.html");
      window.goToMap = () => (window.location.href = "world-map.html");
    })();
  </script>
</body>
</html>
