<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Purchase Log</title>
  <style>
    body {
      background:#0d0f14;
      color:#e8e8e8;
      font-family:system-ui, sans-serif;
      padding:24px;
    }
    h1 {
      color:#7fffd4;
      margin-bottom:4px;
    }
    .log-entry {
      background:#11141c;
      border:1px solid #262a36;
      border-radius:8px;
      padding:16px;
      margin-bottom:16px;
    }
  </style>
</head>
<body>

  <h1>Purchase Log</h1>
  <div id="logContainer">Loading...</div>

  <script type="module">
    import { requireSession } from "./session-guard.js";
    import { PURCHASE_LOG } from "./purchases.js";   // ← NEW

    const session = requireSession();
    if (!session) return;

    function loadLogs() {
      const container = document.getElementById("logContainer");
      const logs = PURCHASE_LOG || [];

      if (!logs.length) {
        container.textContent = "No purchases logged.";
        return;
      }

      container.innerHTML = logs
        .slice()
        .reverse()
        .map(
          log => `
            <div class="log-entry">
              <strong>${log.username}</strong> bought 
              <strong>${log.qty}x ${log.itemId}</strong><br>
              Cost: ${log.totalCost} gold<br>
              Shop: ${log.shopType}<br>
              <span style="opacity:0.7;">${new Date(
                log.timestamp
              ).toLocaleString()}</span>
            </div>
          `
        )
        .join("");
    }

    loadLogs();
  </script>

</body>
</html>
