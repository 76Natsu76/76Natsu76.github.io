<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin – World State</title>

  <style>
    body {
      background:#0d0f14;
      color:#e8e8e8;
      font-family:system-ui, sans-serif;
      padding:24px;
      max-width:900px;
      margin:auto;
    }

    h1 {
      color:#7fffd4;
      margin-bottom:4px;
    }

    #adminDisplay {
      opacity:0.8;
      margin-bottom:16px;
    }

    .section {
      background:#11141c;
      border:1px solid #262a36;
      border-radius:8px;
      padding:16px;
      margin-bottom:20px;
    }

    .section h2 {
      margin-top:0;
      color:#9af7ff;
      font-size:18px;
    }

    .stat-row {
      display:flex;
      justify-content:space-between;
      padding:4px 0;
      border-bottom:1px solid #1c1f28;
      font-size:14px;
    }

    .stat-row:last-child {
      border-bottom:none;
    }

    .tag {
      display:inline-block;
      padding:2px 6px;
      border-radius:4px;
      background:#1a1d24;
      border:1px solid #333;
      font-size:12px;
      margin-right:4px;
      margin-top:4px;
    }

    button {
      background:#1a1d24;
      color:#eee;
      border:1px solid #444;
      padding:8px 10px;
      border-radius:4px;
      font-size:14px;
      cursor:pointer;
      margin-right:8px;
      margin-top:6px;
    }

    button:hover {
      background:#222832;
    }

    #worldJson {
      margin-top:10px;
      background:#000;
      border-radius:6px;
      border:1px solid #333;
      padding:12px;
      font-family:monospace;
      font-size:12px;
      max-height:40vh;
      overflow-y:auto;
      white-space:pre-wrap;
    }

    .btn-nav {
      margin-top:16px;
      padding:8px 12px;
      border-radius:4px;
      border:1px solid #444;
      background:#1a1d24;
      color:#eee;
      cursor:pointer;
    }

    .btn-nav:hover {
      background:#222832;
    }

    #statusMessage {
      margin-top:8px;
      font-size:13px;
      opacity:0.85;
    }

    .boss-row {
      padding:6px 0;
      border-bottom:1px solid #1c1f28;
      font-size:14px;
    }

    .boss-row:last-child {
      border-bottom:none;
    }

    .boss-controls button {
      margin-top:4px;
      margin-right:6px;
    }
  </style>
</head>

<body>

  <h1>World State</h1>
  <div id="adminDisplay"></div>

  <!-- WORLD OVERVIEW -->
  <div class="section">
    <h2>Overview</h2>
    <div id="worldOverview">Loading world...</div>
    <div id="statusMessage"></div>
  </div>

  <!-- WORLD BOSS MANAGEMENT -->
  <div class="section">
    <h2>World Boss Management</h2>
    <div id="bossOverview">Loading boss data...</div>
  </div>

  <!-- RAW JSON -->
  <div class="section">
    <h2>Raw World JSON</h2>
    <div id="worldJson">Waiting...</div>
  </div>

  <button class="btn-nav" onclick="goAdmin()">Back to Admin Dashboard</button>

  <script type="module">
    import { requireSession } from "./session-guard.js";
    import { WORLD_BOSSES } from "./boss-definitions.js";

    const session = await requireSession();
    const admin = session.username;

    document.getElementById("adminDisplay").textContent =
      admin ? "Admin: " + admin : "Not logged in";

    async function loadWorld() {
      const overview = document.getElementById("worldOverview");
      const jsonBox = document.getElementById("worldJson");
      const bossBox = document.getElementById("bossOverview");

      overview.textContent = "Loading world...";
      jsonBox.textContent = "Loading...";
      bossBox.textContent = "Loading...";

      try {
        const res = await fetch("/api/admin/world", { cache: "no-store" });
        if (!res.ok) {
          overview.textContent = "Failed to load world state.";
          jsonBox.textContent = "Failed to load.";
          bossBox.textContent = "Failed to load.";
          return;
        }

        const world = await res.json();
        renderWorld(world);
        renderBosses(world);
      } catch (err) {
        overview.textContent = "Network error: " + err.message;
        jsonBox.textContent = "Network error.";
        bossBox.textContent = "Network error.";
      }
    }

    function renderWorld(world) {
      const overview = document.getElementById("worldOverview");
      const jsonBox = document.getElementById("worldJson");

      if (!world) {
        overview.textContent = "No world data.";
        jsonBox.textContent = "No data.";
        return;
      }

      const rows = [];
      rows.push(row("Day", world.day ?? "?"));
      rows.push(row("Time", world.time ?? "Unknown"));
      rows.push(row("Season", format(world.season ?? "Unknown")));
      rows.push(row("Weather", format(world.weather ?? "Unknown")));
      rows.push(row("Tick Count", world.tickCount ?? 0));
      rows.push(row("Regions Active", Object.keys(world.regions || {}).length));

      overview.innerHTML = rows.join("");
      jsonBox.textContent = JSON.stringify(world, null, 2);
    }

    function renderBosses(world) {
      const box = document.getElementById("bossOverview");
      const now = Date.now();

      const rows = [];

      for (const regionKey in world.regions) {
        const region = world.regions[regionKey];
        const boss = findBossForRegion(regionKey);

        if (!boss) continue;

        let status = "";
        if (region.worldBossActive) {
          status = `<span class="tag" style="border-color:#ff4444;">ACTIVE</span>`;
        } else if (region.worldBossAwakening) {
          const minutes = Math.ceil((region.worldBossAwakening - now) / 60000);
          status = `<span class="tag" style="border-color:#ffcc66;">Awakening in ${minutes}m</span>`;
        } else {
          status = `<span class="tag" style="border-color:#888;">Dormant</span>`;
        }

        rows.push(`
          <div class="boss-row">
            <strong>${boss.name}</strong> — Region: ${regionKey}<br>
            Status: ${status}
            <div class="boss-controls">
              <button onclick="forceSpawn('${regionKey}')">Force Spawn</button>
              <button onclick="forceDespawn('${regionKey}')">Force Despawn</button>
              <button onclick="resetTimer('${regionKey}')">Reset Timer</button>
            </div>
          </div>
        `);
      }

      box.innerHTML = rows.join("");
    }

    function row(label, value) {
      return `
        <div class="stat-row">
          <span>${label}</span>
          <span>${value}</span>
        </div>
      `;
    }

    function format(str) {
      return String(str)
        .toLowerCase()
        .replace(/_/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function findBossForRegion(regionKey) {
      for (const key in WORLD_BOSSES) {
        const boss = WORLD_BOSSES[key];
        if (boss.region === regionKey) return boss;
      }
      return null;
    }

    async function postBossAction(url, payload, message) {
      const status = document.getElementById("statusMessage");
      status.textContent = "Working...";

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        status.textContent = data.message || message;
        await loadWorld();
      } catch (err) {
        status.textContent = "Error: " + err.message;
      }
    }

    // Boss control endpoints
    window.forceSpawn = (regionKey) =>
      postBossAction("/api/admin/boss/force-spawn", { admin, regionKey }, "Boss spawned.");

    window.forceDespawn = (regionKey) =>
      postBossAction("/api/admin/boss/force-despawn", { admin, regionKey }, "Boss despawned.");

    window.resetTimer = (regionKey) =>
      postBossAction("/api/admin/boss/reset-timer", { admin, regionKey }, "Boss timer reset.");

    function goAdmin() {
      window.location.href = "admin-dashboard.html";
    }

    loadWorld();
  </script>

</body>
</html>
