<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Character</title>

  <style>
    body {
      background:#0d0f14;
      color:#e8e8e8;
      font-family:system-ui, sans-serif;
      padding:24px;
    }

    h1 {
      color:#7fffd4;
      margin-bottom:4px;
    }

    #usernameDisplay {
      opacity:0.8;
      margin-bottom:16px;
    }

    #syncIndicator {
      font-size:13px;
      opacity:0.7;
      margin-bottom:10px;
    }

    .section {
      margin-top:24px;
      padding:16px;
      background:#11141c;
      border-radius:8px;
      border:1px solid #262a36;
    }

    .section h2 {
      margin-top:0;
      font-size:18px;
      color:#9af7ff;
      cursor:pointer;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .collapse-arrow {
      font-size:16px;
      opacity:0.7;
      transition:0.2s;
    }

    .collapsed .collapse-arrow {
      transform:rotate(-90deg);
    }

    .collapsed .section-content {
      display:none;
    }

    .stat-row {
      display:flex;
      justify-content:space-between;
      padding:4px 0;
      border-bottom:1px solid #1c1f28;
      font-size:14px;
    }

    .stat-row:last-child {
      border-bottom:none;
    }

    .portrait-frame {
      width:160px;
      height:160px;
      border-radius:8px;
      overflow:hidden;
      border:2px solid #444;
      background:#000;
      display:flex;
      justify-content:center;
      align-items:center;
      margin:0 auto;
      position:relative;
    }

    .portrait-img {
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .portrait-common { box-shadow:0 0 6px #bfbfbf55; }
    .portrait-uncommon { box-shadow:0 0 8px #7fff7f88; }
    .portrait-rare { box-shadow:0 0 8px #7fcfff88; }
    .portrait-epic { box-shadow:0 0 10px #c77fffaa; }
    .portrait-legendary { box-shadow:0 0 12px #ffbf5faa; }

    .profession-emblem {
      width:48px;
      height:48px;
      object-fit:contain;
      margin:10px auto;
      display:block;
      opacity:0.9;
    }

    .equipment-card,
    .ability-card,
    .status-card,
    .talent-node {
      padding:10px;
      margin:8px 0;
      background:#1a1d24;
      border-radius:6px;
      border:1px solid #333;
      position:relative;
    }

    .equipment-card:hover,
    .ability-card:hover,
    .status-card:hover,
    .talent-node:hover {
      background:#222832;
    }

    .tooltip {
      display:none;
      position:absolute;
      left:10px;
      top:100%;
      background:#11141c;
      border:1px solid #262a36;
      padding:10px;
      border-radius:6px;
      width:260px;
      z-index:1000;
      font-size:13px;
    }

    .equipment-card:hover .tooltip,
    .ability-card:hover .tooltip,
    .status-card:hover .tooltip,
    .talent-node:hover .tooltip {
      display:block;
    }

    .ability-icon {
      width:40px;
      height:40px;
      border-radius:4px;
      border:1px solid #444;
      object-fit:cover;
      margin-right:10px;
    }

    .ability-card {
      display:flex;
      align-items:center;
      gap:10px;
    }

    .xp-bar {
      margin-top:10px;
      height:14px;
      background:#333;
      border-radius:7px;
      overflow:hidden;
    }

    .xp-fill {
      height:100%;
      background:#7fcfff;
      width:0%;
      transition:width 1s ease-in-out;
    }

    .btn {
      margin-top:16px;
      padding:10px 14px;
      border-radius:6px;
      border:1px solid #444;
      background:#1a1d24;
      color:#eee;
      cursor:pointer;
      width:100%;
      text-align:center;
    }

    .btn:hover {
      background:#222832;
    }

    .talent-node {
      border-left:4px solid #7fcfff;
    }

    .talent-rank {
      opacity:0.8;
      font-size:13px;
      margin-top:4px;
    }
  </style>
</head>

<body>

  <h1>Character</h1>
  <div id="usernameDisplay"></div>
  <div id="syncIndicator">Syncing with server…</div>
  <div id="conflictModal" style="display:none; background:#222; color:#eee; padding:10px; border-radius:6px; margin-top:10px;">
    <p>Cloud and local data differ for this character. Which version do you want to use?</p>
    <button id="useCloudBtn" class="btn">Use Cloud Version</button>
    <button id="useLocalBtn" class="btn">Use Local Version</button>
  </div>

  <button class="btn" onclick="loadFromKV()">Load from KV</button>
  <button class="btn" onclick="pushToKV()">Push to KV</button>

  <div id="characterContainer">Loading...</div>

  <button class="btn" onclick="goToInventory()">Inventory</button>
  <button class="btn" onclick="goToMap()">World Map</button>

  <!-- MODULE SCRIPT -->
  <script type="module">
    import { requireSession } from "./session-guard.js";
    import { PlayerStorage } from "./player-storage.js";
  
    (async () => {
      /* ---------------------------------------------------------
         1. LOAD PLAYER (same logic as world-map & inventory)
      --------------------------------------------------------- */
      await requireSession();
      const { local, remote, conflict, username } = window.syncState || {};
  
      if (!username) {
        document.getElementById("characterContainer").textContent =
          "No active session.";
        return;
      }
  
      let rawPlayer = null;
      if (conflict === "remote-only") rawPlayer = remote;
      else if (conflict === "local-only") rawPlayer = local;
      else if (conflict === "match") rawPlayer = local || remote;
      else if (conflict === "conflict") rawPlayer = remote || local;
      else rawPlayer = local || remote;
  
      if (!rawPlayer) {
        const fallback = PlayerStorage.load(username);
        if (fallback) rawPlayer = fallback;
      }
  
      if (!rawPlayer) {
        document.getElementById("characterContainer").textContent =
          "No player data found. Visit landing page first.";
        return;
      }
  
      PlayerStorage.save(username, rawPlayer);
      const player = rawPlayer;
  
      /* ---------------------------------------------------------
         2. RENDER CHARACTER PAGE
      --------------------------------------------------------- */
      renderCharacter(player);
  
      function renderCharacter(p) {
        renderHeader(p);
        renderStats(p);
        renderEquipment(p);
        renderTalentTree(p);
      }
  
      /* ---------------------------------------------------------
         3. HEADER
      --------------------------------------------------------- */
      function renderHeader(p) {
        document.getElementById("charName").textContent = p.username;
        document.getElementById("charLevel").textContent = "Lv " + p.level;
        document.getElementById("charProfession").textContent =
          format(p.profession);
        document.getElementById("charRace").textContent =
          format(p.subrace || p.race);
      }
  
      /* ---------------------------------------------------------
         4. STATS PANEL
      --------------------------------------------------------- */
      function renderStats(p) {
        const s = p.stats || {};
        document.getElementById("statHP").textContent = `${p.hpCurrent}/${p.hpMax}`;
        document.getElementById("statMP").textContent = `${p.mana}/${p.manaMax}`;
        document.getElementById("statATK").textContent = s.atk || p.atk;
        document.getElementById("statDEF").textContent = s.def || p.def;
        document.getElementById("statSPD").textContent = s.speed || p.speed;
        document.getElementById("statCrit").textContent =
          ((s.crit || p.crit) * 100).toFixed(1) + "%";
        document.getElementById("statCritDmg").textContent =
          ((s.critDmg || p.critDmg) * 100).toFixed(0) + "%";
      }
  
      /* ---------------------------------------------------------
         5. EQUIPMENT PANEL
      --------------------------------------------------------- */
      function renderEquipment(p) {
        const eq = p.equipment || {};
        const container = document.getElementById("equipmentPanel");
  
        const slots = ["weapon", "armor", "accessory"];
        const out = slots
          .map(slot => {
            const item = eq[slot];
            if (!item) {
              return `
                <div class="equip-slot">
                  <div class="equip-label">${format(slot)}</div>
                  <div class="equip-empty">—</div>
                </div>
              `;
            }
  
            return `
              <div class="equip-slot">
                <div class="equip-label">${format(slot)}</div>
                <div class="equip-item rarity-${(item.rarity || "common").toLowerCase()}">
                  <div class="equip-name">${item.name}</div>
                  <div class="equip-stats">${renderEquipBonuses(item.bonuses)}</div>
                </div>
              </div>
            `;
          })
          .join("");
  
        container.innerHTML = out;
      }
  
      function renderEquipBonuses(b) {
        if (!b) return "";
        return Object.entries(b)
          .map(([k, v]) => `${format(k)} +${v}`)
          .join(", ");
      }
  
      /* ---------------------------------------------------------
         6. TALENT TREE
      --------------------------------------------------------- */
      function renderTalentTree(p) {
        const panel = document.getElementById("talentTreePanel");
        const def = p.talentTreeDefinition;
        const chosen = Array.isArray(p.talentTree) ? p.talentTree : [];
  
        if (!def || !def.tier1) {
          panel.innerHTML = "<div>No talent tree data.</div>";
          return;
        }
  
        const t1 = renderTier("Tier 1", def.tier1, chosen);
        const t2 = def.tier2 ? renderTier("Tier 2", def.tier2, chosen) : "";
        const t3 = def.tier3 ? renderTier("Tier 3", def.tier3, chosen) : "";
  
        panel.innerHTML = t1 + t2 + t3;
      }
  
      function renderTier(title, tierDef, chosen) {
        const branches = tierDef.branches || {};
        const capstone = tierDef.capstone;
  
        let out = `
          <div class="talent-tier">
            <h3 class="tier-title">${title}</h3>
            <div class="talent-branches">
        `;
  
        // Branches
        for (const [branchName, nodes] of Object.entries(branches)) {
          out += `
            <div class="talent-branch">
              <div class="branch-title">${format(branchName)}</div>
              <div class="branch-nodes">
                ${nodes.map(n => renderTalentNode(n, chosen)).join("")}
              </div>
            </div>
          `;
        }
  
        // Capstone
        if (capstone) {
          out += `
            <div class="talent-capstone">
              ${renderTalentNode(capstone, chosen, true)}
            </div>
          `;
        }
  
        out += `</div></div>`;
        return out;
      }
  
      function renderTalentNode(node, chosen, isCapstone = false) {
        const isChosen = chosen.some(c => c.id === node.id);
        const locked = node.requires && !chosen.some(c => c.id === node.requires);
  
        return `
          <div class="talent-node ${isChosen ? "chosen" : ""} ${
          locked ? "locked" : ""
        } ${isCapstone ? "capstone" : ""}">
            <div class="talent-name">${node.name}</div>
            <div class="talent-desc">${node.description}</div>
            <div class="talent-bonus">${renderTalentBonuses(node.bonuses)}</div>
          </div>
        `;
      }
  
      function renderTalentBonuses(b) {
        if (!b) return "";
        return Object.entries(b)
          .map(([k, v]) => {
            if (k === "special") return format(v);
            if (typeof v === "number") return `${format(k)} +${v}`;
            return `${format(k)}: ${v}`;
          })
          .join("<br>");
      }
  
      /* ---------------------------------------------------------
         7. HELPERS
      --------------------------------------------------------- */
      function format(str) {
        return String(str)
          .toLowerCase()
          .replace(/_/g, " ")
          .replace(/\b\w/g, c => c.toUpperCase());
      }
  
      /* ---------------------------------------------------------
         8. NAVIGATION
      --------------------------------------------------------- */
      window.goToInventory = () => (window.location.href = "inventory.html");
      window.goToMap = () => (window.location.href = "world-map.html");
    })();
  </script>

</body>
</html>
