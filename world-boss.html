<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>World Boss</title>
  <link rel="stylesheet" href="world-boss.css" />
</head>

<body>
  <div id="worldboss-container">
    <h1>World Boss Encounter</h1>
    <div id="worldboss-content"></div>
  </div>

  <script type="module">
    import { requireSession } from "./session-guard.js";
    import { WorldSim } from "./world-simulation.js";
    import { initWorldBossUI } from "./world-boss-ui.js";

    // Ensure session
    const session = await requireSession();
    const username = session.username;

    // Initialize world simulation (loads region state, boss timers, etc.)
    await WorldSim.init();

    // Initialize the new boss UI
    initWorldBossUI(username);
  </script>

</body>
</html>
