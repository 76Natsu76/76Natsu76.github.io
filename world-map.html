<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>World Map</title>
  <link rel="stylesheet" href="world-map.css">
</head>

<body>

  <h1>World Map</h1>

  <div id="seasonBanner"></div>
  <div id="usernameDisplay"></div>
  
  <div id="globalAnnouncements" class="global-announcements"></div>
  <details id="worldEventsPanel" class="world-events-panel">
    <summary>World Events</summary>
    <div id="worldEventsContent"></div>
  </details>

  <div id="legend" class="legend-box">
    <div><span class="legend-icon anomaly"></span> Anomaly</div>
    <div><span class="legend-icon migration"></span> Migration</div>
    <div><span class="legend-icon global"></span> Global Modifier</div>
  </div>

  <div id="mapContainer">Loading world...</div>

  <button class="btn" id="characterBtn">Character</button>
  <button class="btn" id="inventoryBtn">Inventory</button>
  <button class="btn" id="bestiaryBtn">Bestiary</button>
  

  <script type="module" src="world-map.js"></script>

</body>
</html>
