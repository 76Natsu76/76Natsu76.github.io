<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Combat</title>

  <style>
    body {
      background:#0d0f14;
      color:#e8e8e8;
      font-family:system-ui, sans-serif;
      padding:24px;
    }
    h1 {
      color:#7fffd4;
      margin-bottom:4px;
    }
    #usernameDisplay {
      opacity:0.8;
      margin-bottom:16px;
    }
    .panel {
      background:#11141c;
      border:1px solid #262a36;
      border-radius:8px;
      padding:16px;
      margin-bottom:20px;
    }
    .panel h2 {
      margin-top:0;
      color:#9af7ff;
    }
    .hp-bar {
      height:24px;
      background:#333;
      border-radius:6px;
      overflow: hidden; 
      background: rgba(0,0,0,0.3);
      margin-top:6px;
    }
    .actions button {
      display:block;
      width:100%;
      margin-top:10px;
      padding:10px;
      border-radius:6px;
      border:1px solid #444;
      background:#1a1d24;
      color:#eee;
      cursor:pointer;
      font-size:15px;
    }
    .actions button:hover {
      background:#222832;
    }
    .primary {
      background:#2e7d32;
      border-color:#1b5e20;
    }
    .primary:hover {
      background:#388e3c;
    }

    #log {
      background:#000;
      border:1px solid #333;
      padding:12px;
      border-radius:6px;
      font-family:monospace;
      font-size:14px;
      max-height:50vh;
      overflow-y:auto;
      white-space:pre-wrap;
    }
    /* Reward panel */
    .reward-box {
      background:#11141c;
      border:1px solid #262a36;
      border-radius:8px;
      padding:20px;
      margin-top:20px;
      animation: rewardFade 0.6s ease-out;
    }

    @keyframes rewardFade {
      from {
        opacity:0; transform:translateY(10px);
      }
      to {
        opacity:1; transform:translateY(0);
      }
    }

    /* XP bar */
    .xp-bar {
      margin-top:10px;
      height:24px;
      background:#333;
      border-radius:7px;
      overflow: hidden; 
      background: rgba(0,0,0,0.3);
      overflow:hidden;
    }

    .xp-fill {
      height:100%;
      background:#7fcfff;
      width:0%;
      transition: width 1s ease-in-out;
    }

    /* Loot card */
    .loot-card {
      margin-top:12px;
      padding:12px;
      background:#1a1d24;
      border-radius:6px;
      border:1px solid #333;
      animation: lootPop 0.4s ease-out;
    }

    @keyframes lootPop {
      0% {
        transform:scale(0.8); opacity:0;
      }
      100% {
        transform:scale(1); opacity:1;
      }
    }

    /* Rarity glow */
    .loot-common {
      border-color:#bfbfbf;
    }
    .loot-uncommon {
      border-color:#7fff7f; box-shadow:0 0 6px #7fff7f55;
    }
    .loot-rare {
      border-color:#7fcfff; box-shadow:0 0 6px #7fcfff55;
    }
    .loot-epic {
      border-color:#c77fff; box-shadow:0 0 6px #c77fff55;
    }
    .loot-legendary {
      border-color:#ffbf5f; box-shadow:0 0 6px #ffbf5f55;
    }

    /* Level-up highlight */
    .level-up {
      margin-top:10px;
      padding:10px;
      background:#2e7d32;
      border-radius:6px;
      border:1px solid #1b5e20;
      color:#fff;
      animation: levelUpGlow 1.2s infinite ease-in-out;
    }

    @keyframes levelUpGlow {
      0% {
        box-shadow:0 0 6px rgba(46,125,50,0.4);
      }
      50% {
        box-shadow:0 0 12px rgba(46,125,50,0.9);
      }
      100% {
        box-shadow:0 0 6px rgba(46,125,50,0.4);
      }
    }

    .popup {
      position: absolute;
      font-weight: bold;
      pointer-events: none;
      transition: all 0.8s ease-out;
    }
    
    .popup.damage { color: #ff4d4d; }
    .popup.heal { color: #7fff7f; }

    /* Continue buttons */
    .reward-btn {
      margin-top:14px;
      padding:10px 14px;
      border-radius:6px;
      border:1px solid #444;
      background:#1a1d24;
      color:#eee;
      cursor:pointer;
      width:100%;
      text-align:center;
    }

    .reward-btn:hover {
      background:#222832;
    }

    .modal {
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.8);
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:999;
    }
    
    .hidden {
      display: none !important;
    }

    .modal-content {
      background:#11141c;
      border:1px solid #262a36;
      padding:20px;
      border-radius:8px;
      width:400px;
    }

    .close-btn {
      margin-top:12px;
      padding:8px 12px;
      border-radius:4px;
      border:1px solid #444;
      background:#1a1d24;
      color:#eee;
      cursor:pointer;
    }

    .close-btn:hover {
      background:#222832;
    }

    /* Enemy inspection */
    .inspect-row {
      margin:8px 0;
      font-size:14px;
      opacity:0.9;
    }

    .inspect-ability {
      padding:6px;
      margin:4px 0;
      background:#1a1d24;
      border-radius:4px;
      border:1px solid #333;
    }

    /* Equipment swap */
    .swap-slot,
    .swap-item {
      padding:8px;
      margin:6px 0;
      background:#1a1d24;
      border-radius:4px;
      border:1px solid #333;
      cursor:pointer;
    }

    .swap-slot:hover,
    .swap-item:hover {
      background:#222832;
    }

    /* HP bar animations */
    .hp-fill {
      height: 100%;
      transition: width 0.6s ease-in-out;
    }
    
    /* HUD PANEL */
    .hud-panel {
      padding: 10px;
      border-radius: 10px;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
      width: 260px;
    }
    
    /* BAR CONTAINER */
    .hud-bar {
      position: relative;
      height: 20px;
      border-radius: 6px;
      overflow: hidden;
      background: rgba(0,0,0,0.4);
      margin: 6px 0;
    }
    
    /* BAR FILL */
    .bar-fill {
      height: 100%;
      width: 0%;
      transition: width 0.35s ease-out;
    }
    
    /* HP BAR COLORS */
    .hp-bar .bar-fill {
      background: linear-gradient(90deg, #ff3b3b, #ff7b7b);
    }
    
    /* MANA BAR COLORS */
    .mana-bar .bar-fill {
      background: linear-gradient(90deg, #3b7bff, #7bb3ff);
    }
    
    /* ULT BAR COLORS */
    .ult-bar .bar-fill {
      background: linear-gradient(90deg, #ffd700, #fff27b);
    }
    
    /* BAR TEXT */
    .bar-text {
      position: absolute;
      width: 100%;
      text-align: center;
      top: 0;
      left: 0;
      font-size: 13px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 4px #000;
    }

    .damage-popup {
      position: absolute;
      font-weight: bold;
      color: #ff4444;
      font-size: 20px;
      animation: dmgFloat 0.8s ease-out forwards;
      pointer-events: none;
    }
    
    .heal-popup {
      position: absolute;
      font-weight: bold;
      color: #44ff44;
      font-size: 20px;
      animation: healFloat 0.8s ease-out forwards;
      pointer-events: none;
    }
    
    @keyframes dmgFloat {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-30px); }
    }
    
    @keyframes healFloat {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-30px); }
    }

    .damage-flash {
      animation: damageFlash 0.4s ease-out;
    }

    @keyframes damageFlash {
      0% {
        background-color: rgba(255,0,0,0.6);
      }
      100% {
        background-color: transparent;
      }
    }

    .heal-flash {
      animation: healFlash 0.4s ease-out;
    }

    @keyframes healFlash {
      0% {
        background-color: rgba(0,255,0,0.6);
      }
      100% {
        background-color: transparent;
      }
    }

    /* Ability card with icon */
    .ability-card {
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px;
      margin:8px 0;
      background:#1a1d24;
      border-radius:6px;
      border:1px solid #333;
      position:relative;
    }

    .ability-icon {
      width:48px;
      height:48px;
      border-radius:4px;
      background:#000;
      border:1px solid #444;
      object-fit:cover;
    }

    /* Tooltip */
    .ability-tooltip {
      display:none;
      position:absolute;
      left:60px;
      top:0;
      background:#11141c;
      border:1px solid #262a36;
      padding:10px;
      border-radius:6px;
      width:260px;
      z-index:1000;
      font-size:13px;
    }

    .ability-card:hover .ability-tooltip {
      display:block;
    }

    /* Cooldown overlay */
    .cooldown-overlay {
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.6);
      color:#fff;
      font-size:20px;
      display:flex;
      justify-content:center;
      align-items:center;
      border-radius:6px;
      pointer-events:none;
    }

    /* Disabled ability */
    .ability-disabled {
      opacity:0.4;
      pointer-events:none;
    }

    /* Ultimate charge bar container */
    .ult-bar {
      margin-top:8px;
      height:24px;
      background:#333;
      border-radius:6px;
      overflow: hidden; 
      background: rgba(0,0,0,0.3);
      position:relative;
    }

    /* Fill */
    .ult-fill {
      height:100%;
      background:#ffbf5f;
      width:0%;
      transition: width 0.6s ease-in-out;
    }

    /* Glow when ready */
    .ult-ready-glow {
      animation: ultGlow 1.2s infinite ease-in-out;
    }

    @keyframes ultGlow {
      0% {
        box-shadow: 0 0 6px rgba(255,191,95,0.4);
      }
      50% {
        box-shadow: 0 0 12px rgba(255,191,95,0.9);
      }
      100% {
        box-shadow: 0 0 6px rgba(255,191,95,0.4);
      }
    }

    /* Pulse when used */
    .ult-pulse {
      animation: ultPulse 0.5s ease-out;
    }

    @keyframes ultPulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.15);
      }
      100% {
        transform: scale(1);
      }
    }

    /* Portrait frame */
    .portrait-frame {
      width:140px;
      height:140px;
      border-radius:8px;
      overflow:hidden;
      border:2px solid #444;
      background:#000;
      display:flex;
      justify-content:center;
      align-items:center;
      margin:0 auto;
      position:relative;
    }

    /* Portrait image */
    .portrait-img {
      width:100%;
      height:100%;
      object-fit:cover;
    }

    /* Rarity glow */
    .portrait-common {
      box-shadow:0 0 6px #bfbfbf55;
    }
    .portrait-uncommon {
      box-shadow:0 0 8px #7fff7f88;
    }
    .portrait-rare {
      box-shadow:0 0 8px #7fcfff88;
    }
    .portrait-epic {
      box-shadow:0 0 8px #c77fff88;
    }
    .portrait-legendary {
      box-shadow:0 0 10px #ffbf5faa;
    }

    /* Cinematic intro panel */
    .cinematic-intro {
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.85);
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:2000;
      animation: introFadeIn 0.6s ease-out;
    }

    @keyframes introFadeIn {
      from {
        opacity:0;
      }
      to {
        opacity:1;
      }
    }

    .cinematic-content {
      text-align:center;
      animation: introPop 0.5s ease-out;
    }

    @keyframes introPop {
      0% {
        transform:scale(0.8); opacity:0;
      }
      100% {
        transform:scale(1); opacity:1;
      }
    }

    .vs-text {
      font-size:48px;
      font-weight:700;
      color:#ffbf5f;
      margin-top:20px;
      text-shadow:0 0 12px #ffbf5f;
    }

    /* Roar shake */
    .roar-shake {
      animation: roarShake 0.5s ease-in-out;
    }

    @keyframes roarShake {
      0% {
        transform:translateX(0);
      }
      20% {
        transform:translateX(-8px);
      }
      40% {
        transform:translateX(8px);
      }
      60% {
        transform:translateX(-6px);
      }
      80% {
        transform:translateX(6px);
      }
      100% {
        transform:translateX(0);
      }
    }

    /* Screen shake */
    .screen-shake {
      animation: screenShake 0.4s ease-in-out;
    }

    @keyframes screenShake {
      0% {
        transform:translate(0,0);
      }
      20% {
        transform:translate(-6px, 4px);
      }
      40% {
        transform:translate(6px, -4px);
      }
      60% {
        transform:translate(-4px, 2px);
      }
      80% {
        transform:translate(4px, -2px);
      }
      100% {
        transform:translate(0,0);
      }
    }

    /* CRIT FLASH */
    .crit-flash {
      animation: critFlashAnim 0.25s ease-out;
    }
    
    @keyframes critFlashAnim {
      0% { background-color: rgba(255,255,0,0.4); }
      100% { background-color: transparent; }
    }
    
    /* ELEMENTAL PULSE */
    .pulse-fire { animation: pulseFire 0.4s ease-out; }
    .pulse-ice { animation: pulseIce 0.4s ease-out; }
    .pulse-nature { animation: pulseNature 0.4s ease-out; }
    .pulse-dark { animation: pulseDark 0.4s ease-out; }
    .pulse-light { animation: pulseLight 0.4s ease-out; }
    
    @keyframes pulseFire {
      0% { box-shadow: 0 0 20px #ff4500; }
      100% { box-shadow: none; }
    }
    
    @keyframes pulseIce {
      0% { box-shadow: 0 0 20px #00bfff; }
      100% { box-shadow: none; }
    }
    
    @keyframes pulseNature {
      0% { box-shadow: 0 0 20px #32cd32; }
      100% { box-shadow: none; }
    }
    
    @keyframes pulseDark {
      0% { box-shadow: 0 0 20px #551a8b; }
      100% { box-shadow: none; }
    }
    
    @keyframes pulseLight {
      0% { box-shadow: 0 0 20px #ffd700; }
      100% { box-shadow: none; }
    }

    .lightning-pulse {
      animation: lightningPulse 0.5s ease-out;
    }

    @keyframes lightningPulse {
      0% {
        box-shadow:0 0 12px rgba(255,255,120,0.9);
      }
      100% {
        box-shadow:0 0 0 rgba(255,255,120,0);
      }
    }

    /* DOT/HOT tick flash */
    .dot-tick {
      animation: dotTick 0.4s ease-out;
    }

    @keyframes dotTick {
      0% {
        background-color:rgba(255,80,0,0.4);
      }
      100% {
        background-color:transparent;
      }
    }

    .hot-tick {
      animation: hotTick 0.4s ease-out;
    }
    @keyframes hotTick {
      0% {
        background-color:rgba(80,255,80,0.4);
      }
      100% {
        background-color:transparent;
      }
    }

    .status-icons {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }
    
    .status-icons img {
      width: 20px;
      height: 20px;
      filter: drop-shadow(0 0 3px #000);
    }


    /* Modifier row */
    .modifier-row {
      display:flex;
      align-items:center;
      gap:10px;
      margin-top:8px;
      padding:8px;
      background:#1a1d24;
      border-radius:6px;
      border:1px solid #333;
      font-size:14px;
    }
    /* Modifier icon */
    .modifier-icon {
      width:32px;
      height:32px;
      object-fit:contain;
    }
    /* Modifier label */
    .modifier-label {
      opacity:0.9;
    }
    /* Modifier container */
    .modifier-box {
      margin-top:16px;
    }
    /* Modal backdrop */
    .item-modal {
      position: fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.65);
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:9999;
      transition:0.2s;
    }

    .item-modal.hidden {
      opacity:0;
      pointer-events:none;
    }

    /* Modal window */
    .item-modal-content {
      background:#11141c;
      border:1px solid #262a36;
      border-radius:10px;
      padding:20px;
      width:420px;
      max-height:80vh;
      overflow-y:auto;
      animation:popIn 0.25s ease-out;
    }

    @keyframes popIn {
      from { transform:scale(0.85); opacity:0; }
      to   { transform:scale(1); opacity:1; }
    }

    .item-entry {
      background:#1a1d24;
      border:1px solid #333;
      border-radius:6px;
      padding:12px;
      margin:10px 0;
      display:flex;
      justify-content:space-between;
      align-items:center;
      transition:0.15s;
    }

    .item-entry:hover {
      background:#222832;
    }

    .item-info {
      max-width:70%;
    }

    .item-name {
      font-weight:600;
      font-size:15px;
    }

    .item-desc {
      opacity:0.8;
      font-size:13px;
      margin-top:4px;
    }

    .item-qty {
      opacity:0.8;
      font-size:13px;
      margin-top:4px;
    }

    .item-actions button {
      padding:6px 10px;
      border-radius:4px;
      border:1px solid #444;
      background:#1a1d24;
      color:#eee;
      cursor:pointer;
      font-size:12px;
    }

    .item-actions button:hover {
      background:#222832;
    }

    /* Rarity colors */
    .rarity-common {
      color:#bfbfbf;
    }
    .rarity-uncommon {
      color:#7fff7f;
    }
    .rarity-rare {
      color:#7fcfff;
    }
    .rarity-epic {
      color:#c77fff;
    }
    .rarity-legendary {
      color:#ffbf5f;
    }

  </style>
</head>
<body>

  <!-- ============================
        HEADER / USER DISPLAY
  ============================= -->
  <div id="usernameDisplay" class="username-display"></div>

  <!-- ============================
        PLAYER HUD
  ============================= -->
  <div id="combatHud" class="combat-hud">
    <div id="playerPanel" class="hud-panel player-panel">
      <div class="hud-header">
        <span id="playerName" class="hud-name">Player</span>
        <span id="playerLevel" class="hud-level">Lv 1</span>
      </div>

      <div class="hud-bar hp-bar">
        <div id="playerHpFill" class="bar-fill"></div>
        <span id="playerHpText" class="bar-text">HP 0 / 0</span>
      </div>

      <div class="hud-bar mana-bar">
        <div id="playerManaFill" class="bar-fill"></div>
        <span id="playerManaText" class="bar-text">MP 0 / 0</span>
      </div>

      <div class="hud-bar ult-bar">
        <div id="playerUltFill" class="bar-fill"></div>
        <span id="playerUltText" class="bar-text">ULT 0%</span>
      </div>
    </div>

  <!-- ============================
        ENVIRONMENT HUD
  ============================= -->
    
    <div id="environmentInfo" class="env-box">
      <div><strong>Region:</strong> <span id="envRegion"></span></div>
      <div><strong>Biome:</strong> <span id="envBiome"></span></div>
      <div><strong>Weather:</strong> <span id="envWeather"></span></div>
      <div><strong>Event:</strong> <span id="envEvent"></span></div>
      <div><strong>Traits:</strong> <span id="envTraits"></span></div>
    </div>

  <!-- ============================
        ENEMY HUD
  ============================= -->
    
    <div id="enemyPanel" class="hud-panel enemy-panel">
      <div class="hud-header">
        <span id="enemyName" class="hud-name">Enemy</span>
        <span id="enemyLevel" class="hud-level">Lv 1</span>
      </div>

      <div class="hud-bar hp-bar">
        <div id="enemyHpFill" class="bar-fill"></div>
        <span id="enemyHpText" class="bar-text">HP 0 / 0</span>
      </div>

      <div class="hud-bar mana-bar">
        <div id="enemyManaFill" class="bar-fill"></div>
        <span id="enemyManaText" class="bar-text">MP 0 / 0</span>
      </div>

      <button id="inspectEnemyBtn" class="btn inspect-btn">Inspect</button>
    </div>

    <div class="status-icons" id="playerStatusIcons"></div>
    <div class="status-icons" id="enemyStatusIcons"></div>
  </div>

  <!-- ============================
        COMBAT LOG
  ============================= -->
  <div id="combatLog" class="combat-log"></div>

  <!-- ============================
        ACTION PANEL (PLAYER TURN)
  ============================= -->
  <div id="actionPanel" class="action-panel" style="display:none;">
    <button id="basicAttackBtn" class="btn action-btn">Basic Attack</button>
    <button id="openAbilitiesBtn" class="btn action-btn">Abilities</button>
    <button id="ultimateBtn" class="btn action-btn">Ultimate</button>
    <button id="openItemBtn" class="btn action-btn">Item</button>
    <button id="fleeBtn" class="btn action-btn">Flee</button>
    <button id="autoBtn" class="btn action-btn">Auto</button>
  </div>

  <!-- ============================
        ABILITY PANEL
  ============================= -->
  <div id="abilityPanel" class="ability-panel" style="display:none;">
    <h3>Choose Ability</h3>
    <div id="abilityList"></div>
    <button class="btn close-btn"
            onclick="document.getElementById('abilityPanel').style.display='none'">
      Close
    </button>
  </div>

  <!-- ============================
        ITEM MODAL
  ============================= -->
  <div id="itemModal" class="item-modal hidden">
    <div class="item-modal-content">
      <h2>Use Item</h2>
      <div id="itemList">Loading...</div>
      <button class="btn close-btn"
              onclick="document.getElementById('itemModal').classList.add('hidden')">
        Close
      </button>
    </div>
  </div>

  <!-- ============================
        CINEMATIC INTRO
  ============================= -->
  <div id="cinematicIntro" class="cinematic-intro" style="display:none;">
    <div class="cinematic-content">
      <div id="cinematicPortrait" class="portrait-frame"></div>
      <div id="cinematicName" class="cinematic-name"></div>
      <div class="vs-text">VS</div>
    </div>
  </div>

  <!-- ============================
        RESUME PREVIOUS FIGHT MODAL
  ============================= -->
  <div id="resumeModal" class="modal" style="display:none;">
    <div class="modal-content">
      <h2>Resume Previous Fight?</h2>
      <p>You have an unfinished battle. Would you like to continue it?</p>

      <button class="btn" onclick="resumeFight()">Resume</button>
      <button class="btn" onclick="startNewFight()">Start New Fight</button>
    </div>
  </div>

  <!-- ============================
        DEATH MODAL
  ============================= -->
  <div id="deathModal" class="modal hidden">
  <div class="modal-content">
    <h2>You Have Fallen...</h2>
    <p>Choose how you will return:</p>
    <button class="btn" id="safeRespawnBtn">
      Safe Respawn (Lose items, 0 MP)
    </button>
    <button class="btn" id="riskyRespawnBtn">
      Risky Respawn (Lose 1 level, 0 MP)
    </button>
  </div>
</div>
  <script type="module">
    import { requireSession } from "./session-guard.js";
    import { EncounterEngine } from "./encounters.js";
    import { PlayerStorage } from "./player-storage.js";
    import { api } from "./api.js";
    import {
      buildCombatContext,
      runCombatRound as engineRunRound
    } from "./combat-engine.js";
    import { REGION_LOOT_TABLES } from "./region-loot-tables.js";
    import {
      handleSafeRespawn,
      handleRiskyRespawn,
      getSafeRespawnRemaining
    } from "./death-handler.js";
    import { DungeonEngine } from "./dungeon-engine.js";
    import { WorldSim } from "./world-simulation.js";
    import { handleBossDefeat } from "./world-boss-progression.js";
    import { ABILITY_DEFINITIONS } from "./ability-definitions.js";
    import { SUBRACE_ABILITY_DEFINITIONS } from "./subrace-ability-definitions.js";
    import { PROFESSION_ENVIRONMENT_SYNERGIES } from "./profession-environment-synergies.js";
    import { PlayerInfluence } from "./player-influence.js";
  
    /****************************************************
     * REGEN (TIME-BASED, NO CHEESE)
     ****************************************************/
  
    function applyRegen(player) {
      if (!player) return player;
  
      const now = Date.now();
      const last = player.lastRegenTick || now;
  
      const minutes = (now - last) / 60000;
      if (minutes <= 0) return player;
  
      const hpPerMin = player.hpRegenRate ?? 6;
      const mpPerMin = player.mpRegenRate ?? 0.5;
  
      const hpGain = Math.floor(minutes * hpPerMin);
      const mpGain = Math.floor(minutes * mpPerMin);
  
      player.hpCurrent = Math.min(player.hpMax, Math.round(player.hpCurrent + hpGain));
      player.manaCurrent = Math.min(player.manaMax, Math.round(player.manaCurrent + mpGain));
      player.mana = player.manaCurrent;
  
      player.lastRegenTick = now;
  
      return player;
    }
  
    /****************************************************
     * ABILITY HYDRATION
     ****************************************************/
  
    function hydrateAbilities(player) {
      const prof = player.profession;
      const subrace = player.subrace;
  
      const baseAbilities = Array.isArray(player.abilities) ? player.abilities : [];
  
      player.abilities = baseAbilities.map(a => {
        return (
          ABILITY_DEFINITIONS[prof]?.[a.key] ||
          SUBRACE_ABILITY_DEFINITIONS[subrace]?.[a.key] ||
          a
        );
      });
  
      if (player.ultimate && player.ultimate.key) {
        const ult =
          ABILITY_DEFINITIONS[prof]?.[player.ultimate.key] ||
          SUBRACE_ABILITY_DEFINITIONS[subrace]?.[player.ultimate.key] ||
          player.ultimate;
        player.ultimate = ult;
      }
  
      return player;
    }
  
    /****************************************************
     * MERGE COMBAT STATE BACK INTO PLAYER
     ****************************************************/
  
    function mergeCombatStateIntoPlayer(real, combatState) {
      if (!real || !combatState) return real;
  
      real.hpCurrent = combatState.hpCurrent;
      real.hpMax = combatState.hpMax ?? real.hpMax;
  
      if (typeof combatState.manaCurrent === "number") {
        real.manaCurrent = combatState.manaCurrent;
        real.mana = combatState.manaCurrent;
      }
      if (typeof combatState.manaMax === "number") {
        real.manaMax = combatState.manaMax;
      }
  
      real.cooldowns = combatState.cooldowns || real.cooldowns || {};
      real.statusEffects = combatState.statusEffects || real.statusEffects || [];
      real.ultimateCharge =
        combatState.ultimateCharge ?? real.ultimateCharge ?? 0;
  
      return real;
    }
  
    /****************************************************
     * SESSION + PLAYER + ENCOUNTER LOAD
     ****************************************************/
  
    await requireSession();
    const { local, remote, conflict, username } = window.syncState;
  
    let latest = PlayerStorage.load(username);
    latest = applyRegen(latest);
    PlayerStorage.save(username, latest);
  
    function ensureVitals(p) {
      if (!p) return p;
  
      if (typeof p.hpMax !== "number") p.hpMax = 20;
      if (p.hpCurrent === undefined || p.hpCurrent === null) {
        p.hpCurrent = p.hpMax;
      } else {
        p.hpCurrent = Math.min(p.hpCurrent, p.hpMax);
      }
  
      if (typeof p.manaMax !== "number") p.manaMax = 10;
      if (p.manaCurrent === undefined || p.manaCurrent === null) {
        const base = p.mana ?? p.mp ?? p.manaMax;
        p.manaCurrent = Math.min(base, p.manaMax);
      } else {
        p.manaCurrent = Math.min(p.manaCurrent, p.manaMax);
      }
  
      p.mana = p.manaCurrent;
  
      if (p.ultimateCharge == null) p.ultimateCharge = 0;
      return p;
    }
  
    document.getElementById("usernameDisplay").textContent =
      "Logged in as: " + username;
  
    let combat = null;
    let autoBattle = false;
    let autoLoopHandle = null;
  
    let rawPlayer = null;
    if (conflict === "remote-only") rawPlayer = remote;
    else if (conflict === "local-only") rawPlayer = local;
    else if (conflict === "match") rawPlayer = local || remote;
    else if (conflict === "conflict") rawPlayer = remote || local;
    else rawPlayer = local || remote;
  
    if (!rawPlayer) {
      const fallback = PlayerStorage.load(username);
      if (fallback) rawPlayer = fallback;
    }
  
    if (!rawPlayer) {
      alert("No player data found.");
      window.location.href = "world-map.html";
    }
  
    const playerCached = ensureVitals(rawPlayer);
    PlayerStorage.save(username, playerCached);
  
    const encounter = EncounterEngine.loadFromSession();
    if (!encounter) {
      alert("No encounter found. Returning to map.");
      window.location.href = "world-map.html";
    }
  
    const pCheck = PlayerStorage.load(username);
    if (encounter.type === "dungeon" || encounter.type === "dungeon_boss") {
      if (!pCheck.activeDungeonRun) {
        alert("Dungeon run lost. Returning to dungeon select.");
        window.location.href = "dungeon-select.html";
      }
    }
  
    /****************************************************
     * RUNTIME ENTITIES
     ****************************************************/
    function resolvePlayer(raw) {
      const stats = raw.stats || {};
      const derived = raw.derived || {};
    
      const hpMax = raw.hpMax ?? stats.hp ?? 1;
      const manaMax = raw.manaMax ?? stats.manaMax ?? 0;
    
      const baseMana = raw.manaCurrent ?? manaMax;
    
      // 1. Build the player object
      const player = {
        id: raw.username,
        name: raw.username,
        level: raw.level || 1,
        profession: raw.profession,
        race: raw.race,
        subrace: raw.subrace,
    
        hpCurrent: Math.min(raw.hpCurrent ?? hpMax, hpMax),
        hpMax,
    
        manaCurrent: Math.min(baseMana, manaMax),
        mana: Math.min(baseMana, manaMax),
        manaMax,
    
        atk: stats.atk ?? 1,
        def: stats.def ?? 0,
        speed: stats.speed ?? 1,
    
        critChance: derived.critChance ?? raw.crit ?? 0.05,
        critDamageMult: derived.critDamage ?? raw.critDmg ?? 1.5,
    
        element: raw.element || null,
        statusEffects: raw.statusEffects || [],
        cooldowns: raw.cooldowns || {},
        pendingAction: null,
    
        abilities: raw.abilities || [],
        ultimate: raw.ultimate || null,
    
        ultimateCharge: 0,
        ultimateChargeRequired:
          raw.ultimate?.chargeRequired || raw.ultimateChargeRequired || 100,
    
        equipment: raw.equipment || {},
        talentTree: raw.talentTree || {},
        talentPoints: raw.talentPoints || 0,
    
        inventory: raw.inventory || [],
    
        isPlayer: true,
        lastAction: null,
        lastActionType: null,
    
        // IMPORTANT: flavorTags must exist for Step 5
        flavorTags: raw.flavorTags || []
      };
    
      // 2. Apply profession ↔ environment synergies (Step 5)
      const profEnv = PROFESSION_ENVIRONMENT_SYNERGIES[player.profession];
      if (profEnv && player.flavorTags) {
        const matches = profEnv.tags.some(t => player.flavorTags.includes(t));
        if (matches) {
          if (profEnv.hpMult)  player.hpMax = Math.floor(player.hpMax * profEnv.hpMult);
          if (profEnv.atkMult) player.atk   = Math.floor(player.atk   * profEnv.atkMult);
          if (profEnv.defMult) player.def   = Math.floor(player.def   * profEnv.defMult);
          if (profEnv.spdMult) player.speed = Math.floor(player.speed * profEnv.spdMult);
          if (profEnv.critMult) player.critChance = (player.critChance || 0.05) * profEnv.critMult;
          if (profEnv.accuracyMult) player.accuracy = (player.accuracy || 0) + (profEnv.accuracyMult - 1);
          if (profEnv.dodgeMult) player.evasion = (player.evasion || 0) + (profEnv.dodgeMult - 1);
        }
      }
    
      // 3. Return the final player object
      return player;
    }
  
    function resolveEnemyFromEncounter(encEnemy) {
      const hpMax = encEnemy.hpMax ?? encEnemy.hpCurrent ?? 1; // or encEnemy.hp?
  
      return {
        id: encEnemy.key,
        name: encEnemy.name,
        level: encEnemy.level || 1,
        element: encEnemy.element || "neutral",
  
        hpCurrent: hpMax,
        hpMax,
  
        atk: encEnemy.atk ?? encEnemy.attack ?? 1,
        def: encEnemy.def ?? encEnemy.defense ?? 0,
        speed: encEnemy.speed || 1,
  
        manaCurrent: encEnemy.mana ?? 0,
        manaMax: encEnemy.manaMax ?? 0,
  
        statusEffects: encEnemy.statusEffects || [],
        cooldowns: {},
        isPlayer: false,
  
        isWorldBoss: !!encEnemy.isWorldBoss,
        bossKey: encEnemy.bossKey || null,
      };
    }
  
    function normalizeEnemiesFromEncounter(encounterEnemy) {
      if (Array.isArray(encounterEnemy)) {
        return encounterEnemy.map(resolveEnemyFromEncounter);
      }
      return [resolveEnemyFromEncounter(encounterEnemy)];
    }
  
    /****************************************************
     * COMBAT STATE + UI ELEMENTS
     ****************************************************/
  
    const logBox = document.getElementById("combatLog");
    const actionPanel = document.getElementById("actionPanel");
    const abilityPanel = document.getElementById("abilityPanel");
    const itemModal = document.getElementById("itemModal");
  
    let enemyListContainer = document.getElementById("enemyList");
    if (!enemyListContainer) {
      enemyListContainer = document.createElement("div");
      enemyListContainer.id = "enemyList";
      enemyListContainer.className = "enemy-list";
      const enemyPanel = document.getElementById("enemyPanel");
      enemyPanel.appendChild(enemyListContainer);
    }
  
    function isDead(entity) {
      return !entity || entity.hpCurrent <= 0;
    }
  
    function checkOutcome(playerState, enemies, context) {
      if (!playerState) return null;
      const livingEnemies = (enemies || []).filter(e => e && e.hpCurrent > 0);
  
      if (context?.fled) return "fled";
      if (playerState.hpCurrent <= 0 && !livingEnemies.length) return "draw";
      if (playerState.hpCurrent <= 0) return "defeat";
      if (!livingEnemies.length) return "victory";
      return null;
    }
  
    /****************************************************
     * LOGGING
     ****************************************************/
  
    function addLog(line) {
      const div = document.createElement("div");
      div.innerHTML = formatLog(line);
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
    }
  
    function renderLogs(logs) {
      for (const line of logs) addLog(line);
    }
  
    /****************************************************
     * HUD RENDERING
     ****************************************************/
  
    function renderPanels() {
      if (!combat || !combat.playerState || !combat.enemies) return;
      renderPlayerPanel(combat.playerState);
      renderEnemyPanel(combat.enemies[combat.activeEnemyIndex] || combat.enemies[0]);
      renderEnemyList(combat.enemies, combat.activeEnemyIndex);
      renderStatusIcons(combat.playerState, "playerStatusIcons");
      const activeEnemy = combat.enemies[combat.activeEnemyIndex] || combat.enemies[0];
      renderStatusIcons(activeEnemy, "enemyStatusIcons");
    }
  
    function renderPlayerPanel(p) {
      if (!p) return;
  
      document.getElementById("playerName").textContent = p.name || "Player";
      document.getElementById("playerLevel").textContent = "Lv " + (p.level || 1);

      // i don't know where to put this
      document.getElementById("envRegion").textContent = enemy.region || "—";
      document.getElementById("envBiome").textContent = enemy.biome || "—";
      document.getElementById("envWeather").textContent = context.weatherKey || "—";
      document.getElementById("envEvent").textContent = context.eventKey || "—";
      document.getElementById("envTraits").textContent = enemy.flavorTags?.join(", ") || "—";
  
      updateHPBar("playerHpFill", "playerHpText", p.hpCurrent, p.hpMax);
      updateManaBar(
        "playerManaFill",
        "playerManaText",
        p.manaCurrent ?? p.mana ?? 0,
        p.manaMax
      );
      updateUltimateBar(p);
    }
  
    function renderEnemyPanel(e) {
      if (!e) return;
  
      document.getElementById("enemyName").textContent = e.name || "Enemy";
      document.getElementById("enemyLevel").textContent = "Lv " + (e.level || 1);
  
      updateHPBar("enemyHpFill", "enemyHpText", e.hpCurrent, e.hpMax);
      updateManaBar(
        "enemyManaFill",
        "enemyManaText",
        e.manaCurrent || 0,
        e.manaMax || 0
      );
    }
  
    function renderEnemyList(enemies, activeIndex) {
      enemyListContainer.innerHTML = "";
      if (!enemies || !enemies.length) return;
  
      enemies.forEach((e, idx) => {
        if (!e) return;
        const btn = document.createElement("button");
        btn.className = "btn enemy-target-btn";
        if (idx === activeIndex) btn.classList.add("active");
        const hpPct = e.hpMax > 0 ? Math.round((e.hpCurrent / e.hpMax) * 100) : 0;
        btn.textContent = `${e.name} (Lv ${e.level}) - ${hpPct}%`;
        btn.onclick = () => {
          combat.activeEnemyIndex = idx;
          renderPanels();
        };
        enemyListContainer.appendChild(btn);
      });
    }
  
    function updateHPBar(fillId, textId, current, max) {
      const fill = document.getElementById(fillId);
      const text = document.getElementById(textId);
  
      current = current ?? 0;
      max = max || 1;
  
      const pct = Math.max(0, Math.min(100, (current / max) * 100));
  
      if (fill) fill.style.width = pct + "%";
      if (text) text.textContent = `HP ${current} / ${max}`;
    }
  
    function updateManaBar(fillId, textId, current, max) {
      const fill = document.getElementById(fillId);
      const text = document.getElementById(textId);
  
      current = current ?? 0;
      max = max || 0;
  
      const pct = max > 0 ? Math.max(0, Math.min(100, (current / max) * 100)) : 0;
  
      if (fill) fill.style.width = pct + "%";
      if (text) text.textContent = `MP ${current} / ${max}`;
    }
  
    function updateUltimateBar(playerState) {
      const fill = document.getElementById("playerUltFill");
      const text = document.getElementById("playerUltText");
  
      const charge = playerState.ultimateCharge || 0;
      const required = playerState.ultimateChargeRequired || 100;
  
      const pct = Math.max(0, Math.min(100, (charge / required) * 100));
  
      if (fill) fill.style.width = pct + "%";
      if (text) text.textContent = `ULT ${Math.round(pct)}%`;
    }
  
    /****************************************************
     * START FIGHT
     ****************************************************/
  
    async function beginFight() {
      if (combat && !checkOutcome(combat.playerState, combat.enemies, combat.context)) {
        addLog("You are already in combat.");
        return;
      }
    
      logBox.innerHTML = "";
      hideActionPanel();
      combat = null;
    
      console.log("[fight] beginFight called");
    
      let latest = PlayerStorage.load(username);
      latest = ensureVitals(latest);
      PlayerStorage.save(username, latest);
    
      const baseCombatPlayer = resolvePlayer(latest);
      const playerState = hydrateAbilities(structuredClone(baseCombatPlayer));
    
      const enemies = normalizeEnemiesFromEncounter(
        encounter.enemies || encounter.enemy
      );
    
      // NEW: carry subregion, tier, hazard into context
      const context = buildCombatContext(
        encounter.region,
        encounter.biome,
        encounter.weather,
        encounter.event,
        encounter.hazard
      );
    
      // Attach extra metadata so other systems can see it
      context.subregionKey = encounter.subregion || null;
      context.tier = encounter.tier ?? null;
    
      if (encounter.type === "dungeon" || encounter.type === "dungeon_boss") {
        const p = PlayerStorage.load(username);
        if (p && p.activeDungeonRun) {
          context.dungeonRun = p.activeDungeonRun;
        }
      }
    
      combat = {
        playerState,
        enemies,
        activeEnemyIndex: 0,
        context
      };
    
      const anyBoss = enemies.find(e => e.isWorldBoss || encounter.isBoss);
      if (anyBoss) {
        showCinematicIntro(anyBoss);
      }
    
      setTimeout(() => {
        renderPanels();
        showActionPanel();
      }, 50);
    }
  
    /****************************************************
     * MAIN ROUND RESOLUTION
     ****************************************************/
  
    async function runRound(playerAction) {
      console.log("[fight] runRound called with", playerAction);
      if (!combat || !combat.playerState || !combat.enemies) {
        console.warn("runRound called before combat initialized");
        return;
      }
  
      hideActionPanel();
  
      const logs = [];
      const result = engineRunRound(
        combat.playerState,
        combat.enemies,        // pass full enemy array
        combat.context,
        playerAction,
        logs
      );
  
      combat.playerState = result.player;
      combat.enemies = result.enemies || (result.enemy ? [result.enemy] : []);
      combat.context = result.context;
  
      let real = PlayerStorage.load(username) || rawPlayer;
      real = mergeCombatStateIntoPlayer(real, combat.playerState);
      real.lastRegenTick = Date.now();          // update tick BEFORE saving
      PlayerStorage.save(username, real);
      await api.savePlayer(username, real);
  
      renderLogs(result.logs || logs);
      renderPanels();
  
      const outcome = checkOutcome(combat.playerState, combat.enemies, combat.context);
  
      if (!outcome) {
        if (combat.context.dungeonRun) {
          const p = PlayerStorage.load(username);
          DungeonEngine.saveRun(p, combat.context.dungeonRun, username);
        }
  
        if (autoBattle) {
          showActionPanel();
          if (!autoLoopHandle) {
            autoLoopHandle = setTimeout(autoLoop, 1000);
          }
        } else {
          showActionPanel();
        }
        return;
      }
  
      addLog("Combat ended: " + outcome.toUpperCase());
  
      const p = PlayerStorage.load(username);
      const run = combat.context.dungeonRun || null;
      const isEndless = run ? DungeonEngine.isEndless(run) : false;
  
      persistVitalsAfterCombat();
  
      if (outcome === "defeat") {
        if (run && !isEndless) {
          DungeonEngine.saveRun(p, combat.context.dungeonRun, username);
          window.location.href = "dungeon-failed.html";
          return;
        }
  
        if (run && isEndless) {
          p.lastEndlessRun = {
            floor: run.highestFloor || run.currentFloor,
            score: run.highestFloor || run.currentFloor
          };
          DungeonEngine.saveRun(p, combat.context.dungeonRun, username);
          window.location.href = "endless-summary.html";
          return;
        }
  
        showDeathModal();
        autoBattle = false;
        if (autoLoopHandle) clearTimeout(autoLoopHandle);
        combat = null;
        return;
      }
  
      // WORLD BOSS VICTORY
      const bossEnemy = (combat.enemies || []).find(e => e.isWorldBoss);
      if (bossEnemy) {
        const bossKey = bossEnemy.bossKey;
        const worldState = WorldSim.getState();
  
        p.flags = p.flags || {};
        p.flags[`${bossKey}_defeated`] = true;
        PlayerStorage.save(username, p);
  
        handleBossDefeat(worldState, bossKey);
        WorldSim.save();
        addLog(`You have defeated the World Boss: ${bossKey}!`);
      }
  
      // DUNGEON VICTORY
      if (run) {
        if (!isEndless && run.state === "boss") {
          DungeonEngine.completeDungeon(run);
  
          p.dungeonRecords = p.dungeonRecords || {};
          const rec = p.dungeonRecords[run.dungeonKey] || { clears: 0 };
          rec.clears += 1;
          p.dungeonRecords[run.dungeonKey] = rec;
  
          p.lastCompletedDungeonRun = {
            dungeonKey: run.dungeonKey,
            xp: result.xp,
            gold: result.gold,
            items: result.loot || []
          };
  
          DungeonEngine.saveRun(p, combat.context.dungeonRun, username);
          // 🌍 Player influence: full dungeon clear
          PlayerInfluence.applyDungeonClear(
            combat.context.region,
            run.totalWaves || 3
          );

          window.location.href = "dungeon-complete.html";
          return;
        }
  
        if (isEndless) {
          DungeonEngine.completeFloor(run);
  
          p.lastEndlessRun = {
            floor: run.highestFloor || run.currentFloor,
            score: run.highestFloor || run.currentFloor
          };
  
          DungeonEngine.saveRun(p, combat.context.dungeonRun, username);
          window.location.href = "endless-summary.html";
          return;
        }
  
        DungeonEngine.completeFloor(run);
        DungeonEngine.saveRun(p, run, username);
        // 🌍 Player influence: dungeon floor cleared
        PlayerInfluence.applyCombatVictory(
          combat.context.region,
          run.currentFloor || 1
        );
      }
  
      // NORMAL REWARD FLOW (non-dungeon) + FLEE
      if (outcome === "fled") {
        endCombat("fled", { outcome: "fled", loot: [] });
      } else {
  
        // 🌍 Player influence: normal encounter victory
        if (!run) {
          PlayerInfluence.applyCombatVictory(
            combat.context.region,
            combat.context.tier || 1
          );
        }
      
        // 🌍 Player influence: crisis intervention (if this fight was crisis-tagged)
        if (combat.context.crisis) {
          PlayerInfluence.applyCrisisIntervention(
            combat.context.region,
            1
          );
        }
      
        const rewards = generateRewards(
          combat.playerState,
          combat.enemies[0],
          combat.context,
          outcome
        );
        const finalRewards = await finalizeRewards(rewards);
        endCombat(finalRewards.outcome, finalRewards);
      }

      autoBattle = false;
      if (autoLoopHandle) clearTimeout(autoLoopHandle);
      combat = null;
    }
  
    /****************************************************
     * FINALIZE REWARDS (LOCAL + KV)
     ****************************************************/
  
    function persistVitalsAfterCombat() {
      const latest = PlayerStorage.load(username);
      if (!latest || !combat || !combat.playerState) return;
  
      latest.hpCurrent = combat.playerState.hpCurrent;
      latest.manaCurrent = combat.playerState.manaCurrent;
      latest.mana = combat.playerState.mana;
      latest.ultimateCharge = combat.playerState.ultimateCharge;
      latest.lastRegenTick = Date.now();
  
      PlayerStorage.save(username, latest);
      api.savePlayer(username, latest);
    }
  
    function generateRewards(player, enemy, context, outcome) {
      if (outcome !== "victory") {
        return { outcome };
      }
  
      const xp = enemy.level * 2;
      const gold = enemy.level * 1;
  
      const lootKey = mapRegionToLootKey( encounter.region, combat.context.subregionKey );
      const loot = rollLoot(lootKey, context, player);
  
      return {
        outcome,
        xp,
        gold,
        loot
      };
    }
  
    async function finalizeRewards(result) {
      if (!result || result.outcome !== "victory") return result;
  
      const p = PlayerStorage.load(username);
      if (!p) return result;
  
      p.xp = (p.xp || 0) + (result.xp || 0);
      p.gold = (p.gold || 0) + (result.gold || 0);
  
      if (Array.isArray(result.loot) && result.loot.length > 0) {
        if (!Array.isArray(p.inventory)) p.inventory = [];
  
        for (const item of result.loot) {
          const existing = p.inventory.find(
            i => i.name === item.name && i.type === item.type
          );
          if (existing) {
            existing.quantity = (existing.quantity || 1) + (item.quantity || 1);
          } else {
            p.inventory.push(item);
          }
        }
      }
  
      const player = ensureVitals(p);
      PlayerStorage.save(username, player);
      await api.savePlayer(username, player);
  
      return result;
    }
  
    /****************************************************
     * PLAYER ACTIONS
     ****************************************************/
  
    async function chooseBasicAttack() {
      const targetIndex = combat?.activeEnemyIndex ?? 0;
      await runRound({ type: "basic", targetIndex });
    }
  
    async function chooseAbility(key) {
      closeAbilityMenu();
  
      if (!combat || !combat.playerState) return;
  
      const ability = combat.playerState.abilities.find(a => a.key === key);
      if (!ability) {
        addLog("Ability not found!");
        return;
      }
  
      const targetIndex = combat.activeEnemyIndex ?? 0;
  
      await runRound({
        type: "ability",
        ability,
        targetIndex
      });
    }
  
    async function chooseUltimate() {
      const p = combat.playerState;
      if ((p.ultimateCharge || 0) < (p.ultimateChargeRequired || 100)) {
        addLog("Ultimate not ready!");
        return;
      }
      const targetIndex = combat.activeEnemyIndex ?? 0;
      await runRound({
        type: "ability",
        ability: p.ultimate,
        isUltimate: true,
        targetIndex
      });
    }
  
    async function chooseItem(itemId) {
      closeItemModal();
      await runRound({ type: "item", itemId });
    }
  
    async function chooseFlee() {
      persistVitalsAfterCombat();
      await runRound({ type: "flee" });
    }
  
    /****************************************************
     * AUTO-BATTLE
     ****************************************************/
  
    function toggleAutoBattle() {
      autoBattle = !autoBattle;
      addLog("Auto-battle: " + (autoBattle ? "ON" : "OFF"));
  
      if (!autoBattle && autoLoopHandle) {
        clearTimeout(autoLoopHandle);
        autoLoopHandle = null;
        showActionPanel();
        return;
      }
  
      if (autoBattle && combat && !autoLoopHandle) {
        showActionPanel();
        autoLoopHandle = setTimeout(autoLoop, 1000);
      }
    }
  
    async function autoLoop() {
      if (!autoBattle || !combat || !combat.playerState || !combat.enemies) {
        autoLoopHandle = null;
        return;
      }
  
      const outcome = checkOutcome(combat.playerState, combat.enemies, combat.context);
      if (outcome) {
        autoLoopHandle = null;
        return;
      }
  
      const action = pickAutoAction(combat.playerState);
      await runRound(action);
  
      if (!autoBattle || !combat || !combat.playerState || !combat.enemies) {
        autoLoopHandle = null;
        return;
      }
  
      const postOutcome = checkOutcome(combat.playerState, combat.enemies, combat.context);
      if (postOutcome) {
        autoLoopHandle = null;
        return;
      }
  
      showActionPanel();
      autoLoopHandle = setTimeout(autoLoop, 1000);
    }
  
    function pickAutoAction(player) {
      if (
        player.ultimate &&
        player.ultimateCharge >= (player.ultimateChargeRequired || 100)
      ) {
        return {
          type: "ability",
          ability: player.ultimate,
          isUltimate: true,
          targetIndex: combat?.activeEnemyIndex ?? 0
        };
      }
  
      const abilities = player.abilities || [];
      const usable = abilities.filter(a => {
        const cd = player.cooldowns?.[a.key] || 0;
        const manaCost = a.manaCost || a.mpCost || 0;
        const mp = player.manaCurrent ?? player.mana ?? 0;
        return cd <= 0 && mp >= manaCost;
      });
  
      if (usable.length && Math.random() < 0.40) {
        const ability = usable[Math.floor(Math.random() * usable.length)];
        return {
          type: "ability",
          ability,
          targetIndex: combat?.activeEnemyIndex ?? 0
        };
      }
  
      return { type: "basic", targetIndex: combat?.activeEnemyIndex ?? 0 };
    }
  
    /****************************************************
     * ITEM SYSTEM
     ****************************************************/
  
    function openItemModal() {
      itemModal.classList.remove("hidden");
      loadCombatItems();
    }
  
    function closeItemModal() {
      itemModal.classList.add("hidden");
    }
  
    function loadCombatItems() {
      const list = document.getElementById("itemList");
      list.innerHTML = "";
  
      if (!combat || !combat.playerState) {
        list.innerHTML = "<div>No usable items.</div>";
        return;
      }
  
      const inv = combat.playerState.inventory || [];
  
      // Only items usable in battle (for now: consumables)
      const usable = inv.filter(item => item.type === "consumable");
  
      if (!usable.length) {
        list.innerHTML = "<div>No usable items.</div>";
        return;
      }
  
      usable.forEach(item => {
        const btn = document.createElement("button");
        btn.className = "btn item-btn";
        btn.textContent = `${item.name} (${item.qty ?? item.quantity ?? 1})`;
        btn.onclick = () => chooseItem(item.id);
        list.appendChild(btn);
      });
    }
  
    /****************************************************
     * ABILITY MENU
     ****************************************************/
  
    function openAbilityMenu() {
      if (!combat || !combat.playerState) return;
  
      const list = document.getElementById("abilityList");
      list.innerHTML = "";
  
      const p = combat.playerState;
      const abilities = p.abilities || [];
  
      abilities.forEach(a => {
        const btn = document.createElement("button");
        btn.className = "btn ability-btn";
  
        const cd = p.cooldowns?.[a.key] || 0;
        const mp = p.manaCurrent ?? p.mana ?? 0;
        const cost = a.manaCost || a.mpCost || 0;
  
        if (cd > 0) {
          btn.textContent = `${a.name} (${cd})`;
        } else if (cost > 0) {
          btn.textContent = `${a.name} -${cost} MP`;
        } else {
          btn.textContent = a.name;
        }
  
        btn.disabled = cd > 0 || mp < cost;
  
        btn.onclick = () => chooseAbility(a.key);
        list.appendChild(btn);
      });
  
      abilityPanel.style.display = "block";
    }
  
    function closeAbilityMenu() {
      abilityPanel.style.display = "none";
    }
  
    /****************************************************
     * VFX (CSS already defined)
     ****************************************************/
  
    function screenShake(intensity = 5, duration = 150) {
      const root = document.body;
      root.classList.add("screen-shake");
      setTimeout(() => root.classList.remove("screen-shake"), duration);
    }
  
    function critFlash() {
      logBox.classList.add("crit-flash");
      setTimeout(() => logBox.classList.remove("crit-flash"), 200);
    }
  
    function elementalPulse(element) {
      const hud = document.getElementById("combatHud");
      hud.classList.add(`pulse-${element}`);
      setTimeout(() => hud.classList.remove(`pulse-${element}`), 300);
    }
  
    function applyVFX(event) {
      if (!event || !event.type) return;
  
      switch (event.type) {
        case "crit":
          critFlash();
          break;
        case "big_hit":
          screenShake();
          break;
        case "elemental_hit":
          if (event.payload?.element) elementalPulse(event.payload.element);
          break;
      }
    }
  
    /****************************************************
     * CINEMATIC INTRO
     ****************************************************/
  
    function showCinematicIntro(enemy) {
      const intro = document.getElementById("cinematicIntro");
      const name = document.getElementById("cinematicName");
  
      name.textContent = enemy.name || "Unknown Foe";
  
      intro.style.display = "flex";
      intro.style.opacity = 0;
  
      setTimeout(() => {
        intro.style.opacity = 1;
      }, 50);
  
      setTimeout(() => {
        intro.style.opacity = 0;
        setTimeout(() => (intro.style.display = "none"), 300);
      }, 2000);
    }
  
    /****************************************************
     * INSPECT ENEMY
     ****************************************************/
  
    function inspectEnemy() {
      if (!combat || !combat.enemies || !combat.enemies.length) {
        alert("Enemy not initialized yet.");
        return;
      }
  
      const e = combat.enemies[combat.activeEnemyIndex] || combat.enemies[0];
  
      alert(
        `${e.name}\n` +
        `Level: ${e.level}\n` +
        `HP: ${e.hpCurrent}/${e.hpMax}\n` +
        `ATK: ${e.atk}\n` +
        `DEF: ${e.def}\n` +
        `Element: ${e.element}`
      );
    }
  
    /****************************************************
     * END COMBAT / REWARDS
     ****************************************************/
  
    function endCombat(outcome, rewards = null) {
      hideActionPanel();
  
      const rewardPanel = document.createElement("div");
      rewardPanel.className = "reward-panel";
  
      let lootHtml = "";
  
      if (outcome === "victory") {
        let lootList = "No loot";
  
        if (rewards && Array.isArray(rewards.loot) && rewards.loot.length > 0) {
          lootList = rewards.loot
            .map(
              item =>
                `<div class="loot-item loot-${item.rarity || "common"}">${item.name} x${
                  item.qty || item.quantity || 1
                } (${item.rarity || "common"})</div>`
            )
            .join("");
        }
  
        const continueLabel = combat?.context?.dungeonRun
          ? "Continue Dungeon"
          : "Continue Exploring";
  
        lootHtml = `
          <h2>Victory!</h2>
          <p>You defeated ${combat.enemies.map(e => e.name).join(", ")}!</p>
          <div class="loot-box">${lootList}</div>
          <button class="btn" onclick="continueExploring()">${continueLabel}</button>
          <button class="btn" onclick="goToMap()">Return to Map</button>
        `;
      } else if (outcome === "defeat") {
        lootHtml = `
          <h2>Defeat…</h2>
          <p>You were defeated.</p>
          <button class="btn" onclick="goToMap()">Return to Map</button>
        `;
      } else if (outcome === "fled") {
        lootHtml = `
          <h2>Retreat</h2>
          <p>You fled from battle.</p>
          <button class="btn" onclick="goToMap()">Return to Map</button>
        `;
      } else {
        lootHtml = `
          <h2>Battle Over</h2>
          <button class="btn" onclick="goToMap()">Return to Map</button>
        `;
      }
  
      rewardPanel.innerHTML = lootHtml;
      persistVitalsAfterCombat();
      document.body.appendChild(rewardPanel);
      renderPanels();
    }
  
    /****************************************************
     * HELPERS
     ****************************************************/
  
    function format(num) {
      return Number(num).toLocaleString();
    }
  
    function formatLog(text) {
      return text.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
    }
  
    function showActionPanel() {
      actionPanel.style.display = "block";
    }
  
    function hideActionPanel() {
      actionPanel.style.display = "none";
    }
  
    function showPopup(targetPanelId, text, type = "damage") {
      const panel = document.getElementById(targetPanelId);
      if (!panel) return;
  
      const div = document.createElement("div");
      div.className = type === "heal" ? "heal-popup" : "damage-popup";
      div.textContent = text;
  
      panel.appendChild(div);
  
      setTimeout(() => div.remove(), 800);
    }
  
    window.showPopup = showPopup;
  
    function renderStatusIcons(entity, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
  
      (entity.statusEffects || []).forEach(eff => {
        const img = document.createElement("img");
        img.src = `assets/status/${eff.type}.png`;
        img.title = eff.type;
        container.appendChild(img);
      });
    }
  
    function mapRegionToLootKey(regionKey, subregionKey) {
      // If we have a subregion, use it directly
      if (subregionKey) return subregionKey;
    
      // Fallback for legacy regions
      switch ((regionKey || "").toLowerCase()) {
        case "forest":
          return "forest_edge";
        case "plains":
          return "plains_field";
        default:
          return regionKey;
      }
    }
  
    function rollLoot(regionKey, context, player) {
      const table = REGION_LOOT_TABLES[regionKey];
      if (!table) return [];
  
      const results = [];
  
      const rarityRoll = Math.random();
      let rarity = "common";
      if (rarityRoll > 0.97) rarity = "mythic";
      else if (rarityRoll > 0.90) rarity = "epic";
      else if (rarityRoll > 0.75) rarity = "rare";
      else if (rarityRoll > 0.50) rarity = "uncommon";
  
      const basePool = table[rarity] || [];
      if (basePool.length) {
        const name = pick(basePool);
        results.push(makeItem(name, rarity));
      }
  
      const weather = context.weatherKey;
      if (table.weatherModifiers?.[weather]) {
        const name = pick(table.weatherModifiers[weather]);
        results.push(makeItem(name, rarity));
      }
  
      const event = context.eventKey;
      if (table.eventModifiers?.[event]) {
        const name = pick(table.eventModifiers[event]);
        results.push(makeItem(name, rarity));
      }
  
      if (table.professionModifiers?.[player.profession]) {
        const name = pick(table.professionModifiers[player.profession]);
        results.push(makeItem(name, rarity));
      }
  
      return results;
    }
  
    function makeItem(name, rarity) {
      return {
        id: crypto.randomUUID(),
        name,
        quantity: 1,
        rarity: rarity || "common",
        type: inferItemType(name),
        icon: "assets/items/default.png"
      };
    }
  
    function inferItemType(name) {
      const n = name.toLowerCase();
  
      if (n.includes("meat") || n.includes("potion") || n.includes("herb"))
        return "consumable";
  
      if (n.includes("ore") || n.includes("bark") || n.includes("leaf") || n.includes("root"))
        return "material";
  
      if (n.includes("token") || n.includes("trophy") || n.includes("map"))
        return "quest";
  
      return "misc";
    }
  
    function pick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }
  
    function continueExploring() {
      persistVitalsAfterCombat();
      EncounterEngine.clear();
      combat = null;
      window.location.href = combat?.context?.dungeonRun
        ? "dungeon-room.html"
        : "world-map.html";
    }
  
    function goToMap() {
      persistVitalsAfterCombat();
      EncounterEngine.clear();
      combat = null;
      window.location.href = "world-map.html";
    }
  
    /****************************************************
     * DEATH MODAL + RESPAWN
     ****************************************************/
  
    function showDeathModal() {
      console.log("[fight] showDeathModal called");
      const modal = document.getElementById("deathModal");
      modal.classList.remove("hidden");
  
      const safeBtn = document.getElementById("safeRespawnBtn");
      const riskyBtn = document.getElementById("riskyRespawnBtn");
  
      safeBtn.onclick = async () => {
        safeBtn.disabled = true;
        riskyBtn.disabled = true;
        await handleSafeRespawn(username);
      };
  
      riskyBtn.onclick = async () => {
        safeBtn.disabled = true;
        riskyBtn.disabled = true;
        await handleRiskyRespawn(username);
      };
  
      const stored = PlayerStorage.load(username);
      if (stored.safeRespawnLockUntil && getSafeRespawnRemaining(stored) > 0) {
        safeBtn.disabled = true;
        safeBtn.textContent = "Safe Respawn (Locked)";
      }
    }
  
    /****************************************************
     * BUTTON BINDINGS
     ****************************************************/
  
    beginFight();
    document.getElementById("basicAttackBtn").onclick = chooseBasicAttack;
    document.getElementById("ultimateBtn").onclick = chooseUltimate;
    document.getElementById("fleeBtn").onclick = chooseFlee;
    document.getElementById("autoBtn").onclick = toggleAutoBattle;
    document.getElementById("openItemBtn").onclick = openItemModal;
    document.getElementById("openAbilitiesBtn").onclick = openAbilityMenu;
    document.getElementById("inspectEnemyBtn").onclick = inspectEnemy;
  
    window.chooseAbility = chooseAbility;
    window.chooseItem = chooseItem;
    window.continueExploring = continueExploring;
    window.goToMap = goToMap;
  </script>
