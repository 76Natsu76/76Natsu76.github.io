<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Encounter Preview</title>
  <link rel="stylesheet" href="world-map.css">
  <style>
    body {
      background:#0d0f14;
      color:#e0e6f0;
      font-family:Arial, sans-serif;
      padding:20px;
    }
    .encounter-card {
      background:#11141c;
      border:1px solid #262a36;
      border-radius:8px;
      padding:20px;
      margin-top:20px;
      box-shadow:0 0 12px #0008;
    }
    .section-title {
      font-size:18px;
      margin-top:20px;
      margin-bottom:8px;
      color:#9af7ff;
      font-weight:bold;
    }
    .stat-row {
      display:flex;
      justify-content:space-between;
      padding:4px 0;
      border-bottom:1px solid #222;
    }
    .modifier-tag {
      display:inline-block;
      padding:4px 8px;
      margin:3px;
      border-radius:4px;
      background:#1a1d24;
      border:1px solid #333;
      font-size:12px;
      opacity:0.9;
    }
    .chaos-tag { border-color:#b347ff; box-shadow:0 0 6px #b347ff55; }
    .crisis-tag { border-color:#ff4444; box-shadow:0 0 6px #ff444455; }
    .weather-tag { border-color:#4ac0ff; box-shadow:0 0 6px #4ac0ff55; }
    .migration-tag { border-color:#7fff7f; box-shadow:0 0 6px #7fff7f55; }
    .anomaly-tag { border-color:#b47fff; box-shadow:0 0 6px #b47fff55; }
    .global-tag { border-color:#ffb347; box-shadow:0 0 6px #ffb34755; }
    .btn {
      padding:12px 16px;
      border-radius:6px;
      border:1px solid #444;
      background:#1a1d24;
      color:#eee;
      cursor:pointer;
      margin-top:20px;
      width:100%;
      text-align:center;
      font-size:16px;
    }
    .btn:hover {
      background:#222832;
    }
  </style>
</head>
<body>

  <h1>Encounter Preview</h1>
  <div id="usernameDisplay"></div>
  <div id="encounterContainer">Loading encounter...</div>
  <script type="module" src="region-encounter.js"></script>

</body>
</html>
