<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Overworld Encounter</title>
  <link rel="stylesheet" href="world-map.css">
  <style>
    .encounter-card {
      background:#11141c;
      border:1px solid #262a36;
      border-radius:8px;
      padding:20px;
      margin-top:20px;
      box-shadow:0 0 12px #0008;
    }
    .encounter-title {
      font-size:22px;
      font-weight:bold;
      color:#9af7ff;
      margin-bottom:10px;
    }
    .encounter-row {
      margin:8px 0;
      font-size:15px;
    }
    .modifier-tag {
      display:inline-block;
      padding:4px 8px;
      margin:3px;
      border-radius:4px;
      background:#1a1d24;
      border:1px solid #333;
      font-size:12px;
      opacity:0.9;
    }
    .chaos-tag { border-color:#b347ff; box-shadow:0 0 6px #b347ff55; }
    .crisis-tag { border-color:#ff4444; box-shadow:0 0 6px #ff444455; }
    .weather-tag { border-color:#4ac0ff; box-shadow:0 0 6px #4ac0ff55; }
    .migration-tag { border-color:#7fff7f; box-shadow:0 0 6px #7fff7f55; }
    .anomaly-tag { border-color:#b47fff; box-shadow:0 0 6px #b47fff55; }
    .global-tag { border-color:#ffb347; box-shadow:0 0 6px #ffb34755; }

    .encounter-buttons {
      margin-top:20px;
      display:flex;
      gap:12px;
    }
    .btn {
      padding:10px 14px;
      border-radius:6px;
      border:1px solid #444;
      background:#1a1d24;
      color:#eee;
      cursor:pointer;
      flex:1;
      text-align:center;
    }
    .btn:hover {
      background:#222832;
    }
  </style>
</head>

<body>

  <h1>Overworld Encounter</h1>
  <div id="usernameDisplay"></div>

  <div id="encounterContainer">Loading encounter...</div>

  <button class="btn" onclick="goBack()">Return to Region</button>

  <script type="module" src="region-encounter.js"></script>

</body>
</html>
