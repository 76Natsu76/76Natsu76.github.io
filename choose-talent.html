<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Choose Your Talent</title>

  <style>
    body {
      background:#0d0f14;
      color:#e8e8e8;
      font-family:system-ui, sans-serif;
      padding:24px;
    }

    h1 {
      color:#7fffd4;
      margin-bottom:4px;
    }

    #info {
      opacity:0.8;
      margin-bottom:12px;
    }

    .branch-card {
      padding:14px;
      margin:12px 0;
      background:#1a1d24;
      border-radius:8px;
      border:1px solid #333;
      cursor:pointer;
    }

    .branch-card:hover {
      background:#222832;
    }

    .selected {
      border-color:#7fffd4;
      box-shadow:0 0 10px #7fffd455;
    }

    .node {
      margin-left:12px;
      padding:6px 0;
      opacity:0.9;
    }

    .node-locked {
      opacity:0.4;
    }

    .btn {
      margin-top:20px;
      padding:12px 16px;
      border-radius:6px;
      border:1px solid #444;
      background:#1a1d24;
      color:#eee;
      cursor:pointer;
      width:100%;
      text-align:center;
      font-size:16px;
    }

    .btn:hover {
      background:#222832;
    }

    #returnBtn {
      margin-top:12px;
      display:none;
    }

    #saveStatus {
      margin-top:10px;
      opacity:0.8;
    }
  </style>
</head>
<body>

  <h1>Choose Your Talent</h1>
  <div id="info">Select one branch to define your path.</div>

  <div id="talentContainer">Loading talent tree...</div>

  <button id="confirmBtn" class="btn" style="display:none;">Save Talent Choice</button>
  <div id="saveStatus"></div>
  <button id="returnBtn" class="btn">Return to Character</button>

  <script type="module">
    import { requireSession } from "./session-guard.js";
    import { PlayerStorage } from "./player-storage.js";
    import { savePlayerToKV } from "./api.js";
    import { PROFESSION_TALENT_TREES as TALENT_TREES } from "./profession-talent-trees.js";
  
    await requireSession();
    const { username } = window.syncState;
  
    let player = PlayerStorage.load(username);
  
    // Ensure canonical format: array of { id }
    if (!Array.isArray(player.talentTree)) {
      player.talentTree = [];
      PlayerStorage.save(username, player);
    }
  
    const profession = player.profession;
    const talentDefs = TALENT_TREES;
  
    if (!talentDefs[profession]) {
      document.body.innerHTML = "<h2>No talent tree found for this profession.</h2>";
      throw new Error("No talent tree");
    }
  
    /* ------------------------------------------------------------
       TIER HELPERS
    ------------------------------------------------------------ */
    function getChosenIds() {
      return new Set(player.talentTree.map(n => n.id));
    }
  
    function isTierComplete(tierKey) {
      const tierDef = talentDefs[profession][tierKey];
      if (!tierDef) return true;
  
      const chosen = getChosenIds();
      const branches = tierDef.branches || {};
      for (const nodes of Object.values(branches)) {
        for (const n of nodes) {
          if (!chosen.has(n.id)) return false;
        }
      }
      if (tierDef.capstone && !chosen.has(tierDef.capstone.id)) return false;
      return true;
    }
  
    function determineTier() {
      // Tier 1
      if (!isTierComplete("tier1")) {
        if (player.level < 10) {
          document.body.innerHTML = "<h2>You are not eligible for Tier 1 talents yet.</h2>";
          throw new Error("Tier 1 locked");
        }
        return "tier1";
      }
      // Tier 2
      if (!isTierComplete("tier2")) {
        if (player.level < 100) {
          document.body.innerHTML = "<h2>You are not eligible for Tier 2 talents yet.</h2>";
          throw new Error("Tier 2 locked");
        }
        return "tier2";
      }
      // Tier 3
      if (!isTierComplete("tier3")) {
        if (player.level < 1000) {
          document.body.innerHTML = "<h2>You are not eligible for Tier 3 talents yet.</h2>";
          throw new Error("Tier 3 locked");
        }
        return "tier3";
      }
  
      document.body.innerHTML = "<h2>You have already selected all available talents.</h2>";
      throw new Error("All tiers chosen");
    }
  
    const tier = determineTier();
    const tierData = talentDefs[profession][tier];
    const branches = tierData.branches || {};
  
    let selectedNodeId = null;
  
    renderTier();
  
    /* ------------------------------------------------------------
       RENDER TIER (BRANCHES + NODES)
    ------------------------------------------------------------ */
    function renderTier() {
      const container = document.getElementById("talentContainer");
      const chosen = getChosenIds();
  
      container.innerHTML = `
        <h2>Select a Tier ${tier.replace("tier","")} Talent</h2>
        <p>Talent Points: ${player.talentPoints || 0}</p>
      `;
  
      for (const [branchKey, nodes] of Object.entries(branches)) {
        const branchDiv = document.createElement("div");
        branchDiv.className = "branch-card";
        branchDiv.innerHTML = `<strong>${format(branchKey)}</strong><br>`;
  
        const nodesHtml = nodes.map(n => {
          const isChosen = chosen.has(n.id);
          const locked = n.requires && !chosen.has(n.requires);
          const classes = [
            "node",
            isChosen ? "node-chosen" : "",
            locked ? "node-locked" : ""
          ].join(" ");
  
          return `
            <div class="${classes}" data-node-id="${n.id}">
              <strong>${n.name}</strong><br>
              <span style="opacity:0.8;">${n.description}</span>
            </div>
          `;
        }).join("");
  
        branchDiv.innerHTML += nodesHtml;
        container.appendChild(branchDiv);
      }
  
      // Capstone
      if (tierData.capstone) {
        const cap = tierData.capstone;
        const chosenCap = chosen.has(cap.id);
        const allNodesChosen = Object.values(branches).every(nodes =>
          nodes.every(n => chosen.has(n.id))
        );
        const lockedCap = !allNodesChosen;
  
        const capDiv = document.createElement("div");
        capDiv.className = "branch-card capstone-card";
        capDiv.innerHTML = `
          <strong>Capstone</strong><br>
          <div class="node ${chosenCap ? "node-chosen" : ""} ${lockedCap ? "node-locked" : ""}" data-node-id="${cap.id}">
            <strong>${cap.name}</strong><br>
            <span style="opacity:0.8;">${cap.description}</span>
          </div>
        `;
        container.appendChild(capDiv);
      }
  
      // Attach click handlers
      container.querySelectorAll(".node").forEach(nodeEl => {
        nodeEl.addEventListener("click", () => onNodeClick(nodeEl));
      });
  
      // Reset selection + buttons
      selectedNodeId = null;
      document.getElementById("confirmBtn").style.display = "none";
      document.getElementById("returnBtn").style.display = "block";
      document.getElementById("saveStatus").textContent = "";
    }
  
    function onNodeClick(nodeEl) {
      const nodeId = nodeEl.getAttribute("data-node-id");
      const chosen = getChosenIds();
  
      // Already chosen → ignore
      if (chosen.has(nodeId)) return;
  
      // Find node definition
      const node = findNodeById(nodeId);
      if (!node) return;
  
      // Check lock (requires)
      if (node.requires && !chosen.has(node.requires)) {
        document.getElementById("saveStatus").textContent = "You must unlock the previous talent first.";
        return;
      }
  
      // Check capstone lock
      if (tierData.capstone && nodeId === tierData.capstone.id) {
        const allNodesChosen = Object.values(branches).every(nodes =>
          nodes.every(n => chosen.has(n.id))
        );
        if (!allNodesChosen) {
          document.getElementById("saveStatus").textContent = "Unlock all Tier talents before the capstone.";
          return;
        }
      }
  
      // Check talent points
      if ((player.talentPoints || 0) <= 0) {
        document.getElementById("saveStatus").textContent = "Not enough talent points.";
        return;
      }
  
      // Select node
      selectedNodeId = nodeId;
      document.querySelectorAll(".node").forEach(el => el.classList.remove("node-selected"));
      nodeEl.classList.add("node-selected");
      document.getElementById("confirmBtn").style.display = "block";
      document.getElementById("saveStatus").textContent = `Ready to learn: ${node.name}`;
    }
  
    function findNodeById(id) {
      for (const nodes of Object.values(branches)) {
        const found = nodes.find(n => n.id === id);
        if (found) return found;
      }
      if (tierData.capstone && tierData.capstone.id === id) return tierData.capstone;
      return null;
    }
  
    /* ------------------------------------------------------------
       SAVE TALENT CHOICE (ONE NODE)
    ------------------------------------------------------------ */
    document.getElementById("confirmBtn").onclick = async () => {
      if (!selectedNodeId) return;
  
      const chosen = getChosenIds();
      if (chosen.has(selectedNodeId)) return;
  
      const node = findNodeById(selectedNodeId);
      if (!node) return;
  
      if ((player.talentPoints || 0) <= 0) {
        document.getElementById("saveStatus").textContent = "Not enough talent points.";
        return;
      }
  
      // Apply choice
      player.talentTree.push({ id: node.id });
      player.talentPoints = (player.talentPoints || 0) - 1;
  
      // Save locally
      PlayerStorage.save(username, player);
  
      // Save to KV
      const res = await savePlayerToKV(username, player);
  
      const status = document.getElementById("saveStatus");
      if (res && res.ok) {
        status.textContent = "Talent learned and saved to KV ✔";
      } else {
        status.textContent = "Error saving to KV.";
      }
  
      // Re-render tier with updated state
      renderTier();
    };
  
    /* ------------------------------------------------------------
       RETURN BUTTON
    ------------------------------------------------------------ */
    document.getElementById("returnBtn").onclick = () => {
      window.location.href = "character.html";
    };
  
    /* ------------------------------------------------------------
       HELPERS
    ------------------------------------------------------------ */
    function format(str) {
      return String(str)
        .replace(/_/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
    }
  </script>

</body>
</html>
