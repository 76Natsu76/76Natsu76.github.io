<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dungeon Complete</title>

  <style>
    body {
      background:#0d0f14;
      color:#e8e8e8;
      font-family:system-ui, sans-serif;
      padding:24px;
      text-align:center;
    }
    .summary-box {
      background:#14171f;
      border:1px solid #333;
      padding:24px;
      border-radius:10px;
      max-width:500px;
      margin:40px auto;
    }
    .btn {
      padding:10px 14px;
      border-radius:6px;
      border:1px solid #444;
      background:#1a1d24;
      color:#eee;
      cursor:pointer;
      margin-top:12px;
      width:100%;
    }
    .btn:hover { background:#222832; }
    .loot-item {
      margin:4px 0;
    }
  </style>
</head>

<body>

  <h1>Dungeon Cleared!</h1>
  <div id="usernameDisplay"></div>

  <div id="summary" class="summary-box">Loading...</div>

  <script type="module">
    import { requireSession } from "./session-guard.js";
    import { PlayerStorage } from "./player-storage.js";
    import { DUNGEONS } from "./dungeons.js";

    await requireSession();
    const { username } = window.syncState;

    const player = PlayerStorage.load(username);
    document.getElementById("usernameDisplay").textContent =
      "Logged in as: " + username;

    const summaryBox = document.getElementById("summary");

    const run = player.lastCompletedDungeonRun;
    if (!run) {
      summaryBox.innerHTML = "<p>No completed dungeon run found.</p>";
      throw new Error("No completed dungeon run");
    }

    const dungeon = DUNGEONS[run.dungeonKey];

    const lootHtml = run.items.length
      ? run.items.map(i => `<div class="loot-item">${i.name} x${i.quantity}</div>`).join("")
      : "<p>No items found.</p>";

    summaryBox.innerHTML = `
      <h2>${dungeon.name}</h2>
      <p>You cleared the dungeon!</p>

      <h3>Rewards</h3>
      <p>XP: <strong>${run.xp}</strong></p>
      <p>Gold: <strong>${run.gold}</strong></p>

      <h3>Items</h3>
      ${lootHtml}

      <button class="btn" onclick="runAgain()">Run Again</button>
      <button class="btn" onclick="town()">Return to Town</button>
      <button class="btn" onclick="leaderboard()">View Leaderboard</button>
    `;

    window.runAgain = () => {
      player.activeDungeonRun = null;
      PlayerStorage.save(username, player);
      window.location.href = "dungeon-select.html";
    };

    window.town = () => {
      player.activeDungeonRun = null;
      PlayerStorage.save(username, player);
      window.location.href = "town.html";
    };

    window.leaderboard = () => {
      window.location.href = "leaderboards.html#dungeons";
    };
  </script>

</body>
</html>
