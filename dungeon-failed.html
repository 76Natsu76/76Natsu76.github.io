<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dungeon Failed</title>

  <style>
    body {
      background:#0d0f14;
      color:#e8e8e8;
      font-family:system-ui, sans-serif;
      padding:24px;
      text-align:center;
    }
    .summary-box {
      background:#14171f;
      border:1px solid #333;
      padding:24px;
      border-radius:10px;
      max-width:500px;
      margin:40px auto;
    }
    .btn {
      padding:10px 14px;
      border-radius:6px;
      border:1px solid #444;
      background:#1a1d24;
      color:#eee;
      cursor:pointer;
      margin-top:12px;
      width:100%;
    }
    .btn:hover { background:#222832; }
  </style>
</head>

<body>

  <h1>Dungeon Failed</h1>
  <div id="usernameDisplay"></div>

  <div id="summary" class="summary-box">
    <p>You were defeated...</p>
    <button class="btn" onclick="retry()">Retry Dungeon</button>
    <button class="btn" onclick="town()">Return to Town</button>
  </div>

  <script type="module">
    import { requireSession } from "./session-guard.js";
    import { PlayerStorage } from "./player-storage.js";

    await requireSession();
    const { username } = window.syncState;

    const player = PlayerStorage.load(username);
    document.getElementById("usernameDisplay").textContent =
      "Logged in as: " + username;

    window.retry = () => {
      // Clear only the active run
      player.activeDungeonRun = null;
      PlayerStorage.save(username, player);
      window.location.href = "dungeon-select.html";
    };

    window.town = () => {
      player.activeDungeonRun = null;
      PlayerStorage.save(username, player);
      window.location.href = "town.html";
    };
  </script>

</body>
</html>
