<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dungeon Failed</title>
  <style>
    body { background:#0d0f14; color:#e8e8e8; font-family:system-ui; padding:24px; }
    .box { background:#14171f; border:1px solid #333; padding:20px; border-radius:8px; }
    .btn { padding:10px 14px; border-radius:6px; border:1px solid #444; background:#1a1d24; color:#eee; cursor:pointer; width:100%; margin-top:12px; }
    .btn:hover { background:#222832; }
  </style>
</head>

<body>

  <h1>Dungeon Failed</h1>
  <div class="box">
    <p>You were defeated inside the dungeon.</p>
    <p>Your run has ended.</p>
  </div>

  <button class="btn" onclick="goToTown()">Return to Town</button>

  <script type="module">
    import { requireSession } from "./session-guard.js";
    import { PlayerStorage } from "./player-storage.js";

    await requireSession();
    const { username } = window.syncState;

    const player = PlayerStorage.load(username);
    player.activeDungeonRun = null;
    PlayerStorage.save(username, player);

    window.goToTown = () => window.location.href = "town.html";
  </script>

</body>
</html>
