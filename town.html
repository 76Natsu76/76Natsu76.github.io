<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Town Hub</title>
    <link rel="stylesheet" href="styles.css" />

    <style>
      body {
        background: #0b0e14;
        color: #e0e0e0;
        font-family: Arial, sans-serif;
      }

      .container {
        max-width: 1100px;
        margin: 30px auto;
        padding: 20px;
        background: #11141c;
        border-radius: 10px;
        box-shadow: 0 0 20px #000;
      }

      h1, h2, h3 {
        text-align: center;
        margin-bottom: 10px;
      }

      .section {
        margin-top: 20px;
        background: #161a22;
        border-radius: 8px;
        padding: 15px;
      }

      .stat-row {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid #222;
      }

      .btn {
        display: inline-block;
        padding: 10px 18px;
        margin: 8px 4px;
        background: #2a3244;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.2s;
      }

      .btn:hover {
        background: #3b465e;
      }

      .npc-entry,
      .npc-dialogue-box,
      .shop-item,
      .crafting-entry,
      .upgrade-entry,
      .history-entry {
        margin: 6px 0;
        padding: 8px;
        border-radius: 6px;
        background: #1b202b;
      }

      .npc-dialogue-box p {
        margin: 4px 0 0 0;
      }

      .center {
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>🏰 Town Hub</h1>
      <div id="townContent">
        <div id="townLayout">
          <div class="section" id="buildingSection">
            <h2>Buildings</h2>
            <div id="buildingList"></div>
            <div id="buildingInterior"></div>
          </div>

          <!-- Player summary -->
          <div class="section" id="playerPanel"></div>
          <button class="btn" id="clearBountyBtn">Pay Off Bounty</button>

          <!-- Settlement header (name, description, core stats) -->
          <div class="section" id="settlementHeader"></div>

          <!-- Housing + reputation -->
          <div class="section" id="housingReputationPanel"></div>

          <!-- NPCs: list, dialogue, quests -->
          <div class="section" id="npcSection">
            <h2>NPCs</h2>
            <div id="npcList"></div>
            <div id="npcDialoguePanel"></div>
            <div id="npcQuests"></div>
          </div>

          <!-- Economy: resources, shop, crafting -->
          <div class="section" id="shopCraftingSection">
            <h2>Shops & Crafting</h2>
            <div id="settlementEconomy"></div>
            <div id="settlementShop"></div>
            <div id="craftingPanel"></div>
          </div>

          <!-- Upgrades -->
          <div class="section" id="upgradesSection">
            <h2>Settlement Upgrades</h2>
            <div id="settlementUpgrades"></div>
          </div>

          <!-- World integration: crisis, alliances, etc. -->
          <div class="section" id="worldIntegrationSection">
            <h2>Settlement Status</h2>
            <div id="settlementCrisisPanel"></div>
            <div id="settlementAlliancesPanel"></div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="town.js"></script>
  </body>
</html>
