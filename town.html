<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8" />
  <title>Town Hub</title>
  <link rel="stylesheet" href="styles.css" />

  <style>
    body {
    background: #0b0e14;
    color: #e0e0e0;
    font-family: Arial, sans-serif;
    }
    
    .container {
    max-width: 900px;
    margin: 30px auto;
    padding: 20px;
    background: #11141c;
    border-radius: 10px;
    box-shadow: 0 0 20px #000;
    }
    
    h1, h2 {
    text-align: center;
    margin-bottom: 10px;
    }
    
    .section {
    margin-top: 20px;
    background: #161a22;
    border-radius: 8px;
    padding: 15px;
    }
    
    .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid #222;
    }
    
    .btn {
    display: inline-block;
    padding: 10px 18px;
    margin: 8px;
    background: #2a3244;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.2s;
    }
    
    .btn:hover {
    background: #3b465e;
    }
    
    .portrait-frame {
    width: 120px;
    height: 120px;
    margin: 0 auto;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid #444;
    }
    
    .portrait-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    }
    
    .center {
    text-align: center;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🏰 Town Hub</h1>
    <div id="townContent">Loading...</div>
  </div>
  <script type="module" src="town.js"></script>
</body>
</html>
