<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dungeon Room</title>

  <style>
    body {
      background:#0d0f14;
      color:#e8e8e8;
      font-family:system-ui, sans-serif;
      padding:24px;
    }

    h1 { color:#7fffd4; margin-bottom:4px; }
    #usernameDisplay { opacity:0.8; margin-bottom:16px; }

    .room-box {
      background:#14171f;
      border:1px solid #333;
      padding:20px;
      border-radius:8px;
      margin-bottom:20px;
    }

    .btn {
      padding:10px 14px;
      border-radius:6px;
      border:1px solid #444;
      background:#1a1d24;
      color:#eee;
      cursor:pointer;
      margin-top:10px;
      width:100%;
      text-align:center;
    }
    .btn:hover { background:#222832; }
  </style>
</head>

<body>

  <h1>Dungeon Room</h1>
  <div id="usernameDisplay"></div>
  

  <div id="dungeonInfo"></div>
  <div id="roomContainer" class="room-box">Loading...</div>
  
  <button class="btn" onclick="openMap()">View Dungeon Map</button>
  <button class="btn" onclick="leaveDungeon()">Leave Dungeon</button>

  <script type="module">
    import { requireSession } from "./session-guard.js";
    import { PlayerStorage } from "./player-storage.js";
    import { DungeonEngine } from "./dungeon-engine.js";
    import { DUNGEONS } from "./dungeons.js";
    import { generateDungeonEncounter } from "./dungeon-encounters.js";
    import { resolveDungeonEvent, resolveDungeonChest } from "./dungeon-events.js";

    await requireSession();
    const { username } = window.syncState;

    const player = PlayerStorage.load(username);
    document.getElementById("usernameDisplay").textContent =
      "Logged in as: " + username;

    const run = player.activeDungeonRun;

    if (!run) {
      document.getElementById("roomContainer").innerHTML =
        "<p>No active dungeon run found.</p>";
      throw new Error("No active dungeon run");
    }

    const dungeon = DUNGEONS[run.dungeonKey];
    const isEndless = dungeon.type === "endless";

    // Determine floor label
    const floorLabel = isEndless
      ? `Floor ${run.currentFloor}`
      : `Floor ${run.currentFloor} / ${dungeon.floors}`;

    let modifierHtml = "";
    if (run.activeModifiers?.length) {
      modifierHtml = `
        <p><strong>Modifiers:</strong> ${run.activeModifiers.join(", ")}</p>
      `;
    }
    
    document.getElementById("dungeonInfo").innerHTML = `
      <div class="room-box">
        <h2>${dungeon.name}</h2>
        <p>${floorLabel}</p>
        <p>State: ${run.state}</p>
        ${modifierHtml}
      </div>
    `;

    /************************************************************
     * ROOM GENERATION
     ************************************************************/
    let room = null;

    if (run.state === "exploring") {
      room = DungeonEngine.generateRoom(run);
    } else if (run.state === "boss") {
      room = { type: "boss" };
    } else if (run.state === "completed") {
      document.getElementById("roomContainer").innerHTML =
        "<p>You have already completed this dungeon.</p>";
      return;
    } else if (run.state === "failed") {
      document.getElementById("roomContainer").innerHTML =
        "<p>Your dungeon run has failed.</p>";
      return;
    }

    renderRoom(room);

    /************************************************************
     * RENDER ROOM
     ************************************************************/
    function renderRoom(room) {
      const box = document.getElementById("roomContainer");

      /************************************************************
       * ENCOUNTER ROOM (multi-wave)
       ************************************************************/
      if (room.type === "encounter") {
        box.innerHTML = `
          <h3>Enemy Encounter</h3>
          <p>You sense danger ahead...</p>
          <button class="btn" id="fightBtn">Fight</button>
        `;

        document.getElementById("fightBtn").onclick = () => {
          DungeonEngine.saveRun(player, run, username);

          const encounter = generateDungeonEncounter(run);

          localStorage.setItem("current_encounter", JSON.stringify({
            type: "dungeon_multiwave",
            dungeonKey: run.dungeonKey,
            floor: run.currentFloor,
            waves: encounter.waves,
            totalWaves: encounter.totalWaves
          }));

          window.location.href = "fight-interactive.html";
        };

        return;
      }

      function renderLabyrinthExits() {
        if (run.mode !== "labyrinth" || !run.labyrinth) return;
      
        const lab = run.labyrinth;
        const room = lab.rooms[lab.currentRoomId];
        const box = document.getElementById("roomContainer");
      
        let html = `<h4>Paths</h4>`;
      
        for (const id of room.neighbors) {
          const r = lab.rooms[id];
          const label =
            r.type === "boss"
              ? `${id} (Boss)`
              : `${id} (Depth ${r.depth})`;
      
          html += `<button class="btn lab-exit" data-room="${id}">${label}</button>`;
        }
      
        box.innerHTML += html;
      
        box.querySelectorAll(".lab-exit").forEach(btn => {
          btn.onclick = () => {
            const next = btn.getAttribute("data-room");
            DungeonEngine.moveToLabyrinthRoom(run, next);
            DungeonEngine.saveRun(player, run, username);
            window.location.reload();
          };
        });
      }

      /************************************************************
       * EVENT ROOM
       ************************************************************/
      if (room.type === "event") {
        const eventKey =
          room.events[Math.floor(Math.random() * room.events.length)];

        box.innerHTML = `
          <h3>Dungeon Event</h3>
          <p>An event unfolds: <strong>${eventKey}</strong></p>
          <button class="btn" id="eventBtn">Resolve Event</button>
        `;

        document.getElementById("eventBtn").onclick = () => {
          const result = resolveDungeonEvent(eventKey, player, run);

          PlayerStorage.save(username, player);

          box.innerHTML = `
            <h3>Event Resolved</h3>
            <p>${result.logs.join("<br>")}</p>
            <button class="btn" id="continueBtn">Continue</button>
          `;

          document.getElementById("continueBtn").onclick = () => {
            if (run.mode === "labyrinth") {
              renderLabyrinthExits();
            } else {
              DungeonEngine.completeFloor(run);
              DungeonEngine.saveRun(player, run, username);
              window.location.reload();
            }
          };
        };
        return;
      }

      /************************************************************
       * TREASURE ROOM (with mimic chance)
       ************************************************************/
      if (room.type === "treasure") {
        const roomKey = `${run.currentFloor}-treasure`;

        box.innerHTML = `
          <h3>Treasure Room</h3>
          <p>You discover a treasure chest...</p>
          <button class="btn" id="lootBtn">Open Chest</button>
        `;

        document.getElementById("lootBtn").onclick = () => {
          const result = resolveDungeonChest(player, run, roomKey);

          // If mimic → start combat
          if (result.type === "mimic") {
            DungeonEngine.saveRun(player, run, username);

            localStorage.setItem("current_encounter", JSON.stringify({
              type: "dungeon_mimic",
              dungeonKey: run.dungeonKey,
              floor: run.currentFloor,
              enemies: [result.enemy]
            }));

            window.location.href = "fight-interactive.html";
            return;
          }

          // Treasure
          if (result.loot) {
            player.gold = (player.gold || 0) + (result.loot.gold || 0);
            player.xp = (player.xp || 0) + (result.loot.xp || 0);
            player.inventory = player.inventory || [];
            player.inventory.push(...(result.loot.items || []));
          }

          PlayerStorage.save(username, player);

          box.innerHTML = `
            <h3>Treasure Found</h3>
            <p>${result.logs.join("<br>")}</p>
            <button class="btn" id="continueBtn">Continue</button>
          `;

          document.getElementById("continueBtn").onclick = () => {
            if (run.mode === "labyrinth") {
              renderLabyrinthExits();
            } else {
              DungeonEngine.completeFloor(run);
              DungeonEngine.saveRun(player, run, username);
              window.location.reload();
            }
          };
        };

        return;
      }

      /************************************************************
       * BOSS ROOM
       ************************************************************/
      if (room.type === "boss") {
        box.innerHTML = `
          <h3>Boss Chamber</h3>
          <p>The final challenge awaits...</p>
          <button class="btn" id="bossBtn">Fight Boss</button>
        `;

        document.getElementById("bossBtn").onclick = () => {
          DungeonEngine.saveRun(player, run, username);

          localStorage.setItem("current_encounter", JSON.stringify({
            type: "dungeon_boss",
            dungeonKey: run.dungeonKey,
            floor: run.currentFloor
          }));

          window.location.href = "fight-interactive.html";
        };

        return;
      }
      
      /************************************************************
       * MIMIC ROOM
       ************************************************************/

      if (room.type === "mimic") {
        box.innerHTML = `
          <h3>Mimic!</h3>
          <p>The chest sprouts teeth and attacks!</p>
          <button class="btn" id="fightMimicBtn">Fight</button>
        `;
      
        document.getElementById("fightMimicBtn").onclick = () => {
          DungeonEngine.saveRun(player, run, username);
      
          const encounter = {
            type: "dungeon",
            dungeonKey: run.dungeonKey,
            floor: run.currentFloor,
            enemies: [{ key: room.enemyKey }]
          };
      
          localStorage.setItem("current_encounter", JSON.stringify(encounter));
          window.location.href = "fight-interactive.html";
        };
        return;
      }
      
    /************************************************************
     * BOSS CHEST ROOM
     ************************************************************/
      
      if (room.type === "boss_chest") {
        box.innerHTML = `
          <h3>Boss Treasure</h3>
          <p>The guardian has fallen. A radiant chest awaits.</p>
          <button class="btn" id="lootBossChestBtn">Open Chest</button>
        `;
      
        document.getElementById("lootBossChestBtn").onclick = () => {
          const logs = [];
          const loot = DungeonEngine.resolveTreasure(room.lootTable, run, logs);
      
          if (loot) {
            player.gold += loot.gold || 0;
            player.xp += loot.xp || 0;
            player.inventory.push(...(loot.items || []));
          }
      
          PlayerStorage.save(username, player);
      
          box.innerHTML = `
            <h3>Treasure Claimed</h3>
            <p>${logs.join("<br>")}</p>
            <button class="btn" id="continueBtn">Continue</button>
          `;
      
          document.getElementById("continueBtn").onclick = () => {
            if (run.mode === "labyrinth") {
              renderLabyrinthExits();
            } else {
              DungeonEngine.completeFloor(run);
              DungeonEngine.saveRun(player, run, username);
              window.location.reload();
            }
          };
        };      
        return;
      }
    }

    /************************************************************
     * LEAVE DUNGEON
     ************************************************************/
    function leaveDungeon() {
      PlayerStorage.save(username, player);
      window.location.href = "town.html";
    }

    window.openMap = () => {
      window.location.href = "dungeon-map.html";
    };
    window.leaveDungeon = leaveDungeon;
  </script>
</body>
</html>
