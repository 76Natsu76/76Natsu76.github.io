<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>S3ven's RPG — Landing</title>

  <style>
    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    h1 {
      color: #7fffd4;
      margin-bottom: 10px;
    }
    #status {
      margin-top: 20px;
      white-space: pre-wrap;
      font-size: 14px;
      color: #7fffd4;
    }
    button {
      background: #6441a5;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 18px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      background: #7d5bbe;
    }
  </style>
</head>

<body>

  <h1>Welcome to S3ven's RPG</h1>
  <div id="status">Loading your character…</div>

  <button id="enterBtn" style="display:none;">Enter the World</button>

  <script type="module">
    import { requireSession } from "./session-guard.js";
    import { PlayerStorage } from "./player-storage.js";
    import * as api from "./api.js";

    // Ensure session is valid
    await requireSession();

    const { username } = window.syncState;
    if (!username) {
      window.location.href = "login.html";
    }

    const statusBox = document.getElementById("status");
    const enterBtn = document.getElementById("enterBtn");

    function log(msg) {
      console.log(msg);
      statusBox.textContent += "\n" + msg;
    }

    log("Logged in as: " + username);

    async function loadPlayer() {
      log("Loading player from KV…");

      // 1. Try KV first
      let kvPlayer = null;
      try {
        kvPlayer = await api.loadPlayerFromKV(username);
      } catch (err) {
        console.error("KV load failed:", err);
      }

      if (kvPlayer) {
        log("KV player found → syncing to localStorage");
        PlayerStorage.save(username, kvPlayer);
        return kvPlayer;
      }

      // 2. Fallback to localStorage
      log("No KV data → checking localStorage");
      const localPlayer = PlayerStorage.load(username);

      if (localPlayer) {
        log("Loaded local player");
        return localPlayer;
      }

      // 3. No KV and no local → create new
      log("No player data found → creating new player");
      const newPlayer = PlayerStorage.create(username);
      PlayerStorage.save(username, newPlayer);
      return newPlayer;
    }

    // Load player and update UI
    const player = await loadPlayer();
    log(`Welcome, ${player.name || username}!`);
    enterBtn.style.display = "block";

    enterBtn.addEventListener("click", () => {
      window.location.href = "world-map.html";
    });
  </script>

</body>
</html>
