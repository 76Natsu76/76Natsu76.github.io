<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Arena</title>
  <link rel="stylesheet" href="arena.css" />
</head>

<body>
  <div id="arena-container">
    <h1>Arena</h1>

    <div id="arena-menu">
      <button id="btnLobby">Lobby</button>
      <button id="btnLeaderboards">Leaderboards</button>
      <button id="btnHistory">Match History</button>
    </div>

    <div id="arena-content"></div>
  </div>

  <!-- Load everything as modules -->
  <script type="module">
    import { requireSession } from "./session-guard.js";
    import { ArenaEngine } from "./arena-engine.js";
    import { ArenaHistory } from "./arena-history.js";
    import { ArenaLeaderboard } from "./arena-leaderboard.js";
    import * as ArenaUI from "./arena-ui.js";

    // Ensure session exists
    const session = requireSession();
    if (!session) {
      document.body.innerHTML = "<h2>No active session.</h2>";
      throw new Error("No session");
    }

    // Wire UI buttons
    document.getElementById("btnLobby").onclick = ArenaUI.showLobby;
    document.getElementById("btnLeaderboards").onclick = ArenaUI.showLeaderboards;
    document.getElementById("btnHistory").onclick = ArenaUI.showHistory;

    // Initialize default view
    ArenaUI.showLobby();
  </script>

</body>
</html>
