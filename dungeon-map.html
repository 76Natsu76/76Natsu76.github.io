<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dungeon Map</title>

  <style>
    body {
      background:#0d0f14;
      color:#e8e8e8;
      font-family:system-ui, sans-serif;
      padding:24px;
    }
    .map-box {
      background:#14171f;
      border:1px solid #333;
      padding:20px;
      border-radius:10px;
      max-width:600px;
      margin:0 auto;
    }
    .floor {
      padding:10px;
      border-bottom:1px solid #333;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .current {
      background:#1f2533;
      border-left:4px solid #7fffd4;
    }
    .boss {
      color:#ff7777;
      font-weight:bold;
    }
    .mega {
      color:#ff33aa;
      font-weight:bold;
    }

    /* LABYRINTH FOG-OF-WAR */
    .lab-room {
      padding: 8px;
      margin: 4px 0;
      border-radius: 6px;
    }
    .lab-room.visible {
      background: #1f2533;
      border-left: 4px solid #7fffd4;
    }
    .lab-room.adjacent {
      background: #14171f;
      opacity: 0.5;
    }
    .lab-room.hidden {
      background: #0d0f14;
      color: #333;
    }

    .btn {
      padding:10px 14px;
      border-radius:6px;
      border:1px solid #444;
      background:#1a1d24;
      color:#eee;
      cursor:pointer;
      margin-top:12px;
      width:100%;
    }
    .btn:hover { background:#222832; }
  </style>
</head>

<body>

  <h1>Dungeon Map</h1>
  <div id="usernameDisplay"></div>

  <div id="dungeonInfo" class="map-box"></div>
  <div id="map" class="map-box">Loading...</div>

  <button class="btn" onclick="returnToRun()">Return to Run</button>
  <button class="btn" onclick="abandonRun()">Abandon Run</button>

  <script type="module">
    import { requireSession } from "./session-guard.js";
    import { PlayerStorage } from "./player-storage.js";
    import { DUNGEONS } from "./dungeons.js";
    import { DungeonEngine } from "./dungeon-engine.js";

    await requireSession();
    const { username } = window.syncState;

    const player = PlayerStorage.load(username);
    document.getElementById("usernameDisplay").textContent =
      "Logged in as: " + username;

    const run = player.activeDungeonRun;
    const mapBox = document.getElementById("map");

    if (!run) {
      mapBox.innerHTML = "<p>No active dungeon run.</p>";
      throw new Error("No active dungeon run");
    }

    const dungeon = DUNGEONS[run.dungeonKey];
    const isEndless = dungeon.type === "endless";
    const isLabyrinth = dungeon.type === "labyrinth";
    const isGreat = dungeon.type === "great_dungeon";

    /************************************************************
     * HEADER (Dungeon Name + Seed)
     ************************************************************/
    let headerHtml = `
      <h2>${dungeon.name}</h2>
    `;

    if (run.seed) {
      headerHtml += `<p><strong>Seed:</strong> ${run.seed}</p>`;
    }

    document.getElementById("dungeonInfo").innerHTML = headerHtml;

    /************************************************************
     * RENDER MAP
     ************************************************************/
    renderMap();

    function renderMap() {
      if (isEndless) return renderEndlessMap();
      if (isLabyrinth) return renderLabyrinthMap();
      if (isGreat) return renderGreatDungeonMap();
      return renderNormalDungeonMap();
    }

    /************************************************************
     * NORMAL DUNGEON MAP
     ************************************************************/
    function renderNormalDungeonMap() {
      let html = "";

      for (let f = 1; f <= dungeon.floors; f++) {
        const isBoss = dungeon.bossFloor
          ? f === dungeon.bossFloor
          : f === dungeon.floors;

        html += `
          <div class="floor ${f === run.currentFloor ? "current" : ""}">
            <span>Floor ${f}</span>
            <span class="${isBoss ? "boss" : ""}">
              ${isBoss ? "Boss" : ""}
            </span>
          </div>
        `;
      }

      mapBox.innerHTML = html;
    }

    /************************************************************
     * GREAT DUNGEON MAP
     ************************************************************/
    function renderGreatDungeonMap() {
      let html = "";

      for (let f = 1; f <= dungeon.floors; f++) {
        const isBoss = f % dungeon.bossEvery === 0;

        html += `
          <div class="floor ${f === run.currentFloor ? "current" : ""}">
            <span>Floor ${f}</span>
            <span class="${isBoss ? "boss" : ""}">
              ${isBoss ? "Boss Floor" : ""}
            </span>
          </div>
        `;
      }

      mapBox.innerHTML = html;
    }

    /************************************************************
     * ENDLESS ABYSS MAP
     ************************************************************/
    function renderEndlessMap() {
      let html = "";

      const start = Math.max(1, run.currentFloor - 10);
      const end = run.currentFloor + 3;

      for (let f = start; f <= end; f++) {
        const isMega = dungeon.megaBossEvery && f % dungeon.megaBossEvery === 0;
        const isBoss = dungeon.bossEvery && f % dungeon.bossEvery === 0;

        html += `
          <div class="floor ${f === run.currentFloor ? "current" : ""}">
            <span>Floor ${f}</span>
            <span class="${isMega ? "mega" : isBoss ? "boss" : ""}">
              ${isMega ? "Mega Boss" : isBoss ? "Boss" : ""}
            </span>
          </div>
        `;
      }

      mapBox.innerHTML = html;
    }

    /************************************************************
     * LABYRINTH MAP (Fog-of-War)
     ************************************************************/
    function renderLabyrinthMap() {
      const lab = run.labyrinth;
      const visibility = DungeonEngine.getLabyrinthVisibility(run);

      let html = `<h3>Labyrinth Map</h3>`;

      for (const id in lab.rooms) {
        const room = lab.rooms[id];
        const state = visibility[id] || "hidden";

        let label = id;

        if (state !== "hidden") {
          if (room.type === "boss") label += " (Boss)";
          if (room.type === "treasure") label += " (Treasure)";
          if (room.type === "event") label += " (Event)";
          if (room.type === "mimic") label += " (Mimic)";
        }

        const cls =
          state === "visible"
            ? "lab-room visible"
            : state === "adjacent"
            ? "lab-room adjacent"
            : "lab-room hidden";

        html += `<div class="${cls}">${label}</div>`;
      }

      mapBox.innerHTML = html;
    }

    /************************************************************
     * BUTTONS
     ************************************************************/
    window.returnToRun = () => {
      window.location.href = "dungeon-room.html";
    };

    window.abandonRun = () => {
      if (!confirm("Are you sure you want to abandon this run?")) return;

      player.activeDungeonRun = null;
      PlayerStorage.save(username, player);

      window.location.href = "dungeon-select.html";
    };
  </script>

</body>
</html>
