<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bestiary</title>

  <style>
    body {
      background: #0d0f14;
      color: #e8e8e8;
      font-family: system-ui, sans-serif;
      padding: 24px;
    }

    h1 {
      color: #7fffd4;
      margin-bottom: 4px;
    }

    #topBar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    #filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    select, input {
      padding: 6px;
      background: #1a1d24;
      border: 1px solid #333;
      color: #eee;
      border-radius: 4px;
    }

    .enemy-card {
      background: #11141c;
      border: 1px solid #262a36;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      gap: 16px;
    }

    .enemy-card img {
      width: 96px;
      height: 96px;
      border-radius: 6px;
      border: 1px solid #333;
      object-fit: cover;
    }

    .enemy-info h2 {
      margin: 0;
      color: #9af7ff;
    }

    .tag {
      display: inline-block;
      padding: 2px 6px;
      background: #1a1d24;
      border: 1px solid #333;
      border-radius: 4px;
      margin-right: 4px;
      font-size: 12px;
    }

    .ability-pill {
      display: inline-block;
      padding: 2px 6px;
      background: #141824;
      border-radius: 4px;
      margin-right: 4px;
      font-size: 12px;
      border: 1px solid #333;
    }

    .btn {
      padding: 6px 10px;
      background: #1f2937;
      border: 1px solid #374151;
      color: #e5e7eb;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn:hover {
      background: #111827;
    }

    #pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      margin-bottom: 16px;
    }

    #pagination span {
      font-size: 14px;
      color: #9ca3af;
    }

    /* Modal */
    #enemyModalOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    #enemyModal {
      background: #11141c;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 16px;
      max-width: 480px;
      width: 100%;
      color: #e5e7eb;
    }

    #enemyModal h2 {
      margin-top: 0;
      color: #9af7ff;
    }

    #enemyModalClose {
      float: right;
      cursor: pointer;
      color: #9ca3af;
    }

    #enemyModal table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      margin-bottom: 8px;
    }

    #enemyModal table td {
      padding: 4px 6px;
      border-bottom: 1px solid #1f2933;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div id="topBar">
    <h1>Bestiary</h1>
    <button class="btn" onclick="goBack()">Back</button>
  </div>

  <div id="filters">
    <select id="regionFilter">
      <option value="">All Regions</option>
    </select>

    <select id="biomeFilter">
      <option value="">All Biomes</option>
    </select>

    <select id="familyFilter">
      <option value="">All Families</option>
    </select>

    <select id="rarityFilter">
      <option value="">All Rarities</option>
      <option>Common</option>
      <option>Uncommon</option>
      <option>Rare</option>
      <option>Epic</option>
      <option>Elite</option>
      <option>Mythical</option>
      <option>Legendary</option>
      <option>Ancient</option>
    </select>

    <select id="sortFilter">
      <option value="name_asc">Sort: Name (A–Z)</option>
      <option value="name_desc">Sort: Name (Z–A)</option>
      <option value="level_asc">Sort: Level (Low→High)</option>
      <option value="level_desc">Sort: Level (High→Low)</option>
      <option value="rarity_asc">Sort: Rarity (Low→High)</option>
      <option value="rarity_desc">Sort: Rarity (High→Low)</option>
      <option value="family_asc">Sort: Family (A–Z)</option>
    </select>

    <input id="searchBox" placeholder="Search enemies...">
  </div>

  <div id="bestiaryContainer">Loading...</div>

  <div id="pagination">
    <button class="btn" id="prevPageBtn">&laquo; Prev</button>
    <span id="pageInfo"></span>
    <button class="btn" id="nextPageBtn">Next &raquo;</button>
  </div>

  <!-- Stats Modal -->
  <div id="enemyModalOverlay">
    <div id="enemyModal">
      <span id="enemyModalClose">✕</span>
      <div id="enemyModalContent"></div>
    </div>
  </div>

  <script type="module">
    import { requireSession } from "./session-guard.js";
    import { WORLD_DATA } from "./world-data.js";
    import { BIOMES } from "./biomes.js";
    import { REGION_TO_BIOME } from "./region-to-biome.js";
    import { EnemyRegistry } from "./enemy-registry.js";
    import { ENEMY_REGIONS } from "./enemy-regions.js";
    import { ENEMY_TAGS } from "./enemy-tags.js";

    const session = requireSession();
    if (!session) {
      window.location.href = "login.html";
    } else {
      initBestiary();
    }

    function initBestiary() {
      const container = document.getElementById("bestiaryContainer");

      const regionFilter = document.getElementById("regionFilter");
      const biomeFilter = document.getElementById("biomeFilter");
      const familyFilter = document.getElementById("familyFilter");
      const rarityFilter = document.getElementById("rarityFilter");
      const sortFilter = document.getElementById("sortFilter");
      const searchBox = document.getElementById("searchBox");

      const prevPageBtn = document.getElementById("prevPageBtn");
      const nextPageBtn = document.getElementById("nextPageBtn");
      const pageInfo = document.getElementById("pageInfo");

      const modalOverlay = document.getElementById("enemyModalOverlay");
      const modalClose = document.getElementById("enemyModalClose");
      const modalContent = document.getElementById("enemyModalContent");

      const PAGE_SIZE = 20;
      let currentPage = 1;

      // -----------------------------
      // FILTER OPTIONS
      // -----------------------------
      for (const key in WORLD_DATA.regions) {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = WORLD_DATA.regions[key].name;
        regionFilter.appendChild(opt);
      }

      for (const key in BIOMES) {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = format(key);
        biomeFilter.appendChild(opt);
      }

      const families = new Set(EnemyRegistry.enemies.map(e => e.family).filter(Boolean));
      families.forEach(f => {
        const opt = document.createElement("option");
        opt.value = f;
        opt.textContent = format(f);
        familyFilter.appendChild(opt);
      });

      // -----------------------------
      // CORE RENDER
      // -----------------------------
      function getFilteredSortedEnemies() {
        const regionVal = regionFilter.value;
        const biomeVal = biomeFilter.value;
        const familyVal = familyFilter.value;
        const rarityVal = rarityFilter.value.toLowerCase();
        const searchVal = searchBox.value.toLowerCase();
        const sortVal = sortFilter.value;

        let list = EnemyRegistry.enemies.slice();

        list = list.filter(e => {
          if (regionVal) {
            const allowed = ENEMY_REGIONS[e.key];
            if (!allowed || !allowed.includes(regionVal)) return false;
          }

          if (biomeVal) {
            const tags = ENEMY_TAGS[e.key] || [];
            if (!isEnemyAllowedInBiome(tags, biomeVal)) return false;
          }

          if (familyVal && e.family !== familyVal) return false;

          if (rarityVal && e.rarity && e.rarity.toLowerCase() !== rarityVal) return false;

          if (searchVal && !e.name.toLowerCase().includes(searchVal)) return false;

          return true;
        });

        // Sorting
        list.sort((a, b) => {
          switch (sortVal) {
            case "name_asc":
              return a.name.localeCompare(b.name);
            case "name_desc":
              return b.name.localeCompare(a.name);
            case "level_asc":
              return (a.level || 0) - (b.level || 0);
            case "level_desc":
              return (b.level || 0) - (a.level || 0);
            case "rarity_asc":
              return rarityRank(a.rarity) - rarityRank(b.rarity);
            case "rarity_desc":
              return rarityRank(b.rarity) - rarityRank(a.rarity);
            case "family_asc":
              return (a.family || "").localeCompare(b.family || "");
            default:
              return a.name.localeCompare(b.name);
          }
        });

        return list;
      }

      function render() {
        const all = getFilteredSortedEnemies();
        const totalPages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = totalPages;

        const start = (currentPage - 1) * PAGE_SIZE;
        const pageSlice = all.slice(start, start + PAGE_SIZE);

        const out = [];

        for (const e of pageSlice) {
          let template;
          try {
            template = EnemyRegistry.buildEnemyTemplate(e.key);
          } catch (err) {
            console.error("Failed to build template for", e.key, err);
            continue;
          }

          const allowedRegions = ENEMY_REGIONS[e.key] || [];
          const tags = ENEMY_TAGS[e.key] || [];

          const abilityPreview = (template.abilities || []).slice(0, 3);
          const hasAbilities = abilityPreview.length > 0;

          out.push(`
            <div class="enemy-card">
              <img src="/assets/enemies/${template.key}.png" alt="${template.name}">
              <div class="enemy-info">
                <h2>${format(template.name)}</h2>

                <div><strong>Family:</strong> ${format(template.family)}</div>
                <div><strong>Rarity:</strong> ${format(template.rarity || "unknown")}</div>
                <div><strong>Level:</strong> ${template.level ?? "?"}</div>
                <div><strong>Element:</strong> ${format(template.element || "neutral")}</div>

                <div><strong>Allowed Regions:</strong> ${
                  allowedRegions.map(format).join(", ") || "Any"
                }</div>

                <div><strong>Tags:</strong> ${
                  tags.length
                    ? tags.map(t => `<span class="tag">${format(t)}</span>`).join("")
                    : "None"
                }</div>

                ${
                  hasAbilities
                    ? `<div style="margin-top:6px;">
                        <strong>Abilities:</strong>
                        ${abilityPreview
                          .map(a => `<span class="ability-pill">${a.name}</span>`)
                          .join("")}
                        ${
                          template.abilities.length > abilityPreview.length
                            ? `<span style="font-size:12px;color:#9ca3af;"> (+${
                                template.abilities.length - abilityPreview.length
                              } more)</span>`
                            : ""
                        }
                      </div>`
                    : ""
                }

                <div class="event" style="margin-top:10px;">
                  ${template.flavor || "No flavor text."}
                </div>

                <div style="margin-top:10px;">
                  <button class="btn" data-key="${template.key}" data-action="viewStats">
                    View Stats
                  </button>
                </div>
              </div>
            </div>
          `);
        }

        container.innerHTML = out.join("") || "<p>No enemies found.</p>";

        pageInfo.textContent = `Page ${currentPage} / ${Math.max(1, Math.ceil(all.length / PAGE_SIZE))}`;
        prevPageBtn.disabled = currentPage <= 1;
        nextPageBtn.disabled = currentPage >= Math.max(1, Math.ceil(all.length / PAGE_SIZE));

        // Bind stats buttons
        container.querySelectorAll("button[data-action='viewStats']").forEach(btn => {
          btn.addEventListener("click", () => {
            const key = btn.getAttribute("data-key");
            openStatsModal(key);
          });
        });
      }

      function openStatsModal(enemyKey) {
        let template;
        try {
          template = EnemyRegistry.buildEnemyTemplate(enemyKey);
        } catch (err) {
          console.error("Failed to build template for modal", enemyKey, err);
          return;
        }

        const baseHP = Math.round(template.baseHP ?? 0);
        const baseATK = Math.round(template.baseATK ?? 0);
        const baseDEF = Math.round(template.baseDEF ?? 0);

        const abilities = template.abilities || [];
        const ultimate = template.ultimate || null;

        modalContent.innerHTML = `
          <h2>${format(template.name)}</h2>
          <div style="font-size:13px;color:#9ca3af;margin-bottom:8px;">
            ${format(template.family)} • ${format(template.rarity || "unknown")} • Level ${template.level ?? "?"}
          </div>

          <table>
            <tr><td><strong>HP</strong></td><td>${baseHP}</td></tr>
            <tr><td><strong>ATK</strong></td><td>${baseATK}</td></tr>
            <tr><td><strong>DEF</strong></td><td>${baseDEF}</td></tr>
            <tr><td><strong>Element</strong></td><td>${format(template.element || "neutral")}</td></tr>
          </table>

          ${
            abilities.length
              ? `<div style="margin-top:8px;">
                  <strong>Abilities</strong>
                  <ul style="margin-top:4px;padding-left:18px;">
                    ${abilities
                      .map(
                        a => `<li><strong>${a.name}</strong> — ${a.description || "No description."}</li>`
                      )
                      .join("")}
                  </ul>
                </div>`
              : `<div style="margin-top:8px;"><strong>Abilities:</strong> None</div>`
          }

          ${
            ultimate
              ? `<div style="margin-top:8px;">
                  <strong>Ultimate:</strong> ${ultimate.name} — ${ultimate.description || "No description."}
                </div>`
              : ""
          }
        `;

        modalOverlay.style.display = "flex";
      }

      modalClose.onclick = () => {
        modalOverlay.style.display = "none";
      };
      modalOverlay.onclick = e => {
        if (e.target === modalOverlay) {
          modalOverlay.style.display = "none";
        }
      };

      // -----------------------------
      // HELPERS
      // -----------------------------
      function isEnemyAllowedInBiome(tags, biomeKey) {
        if (!tags.length) return true;

        if (tags.includes("ice")) {
          return (
            biomeKey === "tundra" ||
            biomeKey === "frozen-expanse" ||
            biomeKey === "crystalline-tundra"
          );
        }

        if (tags.includes("fire")) {
          return (
            biomeKey === "volcano" ||
            biomeKey === "molten-crest" ||
            biomeKey === "magma"
          );
        }

        if (tags.includes("void")) {
          return (
            biomeKey === "void" ||
            biomeKey === "void-wastes" ||
            biomeKey === "void-realm"
          );
        }

        if (tags.includes("arcane")) {
          return biomeKey === "arcane" || biomeKey === "arcane-rift";
        }

        if (tags.includes("astral")) {
          return biomeKey === "astral-plane" || biomeKey === "astral-nexus";
        }

        return true;
      }

      function format(str) {
        return String(str || "")
          .replace(/_/g, " ")
          .replace(/-/g, " ")
          .replace(/\b\w/g, c => c.toUpperCase());
      }

      const rarityOrder = [
        "common",
        "uncommon",
        "rare",
        "epic",
        "elite",
        "mythical",
        "legendary",
        "ancient"
      ];
      function rarityRank(r) {
        if (!r) return -1;
        const idx = rarityOrder.indexOf(String(r).toLowerCase());
        return idx === -1 ? 999 : idx;
      }

      // -----------------------------
      // EVENTS
      // -----------------------------
      regionFilter.onchange = () => { currentPage = 1; render(); };
      biomeFilter.onchange = () => { currentPage = 1; render(); };
      familyFilter.onchange = () => { currentPage = 1; render(); };
      rarityFilter.onchange = () => { currentPage = 1; render(); };
      sortFilter.onchange = () => { currentPage = 1; render(); };
      searchBox.oninput = () => { currentPage = 1; render(); };

      prevPageBtn.onclick = () => {
        if (currentPage > 1) {
          currentPage--;
          render();
        }
      };
      nextPageBtn.onclick = () => {
        currentPage++;
        render();
      };

      render();
    }

    window.goBack = () => {
      window.location.href = "world-map.html";
    };
  </script>

</body>
</html>
