<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bestiary</title>

  <style>
    body {
      background: #0d0f14;
      color: #e8e8e8;
      font-family: system-ui, sans-serif;
      padding: 24px;
    }

    h1 {
      color: #7fffd4;
      margin-bottom: 4px;
    }

    #topBar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    #filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    select, input {
      padding: 6px;
      background: #1a1d24;
      border: 1px solid #333;
      color: #eee;
      border-radius: 4px;
    }

    .enemy-card {
      background: #11141c;
      border: 1px solid #262a36;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      gap: 16px;
    }

    .enemy-card img {
      width: 96px;
      height: 96px;
      border-radius: 6px;
      border: 1px solid #333;
      object-fit: cover;
    }

    .enemy-info h2 {
      margin: 0;
      color: #9af7ff;
    }

    .tag {
      display: inline-block;
      padding: 2px 6px;
      background: #1a1d24;
      border: 1px solid #333;
      border-radius: 4px;
      margin-right: 4px;
      font-size: 12px;
    }

    .ability-pill {
      display: inline-block;
      padding: 2px 6px;
      background: #141824;
      border-radius: 4px;
      margin-right: 4px;
      font-size: 12px;
      border: 1px solid #333;
    }

    .btn {
      padding: 6px 10px;
      background: #1f2937;
      border: 1px solid #374151;
      color: #e5e7eb;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn:hover {
      background: #111827;
    }

    #pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      margin-bottom: 16px;
    }

    #pagination span {
      font-size: 14px;
      color: #9ca3af;
    }

    /* Modal */
    #enemyModalOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    #enemyModal {
      background: #11141c;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 16px;
      max-width: 480px;
      width: 100%;
      color: #e5e7eb;
    }

    #enemyModal h2 {
      margin-top: 0;
      color: #9af7ff;
    }

    #enemyModalClose {
      float: right;
      cursor: pointer;
      color: #9ca3af;
    }

    #enemyModal table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      margin-bottom: 8px;
    }

    #enemyModal table td {
      padding: 4px 6px;
      border-bottom: 1px solid #1f2933;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="topBar">
    <h1>Bestiary</h1>
    <button class="btn" onclick="goBack()">Back</button>
  </div>

  <div id="filters">
    <select id="regionFilter">
      <option value="">All Regions</option>
    </select>

    <select id="biomeFilter">
      <option value="">All Biomes</option>
    </select>

    <select id="familyFilter">
      <option value="">All Families</option>
    </select>

    <select id="rarityFilter">
      <option value="">All Rarities</option>
      <option>Common</option>
      <option>Uncommon</option>
      <option>Rare</option>
      <option>Epic</option>
      <option>Elite</option>
      <option>Mythical</option>
      <option>Legendary</option>
      <option>Ancient</option>
    </select>

    <!-- ⭐ NEW: Tier Filter -->
    <select id="tierFilter">
      <option value="">All Tiers</option>
      <option value="1">Mundane</option>
      <option value="2">Elite</option>
      <option value="3">Mythic</option>
      <option value="4">Titanic</option>
      <option value="5">Cosmic</option>
    </select>

    <input id="searchBox" placeholder="Search enemies...">
  </div>

  <div id="bestiaryContainer">Loading...</div>

  <div id="pagination">
    <button class="btn" id="prevPageBtn">&laquo; Prev</button>
    <span id="pageInfo"></span>
    <button class="btn" id="nextPageBtn">Next &raquo;</button>
  </div>

  <!-- Stats Modal -->
  <div id="enemyModalOverlay">
    <div id="enemyModal">
      <span id="enemyModalClose">✕</span>
      <div id="enemyModalContent"></div>
    </div>
  </div>

  <script type="module">
    import { requireSession } from "./session-guard.js";
    import { WORLD_DATA } from "./world-data.js";
    import { BIOMES } from "./biomes.js";
    import { REGION_TO_BIOME } from "./region-to-biome.js";
    import { EnemyRegistry } from "./enemy-registry.js";
    import { EXPANDED_ENEMY_REGIONS as ENEMY_REGIONS } from "./expanded-enemy-regions.js";

    // ⭐ NEW IMPORTS
    import { TIERED_MATRIX } from "./tiered-matrix.js";
    import { TIER_NAMES } from "./tier-names.js";
    import { REGION_TIERS } from "./region-tiers.js";

    const session = requireSession();

    const container = document.getElementById("bestiaryContainer");
    const regionFilter = document.getElementById("regionFilter");
    const biomeFilter = document.getElementById("biomeFilter");
    const familyFilter = document.getElementById("familyFilter");
    const rarityFilter = document.getElementById("rarityFilter");
    const tierFilter = document.getElementById("tierFilter");

    // --- Dynamic controls: sort + pagination ---
    const filtersBar = document.getElementById("filters");

    const sortSelect = document.createElement("select");
    sortSelect.id = "sortSelect";
    sortSelect.innerHTML = `
      <option value="name_asc">Name (A–Z)</option>
      <option value="name_desc">Name (Z–A)</option>
      <option value="level_asc">Level (Low→High)</option>
      <option value="level_desc">Level (High→Low)</option>
      <option value="rarity_asc">Rarity (Low→High)</option>
      <option value="rarity_desc">Rarity (High→Low)</option>
      <option value="family_asc">Family (A–Z)</option>
      <option value="tier_asc">Tier (Low→High)</option>
      <option value="tier_desc">Tier (High→Low)</option>
    `;

    const searchBox = document.getElementById("searchBox");
    filtersBar.insertBefore(sortSelect, searchBox);

    const paginationBar = document.createElement("div");
    paginationBar.style.marginTop = "12px";
    paginationBar.style.display = "flex";
    paginationBar.style.alignItems = "center";
    paginationBar.style.gap = "8px";

    const prevBtn = document.createElement("button");
    prevBtn.textContent = "Prev";
    prevBtn.className = "btn";
    const nextBtn = document.createElement("button");
    nextBtn.textContent = "Next";
    nextBtn.className = "btn";
    const pageInfo = document.createElement("span");
    pageInfo.style.opacity = "0.8";

    paginationBar.appendChild(prevBtn);
    paginationBar.appendChild(pageInfo);
    paginationBar.appendChild(nextBtn);
    container.parentNode.insertBefore(paginationBar, container.nextSibling);

    // --- Stats modal (created once) ---
    const modal = document.createElement("div");
    modal.id = "enemyStatsModal";
    Object.assign(modal.style, {
      position: "fixed",
      inset: "0",
      background: "rgba(0,0,0,0.7)",
      display: "none",
      alignItems: "center",
      justifyContent: "center",
      zIndex: "9999"
    });

    const modalInner = document.createElement("div");
    Object.assign(modalInner.style, {
      background: "#11141c",
      border: "1px solid #262a36",
      borderRadius: "8px",
      padding: "16px",
      maxWidth: "480px",
      maxHeight: "80vh",
      overflowY: "auto",
      color: "#e8e8e8"
    });
    modalInner.innerHTML = `
      <h2 id="modalEnemyName" style="margin-top:0;color:#9af7ff;"></h2>
      <div id="modalEnemyBody"></div>
      <button id="closeEnemyModal" class="btn" style="margin-top:12px;">Close</button>
    `;
    modal.appendChild(modalInner);
    document.body.appendChild(modal);

    document.getElementById("closeEnemyModal").onclick = () => {
      modal.style.display = "none";
    };
    modal.onclick = e => {
      if (e.target === modal) modal.style.display = "none";
    };

    // ------------------------------------------------------------
    // REGION FAMILY FALLBACK (unchanged)
    // ------------------------------------------------------------
    const REGION_FAMILY = {
      forest: ["forest-edge", "wild-forest", "deep-forest"],
      plains: ["plains-field"],
      tundra: ["tundra", "crystal-tundra"],
      volcano: ["volcano", "molten-crest", "magma"],
      swamp: ["swamp", "boglands"],
      desert: ["desert", "dune-sea"],
      mountains: ["mountains", "highlands"]
    };

    // ------------------------------------------------------------
    // INITIALIZE FILTER OPTIONS (⭐ REGION TIER DISPLAY ADDED)
    // ------------------------------------------------------------
    for (const key in WORLD_DATA.regions) {
      const opt = document.createElement("option");
      opt.value = key;

      const tier = REGION_TIERS[key] || 1;
      const tierName = TIER_NAMES[tier];

      opt.textContent = `${WORLD_DATA.regions[key].name} (${tierName})`;
      regionFilter.appendChild(opt);
    }

    for (const key in BIOMES) {
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = format(key);
      biomeFilter.appendChild(opt);
    }

    const families = new Set(EnemyRegistry.enemies.map(e => e.family).filter(Boolean));
    families.forEach(f => {
      const opt = document.createElement("option");
      opt.value = f;
      opt.textContent = format(f);
      familyFilter.appendChild(opt);
    });

    // ------------------------------------------------------------
    // PAGINATION + SORT STATE
    // ------------------------------------------------------------
    let currentPage = 1;
    const pageSize = 10;
    let currentEnemies = [];

    function rarityRank(r) {
      if (!r) return 0;
      const order = [
        "common",
        "uncommon",
        "rare",
        "epic",
        "elite",
        "mythical",
        "legendary",
        "ancient"
      ];
      const idx = order.indexOf(r.toLowerCase());
      return idx === -1 ? 0 : idx;
    }

    function sortEnemies(list) {
      const mode = sortSelect.value;
      const arr = [...list];

      arr.sort((a, b) => {
        const ta = a.template;
        const tb = b.template;

        switch (mode) {
          case "name_asc":
            return ta.name.localeCompare(tb.name);
          case "name_desc":
            return tb.name.localeCompare(ta.name);
          case "level_asc":
            return (ta.level || 1) - (tb.level || 1);
          case "level_desc":
            return (tb.level || 1) - (ta.level || 1);
          case "rarity_asc":
            return rarityRank(ta.rarity) - rarityRank(tb.rarity);
          case "rarity_desc":
            return rarityRank(tb.rarity) - rarityRank(ta.rarity);
          case "family_asc":
            return format(ta.family || "").localeCompare(format(tb.family || ""));
          case "tier_asc":
            return (
              TIERED_MATRIX[a.template.key].familyTier -
              TIERED_MATRIX[b.template.key].familyTier
            );
          case "tier_desc":
            return (
              TIERED_MATRIX[b.template.key].familyTier -
              TIERED_MATRIX[a.template.key].familyTier
            );
          default:
            return ta.name.localeCompare(tb.name);
        }
      });

      return arr;
    }

</html>
