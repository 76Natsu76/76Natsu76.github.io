<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bestiary</title>

  <style>
    body {
      background: #0d0f14;
      color: #e8e8e8;
      font-family: system-ui, sans-serif;
      padding: 24px;
    }

    h1 {
      color: #7fffd4;
      margin-bottom: 4px;
    }

    #filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    select, input {
      padding: 6px;
      background: #1a1d24;
      border: 1px solid #333;
      color: #eee;
      border-radius: 4px;
    }

    .enemy-card {
      background: #11141c;
      border: 1px solid #262a36;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      gap: 16px;
    }

    .enemy-card img {
      width: 96px;
      height: 96px;
      border-radius: 6px;
      border: 1px solid #333;
      object-fit: cover;
    }

    .enemy-info h2 {
      margin: 0;
      color: #9af7ff;
    }

    .tag {
      display: inline-block;
      padding: 2px 6px;
      background: #1a1d24;
      border: 1px solid #333;
      border-radius: 4px;
      margin-right: 4px;
      font-size: 12px;
    }

    .ability-pill {
      display: inline-block;
      padding: 2px 6px;
      background: #151826;
      border: 1px solid #333;
      border-radius: 4px;
      margin-right: 4px;
      font-size: 12px;
      color: #c5e1ff;
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pagination {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .pagination button {
      padding: 4px 8px;
      background: #1a1d24;
      border: 1px solid #333;
      color: #eee;
      border-radius: 4px;
      cursor: pointer;
    }

    .pagination button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .btn {
      padding: 6px 10px;
      background: #1a1d24;
      border: 1px solid #333;
      color: #eee;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn:hover {
      background: #222633;
    }

    /* Modal */
    #statsModalOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #statsModal {
      background: #11141c;
      border: 1px solid #262a36;
      border-radius: 8px;
      padding: 20px;
      max-width: 420px;
      width: 100%;
      color: #e8e8e8;
    }

    #statsModal h2 {
      margin-top: 0;
      color: #9af7ff;
    }

    #statsModal .row {
      margin-bottom: 6px;
    }

    #statsModalClose {
      float: right;
      cursor: pointer;
      color: #aaa;
    }

    #statsModalClose:hover {
      color: #fff;
    }
  </style>
</head>

<body>

  <h1>Bestiary</h1>

  <div id="filters">
    <select id="regionFilter">
      <option value="">All Regions</option>
    </select>

    <select id="biomeFilter">
      <option value="">All Biomes</option>
    </select>

    <select id="familyFilter">
      <option value="">All Families</option>
    </select>

    <select id="rarityFilter">
      <option value="">All Rarities</option>
      <option>Common</option>
      <option>Uncommon</option>
      <option>Rare</option>
      <option>Epic</option>
      <option>Elite</option>
      <option>Mythical</option>
      <option>Legendary</option>
      <option>Ancient</option>
    </select>

    <select id="sortFilter">
      <option value="name_asc">Name (A–Z)</option>
      <option value="name_desc">Name (Z–A)</option>
      <option value="level_asc">Level (Low→High)</option>
      <option value="level_desc">Level (High→Low)</option>
      <option value="rarity_asc">Rarity (Low→High)</option>
      <option value="rarity_desc">Rarity (High→Low)</option>
    </select>

    <input id="searchBox" placeholder="Search enemies...">
  </div>

  <div class="controls-row">
    <div class="pagination">
      <button id="prevPageBtn">&lt; Prev</button>
      <span id="pageInfo"></span>
      <button id="nextPageBtn">Next &gt;</button>
    </div>
    <button class="btn" onclick="goBack()">Back</button>
  </div>

  <div id="bestiaryContainer">Loading...</div>

  <!-- Stats Modal -->
  <div id="statsModalOverlay">
    <div id="statsModal">
      <span id="statsModalClose">✕</span>
      <h2 id="statsName"></h2>
      <div class="row"><strong>Family:</strong> <span id="statsFamily"></span></div>
      <div class="row"><strong>Rarity:</strong> <span id="statsRarity"></span></div>
      <div class="row"><strong>Level:</strong> <span id="statsLevel"></span></div>
      <div class="row"><strong>Element:</strong> <span id="statsElement"></span></div>
      <div class="row"><strong>Base HP:</strong> <span id="statsHP"></span></div>
      <div class="row"><strong>Base ATK:</strong> <span id="statsATK"></span></div>
      <div class="row"><strong>Base DEF:</strong> <span id="statsDEF"></span></div>
      <div class="row"><strong>Tags:</strong> <span id="statsTags"></span></div>
      <div class="row"><strong>Abilities:</strong> <span id="statsAbilities"></span></div>
      <div class="row"><strong>Ultimate:</strong> <span id="statsUltimate"></span></div>
      <div class="row" style="margin-top:10px;">
        <strong>Flavor:</strong>
        <div id="statsFlavor" style="margin-top:4px;"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireSession } from "./session-guard.js";
    import { WORLD_DATA } from "./world-data.js";
    import { BIOMES } from "./biomes.js";
    import { REGION_TO_BIOME } from "./region-to-biome.js";
    import { EnemyRegistry } from "./enemy-registry.js";
    import { ENEMY_REGIONS } from "./enemy-regions.js";
    import { ENEMY_TAGS } from "./enemy-tags.js";

    const session = requireSession();
    if (!session) {
      window.location.href = "login.html";
    }

    const container = document.getElementById("bestiaryContainer");

    const regionFilter = document.getElementById("regionFilter");
    const biomeFilter = document.getElementById("biomeFilter");
    const familyFilter = document.getElementById("familyFilter");
    const rarityFilter = document.getElementById("rarityFilter");
    const sortFilter = document.getElementById("sortFilter");
    const searchBox = document.getElementById("searchBox");

    const prevPageBtn = document.getElementById("prevPageBtn");
    const nextPageBtn = document.getElementById("nextPageBtn");
    const pageInfo = document.getElementById("pageInfo");

    const PAGE_SIZE = 20;
    let currentPage = 1;
    let filteredList = [];

    // ------------------------------------------------------------
    // INITIALIZE FILTER OPTIONS
    // ------------------------------------------------------------
    for (const key in WORLD_DATA.regions) {
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = WORLD_DATA.regions[key].name;
      regionFilter.appendChild(opt);
    }

    for (const key in BIOMES) {
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = format(key);
      biomeFilter.appendChild(opt);
    }

    const familyKeys = Object.keys(EnemyRegistry.families || {});
    familyKeys.forEach(fKey => {
      const fam = EnemyRegistry.families[fKey];
      const opt = document.createElement("option");
      opt.value = fam.key || fKey;
      opt.textContent = format(fam.name || fam.key || fKey);
      familyFilter.appendChild(opt);
    });

    // ------------------------------------------------------------
    // CORE RENDER PIPELINE
    // ------------------------------------------------------------
    function computeFilteredList() {
      const regionVal = regionFilter.value;
      const biomeVal = biomeFilter.value;
      const familyVal = familyFilter.value;
      const rarityVal = (rarityFilter.value || "").toLowerCase();
      const searchVal = (searchBox.value || "").toLowerCase();

      const out = [];

      for (const raw of EnemyRegistry.enemies) {
        // Region restriction
        if (regionVal) {
          const allowedRegions = ENEMY_REGIONS[raw.key] || [];
          if (!allowedRegions.includes(regionVal)) continue;
        }

        // Biome restriction via tags
        if (biomeVal) {
          const tags = ENEMY_TAGS[raw.key] || [];
          if (!isEnemyAllowedInBiome(tags, biomeVal)) continue;
        }

        // Family filter
        if (familyVal) {
          const famKey = raw.family || EnemyRegistry.subraceMap[raw.key] || EnemyRegistry.raceMap[raw.key];
          if (!famKey || famKey !== familyVal) continue;
        }

        // Rarity filter
        if (rarityVal) {
          if (!raw.rarity || raw.rarity.toLowerCase() !== rarityVal) continue;
        }

        // Search filter
        if (searchVal && !raw.name.toLowerCase().includes(searchVal)) continue;

        let template;
        try {
          template = EnemyRegistry.buildEnemyTemplate(raw.key);
        } catch (err) {
          // If a specific enemy is misconfigured (like missing family),
          // skip it so the whole bestiary doesn't explode.
          console.warn("Skipping enemy due to template error:", raw.key, err);
          continue;
        }

        out.push({ raw, template });
      }

      // Sorting
      const sortVal = sortFilter.value;
      out.sort((a, b) => {
        const ta = a.template;
        const tb = b.template;

        switch (sortVal) {
          case "name_asc":
            return ta.name.localeCompare(tb.name);
          case "name_desc":
            return tb.name.localeCompare(ta.name);
          case "level_asc":
            return (ta.level || 0) - (tb.level || 0);
          case "level_desc":
            return (tb.level || 0) - (ta.level || 0);
          case "rarity_asc":
            return rarityRank(ta.rarity) - rarityRank(tb.rarity);
          case "rarity_desc":
            return rarityRank(tb.rarity) - rarityRank(ta.rarity);
          default:
            return ta.name.localeCompare(tb.name);
        }
      });

      return out;
    }

    function render() {
      filteredList = computeFilteredList();

      const total = filteredList.length;
      const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;

      const start = (currentPage - 1) * PAGE_SIZE;
      const end = start + PAGE_SIZE;
      const pageItems = filteredList.slice(start, end);

      const out = [];

      for (const { raw, template } of pageItems) {
        const allowedRegions = ENEMY_REGIONS[raw.key] || [];
        const tags = ENEMY_TAGS[raw.key] || [];

        const abilityPreview = (template.abilities || [])
          .slice(0, 3)
          .map(a => `<span class="ability-pill">${escapeHtml(a.name || a.key)}</span>`)
          .join("");

        const hasAbilities = (template.abilities || []).length > 0;

        out.push(`
          <div class="enemy-card">
            <img src="/assets/enemies/${template.key}.png" alt="${escapeHtml(template.name)}">

            <div class="enemy-info">
              <h2>${escapeHtml(template.name)}</h2>

              <div><strong>Family:</strong> ${format(template.family)}</div>
              <div><strong>Rarity:</strong> ${format(template.rarity || "Unknown")}</div>
              <div><strong>Level:</strong> ${template.level ?? "?"}</div>
              <div><strong>Element:</strong> ${format(template.element || "neutral")}</div>

              <div><strong>Allowed Regions:</strong> ${
                allowedRegions.length
                  ? allowedRegions.map(format).join(", ")
                  : "Any"
              }</div>

              <div><strong>Tags:</strong> ${
                tags.length
                  ? tags.map(t => `<span class="tag">${format(t)}</span>`).join("")
                  : "None"
              }</div>

              ${
                hasAbilities
                  ? `<div style="margin-top:6px;"><strong>Abilities:</strong> ${abilityPreview}</div>`
                  : `<div style="margin-top:6px;"><strong>Abilities:</strong> None</div>`
              }

              <div class="event" style="margin-top:10px;">
                ${template.flavor || "No flavor text."}
              </div>

              <div style="margin-top:10px;">
                <button class="btn" onclick="openStatsModal('${template.key}')">View Stats</button>
              </div>
            </div>
          </div>
        `);
      }

      container.innerHTML = out.join("") || "<p>No enemies found.</p>";

      pageInfo.textContent = `Page ${currentPage} / ${Math.max(1, Math.ceil(total / PAGE_SIZE))}`;
      prevPageBtn.disabled = currentPage <= 1;
      nextPageBtn.disabled = currentPage >= Math.ceil(total / PAGE_SIZE);
    }

    // ------------------------------------------------------------
    // BIOME TAG LOGIC
    // ------------------------------------------------------------
    function isEnemyAllowedInBiome(tags, biomeKey) {
      if (!tags || !tags.length) return true;

      if (tags.includes("ice")) {
        return (
          biomeKey === "tundra" ||
          biomeKey === "frozen-expanse" ||
          biomeKey === "crystalline-tundra"
        );
      }

      if (tags.includes("fire")) {
        return (
          biomeKey === "volcano" ||
          biomeKey === "molten-crest" ||
          biomeKey === "magma"
        );
      }

      if (tags.includes("void")) {
        return (
          biomeKey === "void" ||
          biomeKey === "void-wastes" ||
          biomeKey === "void-realm"
        );
      }

      if (tags.includes("arcane")) {
        return biomeKey === "arcane" || biomeKey === "arcane-rift";
      }

      if (tags.includes("astral")) {
        return biomeKey === "astral-plane" || biomeKey === "astral-nexus";
      }

      return true;
    }

    // ------------------------------------------------------------
    // HELPERS
    // ------------------------------------------------------------
    function format(str) {
      return String(str || "")
        .replace(/_/g, " ")
        .replace(/-/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function rarityRank(r) {
      if (!r) return 0;
      const key = r.toLowerCase();
      const order = [
        "common",
        "uncommon",
        "rare",
        "epic",
        "elite",
        "mythical",
        "legendary",
        "ancient"
      ];
      const idx = order.indexOf(key);
      return idx === -1 ? 0 : idx;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    window.goBack = () => (window.location.href = "world-map.html");

    // ------------------------------------------------------------
    // STATS MODAL
    // ------------------------------------------------------------
    const statsOverlay = document.getElementById("statsModalOverlay");
    const statsClose = document.getElementById("statsModalClose");

    const statsName = document.getElementById("statsName");
    const statsFamily = document.getElementById("statsFamily");
    const statsRarity = document.getElementById("statsRarity");
    const statsLevel = document.getElementById("statsLevel");
    const statsElement = document.getElementById("statsElement");
    const statsHP = document.getElementById("statsHP");
    const statsATK = document.getElementById("statsATK");
    const statsDEF = document.getElementById("statsDEF");
    const statsTags = document.getElementById("statsTags");
    const statsAbilities = document.getElementById("statsAbilities");
    const statsUltimate = document.getElementById("statsUltimate");
    const statsFlavor = document.getElementById("statsFlavor");

    window.openStatsModal = function(key) {
      let template;
      try {
        template = EnemyRegistry.buildEnemyTemplate(key);
      } catch (err) {
        console.error("Failed to build template for stats modal:", key, err);
        return;
      }

      statsName.textContent = template.name;
      statsFamily.textContent = format(template.family);
      statsRarity.textContent = format(template.rarity || "Unknown");
      statsLevel.textContent = template.level ?? "?";
      statsElement.textContent = format(template.element || "neutral");
      statsHP.textContent = Math.round(template.baseHP ?? 0);
      statsATK.textContent = Math.round(template.baseATK ?? 0);
      statsDEF.textContent = Math.round(template.baseDEF ?? 0);

      const rawTags = ENEMY_TAGS[template.key] || [];
      statsTags.innerHTML = rawTags.length
        ? rawTags.map(t => `<span class="tag">${format(t)}</span>`).join("")
        : "None";

      const abilities = template.abilities || [];
      statsAbilities.innerHTML = abilities.length
        ? abilities.map(a => `<span class="ability-pill">${escapeHtml(a.name || a.key)}</span>`).join("")
        : "None";

      statsUltimate.textContent = template.ultimate
        ? (template.ultimate.name || template.ultimate.key)
        : "None";

      statsFlavor.textContent = template.flavor || "No flavor text.";

      statsOverlay.style.display = "flex";
    };

    statsClose.onclick = () => {
      statsOverlay.style.display = "none";
    };

    statsOverlay.onclick = (e) => {
      if (e.target === statsOverlay) {
        statsOverlay.style.display = "none";
      }
    };

    // ------------------------------------------------------------
    // EVENTS
    // ------------------------------------------------------------
    regionFilter.onchange = () => { currentPage = 1; render(); };
    biomeFilter.onchange = () => { currentPage = 1; render(); };
    familyFilter.onchange = () => { currentPage = 1; render(); };
    rarityFilter.onchange = () => { currentPage = 1; render(); };
    sortFilter.onchange = () => { currentPage = 1; render(); };
    searchBox.oninput = () => { currentPage = 1; render(); };

    prevPageBtn.onclick = () => {
      if (currentPage > 1) {
        currentPage--;
        render();
      }
    };

    nextPageBtn.onclick = () => {
      const totalPages = Math.max(1, Math.ceil(filteredList.length / PAGE_SIZE));
      if (currentPage < totalPages) {
        currentPage++;
        render();
      }
    };

    // Initial render
    render();
  </script>

</body>
</html>
