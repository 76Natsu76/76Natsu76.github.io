<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bestiary</title>

  <style>
    body {
      background: #0d0f14;
      color: #e8e8e8;
      font-family: system-ui, sans-serif;
      padding: 24px;
    }

    h1 {
      color: #7fffd4;
      margin-bottom: 4px;
    }

    #topBar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    #filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    select, input {
      padding: 6px;
      background: #1a1d24;
      border: 1px solid #333;
      color: #eee;
      border-radius: 4px;
    }

    .enemy-card {
      background: #11141c;
      border: 1px solid #262a36;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      gap: 16px;
    }

    .enemy-card img {
      width: 96px;
      height: 96px;
      border-radius: 6px;
      border: 1px solid #333;
      object-fit: cover;
    }

    .enemy-info h2 {
      margin: 0;
      color: #9af7ff;
    }

    .tag {
      display: inline-block;
      padding: 2px 6px;
      background: #1a1d24;
      border: 1px solid #333;
      border-radius: 4px;
      margin-right: 4px;
      font-size: 12px;
    }

    .tier-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      color: white;
      margin-left: 6px;
    }
    
    /* Tier Colors */
    .tier-1 { background: #6b6b6b; }        /* Mundane – gray */
    .tier-2 { background: #3a78ff; }        /* Elite – blue */
    .tier-3 { background: #9b4dff; }        /* Mythic – purple */
    .tier-4 { background: #d47f00; }        /* Titanic – orange/gold */
    .tier-5 { background: #00c8ff; }        /* Cosmic – cyan */
    .tier-6 { background: #ff003c; }        /* Apocalyptic – red */
    .tier-7 { background: #fff200; color: #000; } /* Divine/Paradox – radiant yellow */

    .ability-pill {
      display: inline-block;
      padding: 2px 6px;
      background: #141824;
      border-radius: 4px;
      margin-right: 4px;
      font-size: 12px;
      border: 1px solid #333;
    }

    .btn {
      padding: 6px 10px;
      background: #1f2937;
      border: 1px solid #374151;
      color: #e5e7eb;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn:hover {
      background: #111827;
    }

    #pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      margin-bottom: 16px;
    }

    #pagination span {
      font-size: 14px;
      color: #9ca3af;
    }

    /* Modal */
    #enemyModalOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    #enemyModal {
      background: #11141c;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 16px;
      max-width: 480px;
      width: 100%;
      color: #e5e7eb;
    }

    #enemyModal h2 {
      margin-top: 0;
      color: #9af7ff;
    }

    #enemyModalClose {
      float: right;
      cursor: pointer;
      color: #9ca3af;
    }

    #enemyModal table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      margin-bottom: 8px;
    }

    #enemyModal table td {
      padding: 4px 6px;
      border-bottom: 1px solid #1f2933;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="topBar">
    <h1>Bestiary</h1>
    <button class="btn" onclick="goBack()">Back</button>
  </div>

  <div id="filters">
    <select id="regionFilter">
      <option value="">All Regions</option>
    </select>

    <select id="biomeFilter">
      <option value="">All Biomes</option>
    </select>

    <select id="familyFilter">
      <option value="">All Families</option>
    </select>

    <select id="rarityFilter">
      <option value="">All Rarities</option>
      <option>Common</option>
      <option>Uncommon</option>
      <option>Rare</option>
      <option>Epic</option>
      <option>Elite</option>
      <option>Mythical</option>
      <option>Legendary</option>
      <option>Ancient</option>
    </select>

    <!-- ⭐ NEW: Tier Filter --
    <select id="tierFilter">
      <option value="">All Tiers</option>
      <option value="1">Mundane</option>
      <option value="2">Elite</option>
      <option value="3">Mythic</option>
      <option value="4">Titanic</option>
      <option value="5">Cosmic</option>
    </select>-->

    <input id="searchBox" placeholder="Search enemies...">
  </div>

  <div id="bestiaryContainer">Loading...</div>

  <div id="pagination">
    <button class="btn" id="prevPageBtn">&laquo; Prev</button>
    <span id="pageInfo"></span>
    <button class="btn" id="nextPageBtn">Next &raquo;</button>
  </div>

  <!-- Stats Modal -->
  <div id="enemyModalOverlay">
    <div id="enemyModal">
      <span id="enemyModalClose">✕</span>
      <div id="enemyModalContent"></div>
    </div>
  </div>

  <script type="module">
    import { requireSession } from "./session-guard.js";
    import { WORLD_DATA } from "./world-data.js";
    import { BIOMES } from "./biomes.js";
    import { REGION_TO_BIOME } from "./region-to-biome.js";
    import { EnemyRegistry } from "./enemy-registry.js";
    import { EXPANDED_ENEMY_REGIONS as ENEMY_REGIONS } from "./expanded-enemy-regions.js";
    
    /* ⭐ NEW IMPORTS */
    import { TIERED_MATRIX, TIER_NAMES } from "./tiered-matrix.js";
    import { REGION_TIERS } from "./region-tiers.js";
    
    /* ⭐ format() MUST be defined before any filters use it */
    function format(str) {
      return String(str || "")
        .replace(/_/g, " ")
        .replace(/-/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
    }
    
    const session = requireSession();
    
    const container = document.getElementById("bestiaryContainer");
    const regionFilter = document.getElementById("regionFilter");
    const biomeFilter = document.getElementById("biomeFilter");
    const familyFilter = document.getElementById("familyFilter");
    const rarityFilter = document.getElementById("rarityFilter");
    
    /* ⭐ NEW: Tier Filter (Option A placement) */
    const tierFilter = document.createElement("select");
    tierFilter.id = "tierFilter";
    tierFilter.innerHTML = `
      <option value="">All Tiers</option>
      <option value="1">Mundane</option>
      <option value="2">Elite</option>
      <option value="3">Mythic</option>
      <option value="4">Titanic</option>
      <option value="5">Cosmic</option>
    `;
    rarityFilter.insertAdjacentElement("afterend", tierFilter);
    
    // --- Dynamic controls: sort + pagination ---
    const filtersBar = document.getElementById("filters");
    
    const sortSelect = document.createElement("select");
    sortSelect.id = "sortSelect";
    sortSelect.innerHTML = `
      <option value="name_asc">Name (A–Z)</option>
      <option value="name_desc">Name (Z–A)</option>
      <option value="level_asc">Level (Low→High)</option>
      <option value="level_desc">Level (High→Low)</option>
      <option value="rarity_asc">Rarity (Low→High)</option>
      <option value="rarity_desc">Rarity (High→Low)</option>
      <option value="family_asc">Family (A–Z)</option>
    
      <!-- ⭐ NEW: Tier Sorting -->
      <option value="tier_asc">Tier (Low→High)</option>
      <option value="tier_desc">Tier (High→Low)</option>
    `;
    
    const searchBox = document.getElementById("searchBox");
    filtersBar.insertBefore(sortSelect, searchBox);
    
    const paginationBar = document.createElement("div");
    paginationBar.style.marginTop = "12px";
    paginationBar.style.display = "flex";
    paginationBar.style.alignItems = "center";
    paginationBar.style.gap = "8px";
    
    const prevBtn = document.createElement("button");
    prevBtn.textContent = "Prev";
    prevBtn.className = "btn";
    const nextBtn = document.createElement("button");
    nextBtn.textContent = "Next";
    nextBtn.className = "btn";
    const pageInfo = document.createElement("span");
    pageInfo.style.opacity = "0.8";
    
    paginationBar.appendChild(prevBtn);
    paginationBar.appendChild(pageInfo);
    paginationBar.appendChild(nextBtn);
    container.parentNode.insertBefore(paginationBar, container.nextSibling);
    
    // --- Stats modal (created once) ---
    const modal = document.createElement("div");
    modal.id = "enemyStatsModal";
    Object.assign(modal.style, {
      position: "fixed",
      inset: "0",
      background: "rgba(0,0,0,0.7)",
      display: "none",
      alignItems: "center",
      justifyContent: "center",
      zIndex: "9999"
    });
    
    const modalInner = document.createElement("div");
    Object.assign(modalInner.style, {
      background: "#11141c",
      border: "1px solid #262a36",
      borderRadius: "8px",
      padding: "16px",
      maxWidth: "480px",
      maxHeight: "80vh",
      overflowY: "auto",
      color: "#e8e8e8"
    });
    modalInner.innerHTML = `
      <h2 id="modalEnemyName" style="margin-top:0;color:#9af7ff;"></h2>
      <div id="modalEnemyBody"></div>
      <button id="closeEnemyModal" class="btn" style="margin-top:12px;">Close</button>
    `;
    modal.appendChild(modalInner);
    document.body.appendChild(modal);
    
    document.getElementById("closeEnemyModal").onclick = () => {
      modal.style.display = "none";
    };
    modal.onclick = e => {
      if (e.target === modal) modal.style.display = "none";
    };
    
    // ------------------------------------------------------------
    // REGION FAMILY FALLBACK (unchanged)
    // ------------------------------------------------------------
    const REGION_FAMILY = {
      forest: ["forest-edge", "wild-forest", "deep-forest"],
      plains: ["plains-field"],
      tundra: ["tundra", "crystal-tundra"],
      volcano: ["volcano", "molten-crest", "magma"],
      swamp: ["swamp", "boglands"],
      desert: ["desert", "dune-sea"],
      mountains: ["mountains", "highlands"]
    };
    
    // ------------------------------------------------------------
    // INITIALIZE FILTER OPTIONS (⭐ Region Tier Display Added)
    // ------------------------------------------------------------
    for (const key in WORLD_DATA.regions) {
      const opt = document.createElement("option");
      opt.value = key;
    
      const tier = REGION_TIERS[key] || 1;
      const tierName = TIER_NAMES[tier];
    
      opt.textContent = `${WORLD_DATA.regions[key].name} (${tierName})`;
      regionFilter.appendChild(opt);
    }
    
    for (const key in BIOMES) {
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = format(key);
      biomeFilter.appendChild(opt);
    }
    
    const families = new Set(
      EnemyRegistry.enemies.map(e => {
        const t = EnemyRegistry.buildEnemyTemplate(e.key);
        return t.family;
      })
    );

    families.forEach(f => {
      const opt = document.createElement("option");
      opt.value = f;
      opt.textContent = format(f);
      familyFilter.appendChild(opt);
    });
    
    // ------------------------------------------------------------
    // PAGINATION + SORT STATE
    // ------------------------------------------------------------
    let currentPage = 1;
    const pageSize = 10;
    let currentEnemies = [];
    
    function rarityRank(r) {
      if (!r) return 0;
      const order = [
        "common",
        "uncommon",
        "rare",
        "epic",
        "elite",
        "mythical",
        "legendary",
        "ancient"
      ];
      const idx = order.indexOf(r.toLowerCase());
      return idx === -1 ? 0 : idx;
    }
    
    function sortEnemies(list) {
      const mode = sortSelect.value;
      const arr = [...list];
    
      arr.sort((a, b) => {
        const ta = a.template;
        const tb = b.template;
    
        switch (mode) {
          case "name_asc": return ta.name.localeCompare(tb.name);
          case "name_desc": return tb.name.localeCompare(ta.name);
          case "level_asc": return (ta.level || 1) - (tb.level || 1);
          case "level_desc": return (tb.level || 1) - (ta.level || 1);
          case "rarity_asc": return rarityRank(ta.rarity) - rarityRank(tb.rarity);
          case "rarity_desc": return rarityRank(tb.rarity) - rarityRank(ta.rarity);
          case "family_asc":
            return format(ta.family || "").localeCompare(format(tb.family || ""));
    
          /* ⭐ NEW: Tier Sorting */
          case "tier_asc":
            return (
              TIERED_MATRIX[a.template.key].familyTier -
              TIERED_MATRIX[b.template.key].familyTier
            );
          case "tier_desc":
            return (
              TIERED_MATRIX[b.template.key].familyTier -
              TIERED_MATRIX[a.template.key].familyTier
            );
    
          default:
            return ta.name.localeCompare(tb.name);
        }
      });
    
      return arr;
    }
    
    // ------------------------------------------------------------
    // RENDER BESTIARY
    // ------------------------------------------------------------
    function buildFilteredList() {
      const regionVal = regionFilter.value;
      const biomeVal = biomeFilter.value;
      const familyVal = familyFilter.value;
      const rarityVal = (rarityFilter.value || "").toLowerCase();
      const tierVal = tierFilter.value; /* ⭐ NEW */
      const searchVal = (searchBox.value || "").toLowerCase();
    
      const out = [];
    
      for (const e of EnemyRegistry.enemies) {
        const template = EnemyRegistry.buildEnemyTemplate(e.key);
        const entry = TIERED_MATRIX[e.key]; /* ⭐ NEW */
        if (!entry) continue;
    
        // REGION FILTER (unchanged)
        if (regionVal) {
          const allowed = ENEMY_REGIONS[e.key] || [];
          let matches = allowed.some(r => r.startsWith(regionVal));
    
          if (!matches && REGION_FAMILY[regionVal]) {
            const group = REGION_FAMILY[regionVal];
            matches = allowed.some(r => group.includes(r));
          }
    
          if (!matches) continue;
        }
    
        // BIOME FILTER (unchanged)
        if (biomeVal) {
          const biome = BIOMES[biomeVal];
          const allowedFamilies = Object.keys(biome.encounterWeights || {});
          const famKey = e.family || EnemyRegistry.subraceMap[e.key] ||
            EnemyRegistry.raceMap[e.key];
    
          if (!allowedFamilies.includes(famKey)) continue;
        }
    
        if (familyVal && template.family !== familyVal) continue;
        if (rarityVal && e.rarity.toLowerCase() !== rarityVal) continue;
    
        /* ⭐ NEW: TIER FILTER */
        if (tierVal && entry.familyTier !== Number(tierVal)) continue;
    
        if (searchVal && !e.name.toLowerCase().includes(searchVal)) continue;
        out.push({ raw: e, template });
      }
    
      return sortEnemies(out);
    }
    
    function render() {
      currentEnemies = buildFilteredList();
    
      const totalPages = Math.max(1, Math.ceil(currentEnemies.length / pageSize));
      if (currentPage > totalPages) currentPage = totalPages;
    
      const start = (currentPage - 1) * pageSize;
      const pageSlice = currentEnemies.slice(start, start + pageSize);
    
      const chunks = pageSlice.map(({ raw, template }) => {
        const allowedRegions = ENEMY_REGIONS[raw.key] || [];
        const abilities = template.abilities || [];
        const abilityPreview = abilities.slice(0, 2).map(a => a.name).join(", ");
    
        /* ⭐ NEW: Tier Display */
        const tier = TIERED_MATRIX[template.key]?.familyTier || 1;

        const tierNames = {
          1: "Mundane",
          2: "Elite",
          3: "Mythic",
          4: "Titanic",
          5: "Cosmic",
          6: "Apocalyptic",
          7: "Divine"
        };
        
        const badge = `<span class="tier-badge tier-${tier}" title="${tierNames[tier]} Tier">${tierNames[tier]}</span>`;

        return `
          <div class="enemy-card">
            <img src="/assets/enemies/${template.key}.png" alt="${template.name}">
            <div class="enemy-info">
              <h2>${template.name}</h2>
    
              <div><strong>Family:</strong> ${format(template.family)}</div>
              <div><strong>Rarity:</strong> ${format(template.rarity)}</div>
              <div><strong>Level:</strong> ${template.level ?? "?"}</div>
              <div><strong>Element:</strong> ${format(template.element || "neutral")}</div>
              <div><strong>Tier:</strong> ${badge}</div>
    
              <div><strong>Allowed Regions:</strong> ${
                allowedRegions.length ? allowedRegions.map(format).join(", ") : "Any"
              }</div>
    
              ${
                abilities.length
                  ? `<div><strong>Abilities:</strong> ${abilityPreview}${
                      abilities.length > 2 ? "…" : ""
                    }</div>`
                  : `<div><strong>Abilities:</strong> None</div>`
              }
    
              <div class="event" style="margin-top:10px;">
                ${template.flavor || "No flavor text."}
              </div>
    
              <button class="btn" data-enemy-key="${template.key}" data-action="viewStats" style="margin-top:8px;">
                View Details
              </button>
            </div>
          </div>
        `;
      });
    
      container.innerHTML = chunks.join("") || "<p>No enemies found.</p>";
    
      pageInfo.textContent = `Page ${currentPage} of ${Math.max(
        1,
        Math.ceil(currentEnemies.length / pageSize)
      )}`;
    
      container.querySelectorAll("button[data-action='viewStats']").forEach(btn => {
        btn.addEventListener("click", () => {
          const key = btn.getAttribute("data-enemy-key");
          openStatsModal(key);
        });
      });
    }
    
    function openStatsModal(enemyKey) {
      const template = EnemyRegistry.buildEnemyTemplate(enemyKey);
      const allowedRegions = ENEMY_REGIONS[enemyKey] || [];
      const abilities = template.abilities || [];
    
      /* ⭐ NEW: Tier Display */
      const entry = TIERED_MATRIX[template.family];
      const tierName = TIER_NAMES[entry.familyTier];
    
      const loot = template.lootTable || {};
      let lootSummary = "None";
      if (loot.gold || loot.items) {
        const goldPart = loot.gold ? `Gold: ${JSON.stringify(loot.gold)}` : "";
        const itemPart = loot.items
          ? `Items: ${loot.items.map(i => i.name || i.key || "Item").join(", ")}`
          : "";
        lootSummary = [goldPart, itemPart].filter(Boolean).join(" | ") || "None";
      }
    
      document.getElementById("modalEnemyName").textContent = template.name;
    
      document.getElementById("modalEnemyBody").innerHTML = `
        <div><strong>Key:</strong> ${template.key}</div>
        <div><strong>Family:</strong> ${format(template.family)}</div>
        <div><strong>Tier:</strong> ${tierName}</div> <!-- ⭐ NEW -->
        <div><strong>Rarity:</strong> ${format(template.rarity)}</div>
        <div><strong>Level:</strong> ${template.level ?? "?"}</div>
        <div><strong>Element:</strong> ${format(template.element || "neutral")}</div>
        <div><strong>Base HP:</strong> ${Math.round(template.baseHP)}</div>
        <div><strong>Base ATK:</strong> ${Math.round(template.baseATK)}</div>
        <div><strong>Base DEF:</strong> ${Math.round(template.baseDEF)}</div>
        <div><strong>Behavior:</strong> ${
          template.behavior ? format(template.behavior.key || template.behavior) : "Unknown"
        }</div>
        <div><strong>Allowed Regions:</strong> ${
          allowedRegions.length ? allowedRegions.map(format).join(", ") : "Any"
        }</div>
    
        <div style="margin-top:8px;"><strong>Abilities:</strong></div>
        ${
          abilities.length
            ? `<ul>${abilities
                .map(
                  a => `
              <li>
                <strong>${a.name}</strong> — ${a.description || "No description."}
                ${
                  a.cooldown != null
                    ? ` <span style="opacity:0.8;">(CD: ${a.cooldown})</span>`
                    : ""
                }
              </li>
            `
                )
                .join("")}</ul>`
            : "<div>None</div>"
        }
    
        <div style="margin-top:8px;"><strong>Loot:</strong> ${lootSummary}</div>
        <div style="margin-top:8px;"><strong>Flavor:</strong> ${
          template.flavor || "No flavor text."
        }</div>
      `;
    
      modal.style.display = "flex";
    }
    
    window.goBack = () => {
      window.location.href = "world-map.html";
    };
    
    regionFilter.onchange = () => {
      currentPage = 1;
      render();
    };
    biomeFilter.onchange = () => {
      currentPage = 1;
      render();
    };
    familyFilter.onchange = () => {
      currentPage = 1;
      render();
    };
    rarityFilter.onchange = () => {
      currentPage = 1;
      render();
    };
    tierFilter.onchange = () => { /* ⭐ NEW */
      currentPage = 1;
      render();
    };
    searchBox.oninput = () => {
      currentPage = 1;
      render();
    };
    sortSelect.onchange = () => {
      currentPage = 1;
      render();
    };
    
    prevBtn.onclick = () => {
      if (currentPage > 1) {
        currentPage--;
        render();
      }
    };
    nextBtn.onclick = () => {
      const totalPages = Math.max(1, Math.ceil(currentEnemies.length / pageSize));
      if (currentPage < totalPages) {
        currentPage++;
        render();
      }
    };
    
    render();
  </script>

</body>
</html>
