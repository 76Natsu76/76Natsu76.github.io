<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bestiary</title>

  <style>
    body {
      background: #0d0f14;
      color: #e8e8e8;
      font-family: system-ui, sans-serif;
      padding: 24px;
    }

    h1 {
      color: #7fffd4;
      margin-bottom: 4px;
    }

    #topBar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    #filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    select, input {
      padding: 6px;
      background: #1a1d24;
      border: 1px solid #333;
      color: #eee;
      border-radius: 4px;
    }

    .enemy-card {
      background: #11141c;
      border: 1px solid #262a36;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      gap: 16px;
    }

    .enemy-card img {
      width: 96px;
      height: 96px;
      border-radius: 6px;
      border: 1px solid #333;
      object-fit: cover;
      background: #05060a;
    }

    .enemy-info h2 {
      margin: 0;
      color: #9af7ff;
    }

    .tag {
      display: inline-block;
      padding: 2px 6px;
      background: #1a1d24;
      border: 1px solid #333;
      border-radius: 4px;
      margin-right: 4px;
      font-size: 12px;
    }

    .tier-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      color: white;
      margin-left: 6px;
    }

    /* Tier Colors */
    .tier-1 { background: #6b6b6b; } /* Mundane – gray */
    .tier-2 { background: #3a78ff; } /* Elite – blue */
    .tier-3 { background: #9b4dff; } /* Mythic – purple */
    .tier-4 { background: #d47f00; } /* Titanic – orange/gold */
    .tier-5 { background: #00c8ff; } /* Cosmic – cyan */
    .tier-6 { background: #ff003c; } /* Apocalyptic – red */
    .tier-7 { background: #fff200; color: #000; } /* Divine/Paradox – radiant yellow */

    .ability-pill {
      display: inline-block;
      padding: 2px 6px;
      background: #141824;
      border-radius: 4px;
      margin-right: 4px;
      font-size: 12px;
      border: 1px solid #333;
    }

    .btn {
      padding: 6px 10px;
      background: #1f2937;
      border: 1px solid #374151;
      color: #e5e7eb;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn:hover {
      background: #111827;
    }

    #pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      margin-bottom: 16px;
    }

    #pagination span {
      font-size: 14px;
      color: #9ca3af;
    }

    /* Modal */
    #enemyModalOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    #enemyModal {
      background: #11141c;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 16px;
      max-width: 480px;
      width: 100%;
      color: #e5e7eb;
      max-height: 80vh;
      overflow-y: auto;
    }

    #enemyModal h2 {
      margin-top: 0;
      color: #9af7ff;
    }

    #enemyModalClose {
      float: right;
      cursor: pointer;
      color: #9ca3af;
    }

    #enemyModal table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      margin-bottom: 8px;
    }

    #enemyModal table td {
      padding: 4px 6px;
      border-bottom: 1px solid #1f2933;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div id="topBar">
  <h1>Bestiary</h1>
  <button class="btn" onclick="goBack()">Back</button>
</div>

<div id="filters">
  <select id="regionFilter">
    <option value="">All Regions</option>
  </select>

  <select id="biomeFilter">
    <option value="">All Biomes</option>
  </select>

  <select id="familyFilter">
    <option value="">All Families</option>
  </select>

  <select id="rarityFilter">
    <option value="">All Rarities</option>
    <option>Common</option>
    <option>Uncommon</option>
    <option>Rare</option>
    <option>Epic</option>
    <option>Elite</option>
    <option>Mythical</option>
    <option>Legendary</option>
    <option>Ancient</option>
  </select>

  <select id="tierFilter">
    <option value="">All Tiers</option>
    <option value="1">Mundane</option>
    <option value="2">Elite</option>
    <option value="3">Mythic</option>
    <option value="4">Titanic</option>
    <option value="5">Cosmic</option>
    <option value="6">Eternal</option>
    <option value="7">Transcendent</option>
  </select>

  <select id="sortSelect">
    <option value="name_asc">Name (A–Z)</option>
    <option value="name_desc">Name (Z–A)</option>
    <option value="level_asc">Level (Low→High)</option>
    <option value="level_desc">Level (High→Low)</option>
    <option value="rarity_asc">Rarity (Low→High)</option>
    <option value="rarity_desc">Rarity (High→Low)</option>
    <option value="family_asc">Family (A–Z)</option>
    <option value="tier_asc">Tier (Low→High)</option>
    <option value="tier_desc">Tier (High→Low)</option>
  </select>

  <input id="searchBox" placeholder="Search enemies...">
</div>

<div id="bestiaryContainer">Loading...</div>

<div id="pagination">
  <button class="btn" id="prevPageBtn">&laquo; Prev</button>
  <span id="pageInfo"></span>
  <button class="btn" id="nextPageBtn">Next &raquo;</button>
</div>

<!-- Stats Modal -->
<div id="enemyModalOverlay">
  <div id="enemyModal">
    <span id="enemyModalClose">✕</span>
    <h2 id="modalEnemyName"></h2>
    <div id="enemyModalContent"></div>
  </div>
</div>

<script type="module">
  import { requireSession } from "./session-guard.js";
  import { ENEMIES } from "./enemies.js";
  import { BIOMES } from "./biomes.js";
  import { REGION_HIERARCHY } from "./region-hierarchy.js";
  import { REGION_CANONICAL } from "./region-canonical.js";
  import { ENEMY_REGIONS } from "./enemy-regions.js";
  import { TIERED_MATRIX, TIER_NAMES } from "./tiered-matrix.js";

  const session = requireSession();

  const container = document.getElementById("bestiaryContainer");
  const regionFilter = document.getElementById("regionFilter");
  const biomeFilter = document.getElementById("biomeFilter");
  const familyFilter = document.getElementById("familyFilter");
  const rarityFilter = document.getElementById("rarityFilter");
  const tierFilter = document.getElementById("tierFilter");
  const sortSelect = document.getElementById("sortSelect");
  const searchBox = document.getElementById("searchBox");

  const prevBtn = document.getElementById("prevPageBtn");
  const nextBtn = document.getElementById("nextPageBtn");
  const pageInfo = document.getElementById("pageInfo");

  const modalOverlay = document.getElementById("enemyModalOverlay");
  const modalClose = document.getElementById("enemyModalClose");
  const modalName = document.getElementById("modalEnemyName");
  const modalContent = document.getElementById("enemyModalContent");

  function format(str) {
    return String(str || "")
      .replace(/_/g, " ")
      .replace(/-/g, " ")
      .replace(/\b\w/g, c => c.toUpperCase());
  }

  // Build subregion and canonical tier lookups from REGION_HIERARCHY
  const SUBREGION_TIERS = {};
  const CANONICAL_TIERS = {};
  const SUBREGION_BIOMES = {};

  for (const [canonicalKey, def] of Object.entries(REGION_HIERARCHY)) {
    CANONICAL_TIERS[canonicalKey] = def.tier || 1;
    const subs = def.subregions || {};
    for (const [subKey, subDef] of Object.entries(subs)) {
      SUBREGION_TIERS[subKey] = subDef.tier || def.tier || 1;
      if (subDef.biome) {
        SUBREGION_BIOMES[subKey] = subDef.biome;
      }
    }
  }

  function resolveRegionTier(regionKey) {
    if (SUBREGION_TIERS[regionKey]) return SUBREGION_TIERS[regionKey];
    const canonical = REGION_CANONICAL_MAP[regionKey];
    if (canonical && CANONICAL_TIERS[canonical]) {
      return CANONICAL_TIERS[canonical];
    }
    return 1;
  }

  function rarityRank(r) {
    if (!r) return 0;
    const order = [
      "common",
      "uncommon",
      "rare",
      "epic",
      "elite",
      "mythical",
      "legendary",
      "ancient"
    ];
    const idx = order.indexOf(r.toLowerCase());
    return idx === -1 ? 0 : idx;
  }

  function populateRegionFilter() {
    regionFilter.innerHTML = `<option value="">All Regions</option>`;
    for (const [canonical, def] of Object.entries(REGION_HIERARCHY)) {
      const name = def.name || canonical;
      regionFilter.innerHTML += `<option value="${canonical}">${name}</option>`;
    }
  }

  function populateBiomeFilter() {
    biomeFilter.innerHTML = `<option value="">All Biomes</option>`;
    for (const key of Object.keys(BIOMES)) {
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = format(key);
      biomeFilter.appendChild(opt);
    }
  }

  function populateFamilyFilter() {
    familyFilter.innerHTML = `<option value="">All Families</option>`;
    const families = new Set();
    for (const [key, enemy] of Object.entries(ENEMIES)) {
      if (enemy.family) families.add(enemy.family);
    }
    Array.from(families)
      .sort((a, b) => a.localeCompare(b))
      .forEach(f => {
        const opt = document.createElement("option");
        opt.value = f;
        opt.textContent = format(f);
        familyFilter.appendChild(opt);
      });
  }

  function sortEnemies(list) {
    const mode = sortSelect.value;
    const arr = [...list];

    arr.sort((a, b) => {
      const ea = a.enemy;
      const eb = b.enemy;
      const ma = TIERED_MATRIX[a.key] || {};
      const mb = TIERED_MATRIX[b.key] || {};

      switch (mode) {
        case "name_asc":
          return (ea.name || a.key).localeCompare(eb.name || b.key);
        case "name_desc":
          return (eb.name || b.key).localeCompare(ea.name || a.key);
        case "level_asc":
          return (ea.level || 1) - (eb.level || 1);
        case "level_desc":
          return (eb.level || 1) - (ea.level || 1);
        case "rarity_asc":
          return rarityRank(ea.rarity) - rarityRank(eb.rarity);
        case "rarity_desc":
          return rarityRank(eb.rarity) - rarityRank(ea.rarity);
        case "family_asc":
          return format(ea.family || "").localeCompare(format(eb.family || ""));
        case "tier_asc":
          return (ma.finalTier || 1) - (mb.finalTier || 1);
        case "tier_desc":
          return (mb.finalTier || 1) - (ma.finalTier || 1);
        default:
          return (ea.name || a.key).localeCompare(eb.name || b.key);
      }
    });

    return arr;
  }

  function buildFilteredList() {
    const regionVal = regionFilter.value;
    const biomeVal = biomeFilter.value;
    const familyVal = familyFilter.value;
    const rarityVal = (rarityFilter.value || "").toLowerCase();
    const tierVal = tierFilter.value;
    const searchVal = (searchBox.value || "").toLowerCase();

    const out = [];

    for (const [key, enemy] of Object.entries(ENEMIES)) {
      const matrixEntry = TIERED_MATRIX[key];
      if (!matrixEntry) continue;

      const allowedSubregions = matrixEntry.allowedRegions || [];

      // Region filter (canonical)
      if (regionVal) {
        const canonicalSet = new Set(
          allowedSubregions
            .map(sub => REGION_CANONICAL_MAP[sub])
            .filter(Boolean)
        );
        if (!canonicalSet.has(regionVal)) continue;
      }

      // Biome filter: enemy must appear in at least one subregion with this biome
      if (biomeVal) {
        const hasBiome = allowedSubregions.some(sub => {
          const biome = SUBREGION_BIOMES[sub];
          return biome === biomeVal;
        });
        if (!hasBiome) continue;
      }

      if (familyVal && enemy.family !== familyVal) continue;

      if (rarityVal && (enemy.rarity || "").toLowerCase() !== rarityVal) continue;

      if (tierVal && (matrixEntry.finalTier || 1) !== Number(tierVal)) continue;

      if (searchVal) {
        const fields = [
          enemy.name || key,
          enemy.family || "",
          enemy.rarity || "",
          (matrixEntry.tierName || ""),
          String(matrixEntry.finalTier || 1),
          ...allowedSubregions,
          ...allowedSubregions
            .map(sub => REGION_CANONICAL_MAP[sub])
            .filter(Boolean)
        ].map(s => String(s).toLowerCase());

        const matches = fields.some(f => f.includes(searchVal));
        if (!matches) continue;
      }

      out.push({ key, enemy, matrixEntry });
    }

    return sortEnemies(out);
  }

  let currentPage = 1;
  const pageSize = 10;
  let currentEnemies = [];

  function render() {
    currentEnemies = buildFilteredList();

    const totalPages = Math.max(1, Math.ceil(currentEnemies.length / pageSize));
    if (currentPage > totalPages) currentPage = totalPages;

    const start = (currentPage - 1) * pageSize;
    const pageSlice = currentEnemies.slice(start, start + pageSize);

    const chunks = pageSlice.map(({ key, enemy, matrixEntry }) => {
      const allowedSubregions = matrixEntry.allowedRegions || [];
      const canonicalRegions = Array.from(
        new Set(
          allowedSubregions
            .map(sub => REGION_CANONICAL_MAP[sub])
            .filter(Boolean)
        )
      );

      const allowedRegionsText = canonicalRegions.length
        ? canonicalRegions.map(format).join(", ")
        : "Any";

      const subregionText = allowedSubregions.length
        ? ` (Subregions: ${allowedSubregions.map(format).join(", ")})`
        : "";

      const abilities = enemy.abilities || [];
      const abilityPreview = abilities
        .slice(0, 2)
        .map(a => a.name || format(a.key || ""))
        .join(", ");

      const tier = matrixEntry.finalTier || 1;
      const tierName = TIER_NAMES[tier] || "Unknown";
      const badge = `<span class="tier-badge tier-${tier}" title="${tierName} Tier">${tierName}</span>`;

      const imgSrc = `/assets/enemies/${key}.png`;

      return `
        <div class="enemy-card">
          <img src="${imgSrc}" alt="${enemy.name || key}" onerror="this.style.display='none'">
          <div class="enemy-info">
            <h2>${enemy.name || format(key)} ${badge}</h2>

            <div><strong>Family:</strong> ${format(enemy.family || "Unknown")}</div>
            <div><strong>Rarity:</strong> ${format(enemy.rarity || "Unknown")}</div>
            <div><strong>Level:</strong> ${enemy.level ?? "?"}</div>
            <div><strong>Element:</strong> ${format(enemy.element || "neutral")}</div>
            <div><strong>Allowed Regions:</strong> ${allowedRegionsText}${subregionText}</div>

            ${
              abilities.length
                ? `<div><strong>Abilities:</strong> ${abilityPreview}${
                    abilities.length > 2 ? "…" : ""
                  }</div>`
                : `<div><strong>Abilities:</strong> None</div>`
            }

            <div class="event" style="margin-top:10px;">
              ${enemy.flavor || "No flavor text."}
            </div>

            <button class="btn" data-enemy-key="${key}" data-action="viewStats" style="margin-top:8px;">
              View Details
            </button>
          </div>
        </div>
      `;
    });

    container.innerHTML = chunks.join("") || "<p>No enemies found.</p>";

    pageInfo.textContent = `Page ${currentPage} of ${Math.max(
      1,
      Math.ceil(currentEnemies.length / pageSize)
    )}`;

    container.querySelectorAll("button[data-action='viewStats']").forEach(btn => {
      btn.addEventListener("click", () => {
        const key = btn.getAttribute("data-enemy-key");
        openStatsModal(key);
      });
    });
  }

  function openStatsModal(enemyKey) {
    const enemy = ENEMIES[enemyKey];
    if (!enemy) return;

    const matrixEntry = TIERED_MATRIX[enemyKey] || {
      finalTier: 1,
      tierName: "Mundane",
      allowedRegions: []
    };

    const allowedSubregions = matrixEntry.allowedRegions || [];
    const canonicalRegions = Array.from(
      new Set(
        allowedSubregions
          .map(sub => REGION_CANONICAL_MAP[sub])
          .filter(Boolean)
      )
    );

    const allowedRegionsText = canonicalRegions.length
      ? canonicalRegions.map(format).join(", ")
      : "Any";

    const subregionText = allowedSubregions.length
      ? ` (Subregions: ${allowedSubregions.map(format).join(", ")})`
      : "";

    const abilities = enemy.abilities || [];

    const tier = matrixEntry.finalTier || 1;
    const tierName = TIER_NAMES[tier] || "Mundane";

    const loot = enemy.lootTable || {};
    let lootSummary = "None";
    if (loot.gold || loot.items) {
      const goldPart = loot.gold ? `Gold: ${JSON.stringify(loot.gold)}` : "";
      const itemPart = loot.items
        ? `Items: ${loot.items
            .map(i => i.name || i.key || "Item")
            .join(", ")}`
        : "";
      lootSummary = [goldPart, itemPart].filter(Boolean).join(" | ") || "None";
    }

    modalName.textContent = enemy.name || format(enemyKey);

    modalContent.innerHTML = `
      <div><strong>Key:</strong> ${enemyKey}</div>
      <div><strong>Family:</strong> ${format(enemy.family || "Unknown")}</div>
      <div><strong>Tier:</strong> ${tierName} (${tier})</div>
      <div><strong>Rarity:</strong> ${format(enemy.rarity || "Unknown")}</div>
      <div><strong>Level:</strong> ${enemy.level ?? "?"}</div>
      <div><strong>Element:</strong> ${format(enemy.element || "neutral")}</div>
      <div><strong>Base HP:</strong> ${Math.round(enemy.baseHP || 0)}</div>
      <div><strong>Base ATK:</strong> ${Math.round(enemy.baseATK || 0)}</div>
      <div><strong>Base DEF:</strong> ${Math.round(enemy.baseDEF || 0)}</div>
      <div><strong>Behavior:</strong> ${
        enemy.behavior
          ? format(enemy.behavior.key || enemy.behavior)
          : "Unknown"
      }</div>
      <div><strong>Allowed Regions:</strong> ${
        allowedRegionsText + subregionText
      }</div>

      <div style="margin-top:8px;"><strong>Abilities:</strong></div>
      ${
        abilities.length
          ? `<ul>${abilities
              .map(
                a => `
            <li>
              <strong>${a.name || format(a.key || "")}</strong> — ${
                  a.description || "No description."
                }
              ${
                a.cooldown != null
                  ? ` <span style="opacity:0.8;">(CD: ${a.cooldown})</span>`
                  : ""
              }
            </li>
          `
              )
              .join("")}</ul>`
          : "<div>None</div>"
      }

      <div style="margin-top:8px;"><strong>Loot:</strong> ${lootSummary}</div>
      <div style="margin-top:8px;"><strong>Flavor:</strong> ${
        enemy.flavor || "No flavor text."
      }</div>
    `;

    modalOverlay.style.display = "flex";
  }

  modalClose.onclick = () => {
    modalOverlay.style.display = "none";
  };
  modalOverlay.onclick = e => {
    if (e.target === modalOverlay) modalOverlay.style.display = "none";
  };

  window.goBack = () => {
    window.location.href = "world-map.html";
  };

  regionFilter.onchange = () => {
    currentPage = 1;
    render();
  };
  biomeFilter.onchange = () => {
    currentPage = 1;
    render();
  };
  familyFilter.onchange = () => {
    currentPage = 1;
    render();
  };
  rarityFilter.onchange = () => {
    currentPage = 1;
    render();
  };
  tierFilter.onchange = () => {
    currentPage = 1;
    render();
  };
  searchBox.oninput = () => {
    currentPage = 1;
    render();
  };
  sortSelect.onchange = () => {
    currentPage = 1;
    render();
  };

  prevBtn.onclick = () => {
    if (currentPage > 1) {
      currentPage--;
      render();
    }
  };
  nextBtn.onclick = () => {
    const totalPages = Math.max(1, Math.ceil(currentEnemies.length / pageSize));
    if (currentPage < totalPages) {
      currentPage++;
      render();
    }
  };

  populateRegionFilter();
  populateBiomeFilter();
  populateFamilyFilter();
  render();
</script>

</body>
</html>
