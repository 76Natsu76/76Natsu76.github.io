<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Select Dungeon</title>
  <style>
    body {
      background:#0d0f14;
      color:#e8e8e8;
      font-family:system-ui, sans-serif;
      padding:24px;
    }
    .dungeon-card {
      background:#14171f;
      border:1px solid #333;
      padding:16px;
      border-radius:8px;
      margin-bottom:20px;
    }
    .btn {
      padding:8px 12px;
      border-radius:6px;
      border:1px solid #444;
      background:#1a1d24;
      color:#eee;
      cursor:pointer;
      margin-top:10px;
    }
    .btn:hover { background:#222832; }
    .locked-text {
      color:#ff7777;
      font-size:13px;
      margin-top:6px;
    }
    .seed-row {
      margin-top:10px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }
    .seed-input {
      padding:6px 8px;
      border-radius:4px;
      border:1px solid #444;
      background:#0d0f14;
      color:#eee;
      flex:1;
      min-width:140px;
    }
    .seed-preset {
      padding:6px 8px;
      border-radius:4px;
      border:1px solid #444;
      background:#0d0f14;
      color:#eee;
    }
  </style>
</head>

<body>

  <h1>Select a Dungeon</h1>
  <div id="usernameDisplay"></div>

  <div id="dungeonList">Loading...</div>

  <button class="btn" onclick="goBack()">Return to Town</button>

  <script type="module">
    import { requireSession } from "./session-guard.js";
    import { PlayerStorage } from "./player-storage.js";
    import { DUNGEONS } from "./dungeons.js";
    import { DungeonEngine } from "./dungeon-engine.js";

    await requireSession();
    const { username } = window.syncState;

    const player = PlayerStorage.load(username);
    document.getElementById("usernameDisplay").textContent =
      "Logged in as: " + username;

    const container = document.getElementById("dungeonList");
    container.innerHTML = "";

    function generatePresetSeed(type) {
      const base = type.toUpperCase().slice(0, 4);
      const rand = Math.random().toString(36).substring(2, 6).toUpperCase();
      return `${base}-${rand}`;
    }

    /************************************************************
     * CONTINUE EXISTING RUN
     ************************************************************/
    if (player.activeDungeonRun) {
      const run = player.activeDungeonRun;
      const d = DUNGEONS[run.dungeonKey];

      const div = document.createElement("div");
      div.className = "dungeon-card";

      div.innerHTML = `
        <h2>Continue Run</h2>
        <p>Dungeon: ${d.name}</p>
        <p>Floor: ${run.currentFloor}</p>
        <button class="btn" onclick="continueRun()">Resume</button>
        <button class="btn" onclick="abandonRun()">Abandon Run</button>
      `;

      container.appendChild(div);
    }

    /************************************************************
     * DUNGEON LIST
     ************************************************************/
    for (const key in DUNGEONS) {
      const d = DUNGEONS[key];
      const allowed = canEnter(player, d);

      const div = document.createElement("div");
      div.className = "dungeon-card";

      let floorsLabel = "";
      if (d.type === "endless") floorsLabel = "∞";
      else floorsLabel = d.floors;

      let bossLabel = "";
      if (d.type === "endless") bossLabel = "Endless Bosses";
      else if (d.type === "great_dungeon") bossLabel = `Boss every ${d.bossEvery} floors`;
      else if (d.boss) bossLabel = d.boss.enemyKey;
      else bossLabel = "None";

      div.innerHTML = `
        <h2>${d.name}</h2>
        <p>Recommended Level: ${d.recommendedLevel ?? d.minLevel}</p>
        <p>Floors: ${floorsLabel}</p>
        <p>Boss: ${bossLabel}</p>

        <div class="seed-row">
          <select class="seed-preset">
            <option value="">Seed Preset: None</option>
            <option value="blessed">Blessed</option>
            <option value="cursed">Cursed</option>
            <option value="loot">Loot</option>
            <option value="chaos">Chaotic</option>
            <option value="bossrush">Boss Rush</option>
          </select>
          <input class="seed-input" placeholder="Custom Seed (optional)" />
        </div>

        <button class="btn" data-key="${key}" ${allowed ? "" : "disabled"}>
          ${allowed ? "Start Run" : "Locked"}
        </button>

        ${!allowed ? `<div class="locked-text">${explainRequirements(player, d)}</div>` : ""}
      `;

      container.appendChild(div);
    }

    /************************************************************
     * CLICK HANDLER
     ************************************************************/
    container.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-key]");
      if (!btn) return;

      const dungeonKey = btn.getAttribute("data-key");
      const dungeon = DUNGEONS[dungeonKey];

      if (!canEnter(player, dungeon)) {
        alert("You do not meet the entry requirements for this dungeon.");
        return;
      }

      const card = btn.closest(".dungeon-card");
      const seedInput = card.querySelector(".seed-input");
      const presetSelect = card.querySelector(".seed-preset");

      let seed = seedInput?.value.trim() || null;
      const preset = presetSelect?.value || "";

      if (!seed && preset) {
        seed = generatePresetSeed(preset);
      }

      const run = DungeonEngine.createRun(player, dungeonKey, seed);

      player.activeDungeonRun = run;
      PlayerStorage.save(username, player);

      window.location.href = "dungeon-room.html";
    });

    /************************************************************
     * ENTRY REQUIREMENTS
     ************************************************************/
    function canEnter(player, dungeon) {
      const req = dungeon.entryRequirements || {};

      if (req.minLevel && player.level < req.minLevel) return false;

      if (req.requiredItems?.length) {
        for (const item of req.requiredItems) {
          const hasItem = player.inventory?.some(i =>
            i.id === item || i.key === item
          );
          if (!hasItem) return false;
        }
      }

      if (req.requiredFlags?.length) {
        for (const flag of req.requiredFlags) {
          if (!player.flags || !player.flags[flag]) return false;
        }
      }

      return true;
    }

    function explainRequirements(player, dungeon) {
      const req = dungeon.entryRequirements || {};
      const parts = [];

      if (req.minLevel && player.level < req.minLevel) {
        parts.push(`Requires level ${req.minLevel}`);
      }

      if (req.requiredItems?.length) {
        parts.push(`Requires items: ${req.requiredItems.join(", ")}`);
      }

      if (req.requiredFlags?.length) {
        parts.push(`Requires: ${req.requiredFlags.join(", ")}`);
      }

      return parts.join(" • ");
    }

    /************************************************************
     * CONTINUE / ABANDON
     ************************************************************/
    window.continueRun = () => {
      window.location.href = "dungeon-room.html";
    };

    window.abandonRun = () => {
      if (!confirm("Are you sure you want to abandon your current run?")) return;
      player.activeDungeonRun = null;
      PlayerStorage.save(username, player);
      window.location.reload();
    };

    function goBack() {
      window.location.href = "town.html";
    }

    window.goBack = goBack;
  </script>

</body>
</html>
