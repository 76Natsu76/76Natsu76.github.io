<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Select Dungeon</title>
  <style>
    body {
      background:#0d0f14;
      color:#e8e8e8;
      font-family:system-ui, sans-serif;
      padding:24px;
    }
    .dungeon-card {
      background:#14171f;
      border:1px solid #333;
      padding:16px;
      border-radius:8px;
      margin-bottom:20px;
    }
    .btn {
      padding:8px 12px;
      border-radius:6px;
      border:1px solid #444;
      background:#1a1d24;
      color:#eee;
      cursor:pointer;
      margin-top:10px;
    }
    .btn:hover { background:#222832; }
    .locked-text {
      color:#ff7777;
      font-size:13px;
      margin-top:6px;
    }
  </style>
</head>

<body>

  <h1>Select a Dungeon</h1>
  <div id="usernameDisplay"></div>

  <div id="dungeonList">Loading...</div>

  <button class="btn" onclick="goBack()">Return to Town</button>

  <script type="module">
    import { requireSession } from "./session-guard.js";
    import { PlayerStorage } from "./player-storage.js";
    import { DUNGEONS } from "./dungeons.js";
    import { DungeonEngine } from "./dungeon-engine.js";
  
    await requireSession();
    const { username } = window.syncState;
  
    const player = PlayerStorage.load(username);
    document.getElementById("usernameDisplay").textContent =
      "Logged in as: " + username;
  
    const container = document.getElementById("dungeonList");
    container.innerHTML = "";
  
    // --- Continue existing run card ---
    if (player.activeDungeonRun) {
      const run = player.activeDungeonRun;
      const d = DUNGEONS[run.dungeonKey];
  
      const div = document.createElement("div");
      div.className = "dungeon-card";
  
      div.innerHTML = `
        <h2>Continue Run</h2>
        <p>Dungeon: ${d.name}</p>
        <p>Floor: ${run.currentFloor}</p>
        <button class="btn" onclick="continueRun()">Resume</button>
        <button class="btn" onclick="abandonRun()">Abandon Run</button>
      `;
  
      container.appendChild(div);
    }
  
    // --- Dungeon list ---
    for (const key in DUNGEONS) {
      const d = DUNGEONS[key];
      const allowed = canEnter(player, d);
  
      const div = document.createElement("div");
      div.className = "dungeon-card";
  
      const floorsLabel = d.type === "endless"
        ? "∞"
        : d.floors.length;
  
      const bossLabel = d.type === "endless"
        ? "Endless"
        : d.boss.enemyKey;
  
      div.innerHTML = `
        <h2>${d.name}</h2>
        <p>Recommended Level: ${d.recommendedLevel}</p>
        <p>Floors: ${floorsLabel}</p>
        <p>Boss: ${bossLabel}</p>
  
        <button class="btn" data-key="${key}" ${allowed ? "" : "disabled"}>
          ${allowed ? "Start Run" : "Locked"}
        </button>
  
        ${!allowed ? `<div class="locked-text">${explainRequirements(player, d)}</div>` : ""}
      `;
  
      container.appendChild(div);
    }
  
    // Handle clicking a dungeon card button
    container.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-key]");
      if (!btn) return;
  
      const dungeonKey = btn.getAttribute("data-key");
      const dungeon = DUNGEONS[dungeonKey];
  
      if (!canEnter(player, dungeon)) {
        alert("You do not meet the entry requirements for this dungeon.");
        return;
      }
  
      // Create run
      const run = DungeonEngine.createRun(player, dungeonKey);
  
      // Save to player
      player.activeDungeonRun = run;
      PlayerStorage.save(username, player);
  
      // Go to dungeon-room
      window.location.href = "dungeon-room.html";
    });
  
    /* ============================================================
       ENTRY REQUIREMENT CHECKS
    ============================================================ */
    function canEnter(player, dungeon) {
      const req = dungeon.entryRequirements || {};
  
      if (req.minLevel && player.level < req.minLevel) return false;
  
      if (req.requiredItems && req.requiredItems.length > 0) {
        for (const item of req.requiredItems) {
          const hasItem = player.inventory?.some(i =>
            i.id === item || i.key === item
          );
          if (!hasItem) return false;
        }
      }
  
      if (req.requiredFlags && req.requiredFlags.length > 0) {
        for (const flag of req.requiredFlags) {
          if (!player.flags || !player.flags[flag]) return false;
        }
      }
  
      return true;
    }
  
    function explainRequirements(player, dungeon) {
      const req = dungeon.entryRequirements || {};
      const parts = [];
  
      if (req.minLevel && player.level < req.minLevel) {
        parts.push(`Requires level ${req.minLevel}`);
      }
  
      if (req.requiredItems?.length) {
        parts.push(`Requires items: ${req.requiredItems.join(", ")}`);
      }
  
      if (req.requiredFlags?.length) {
        parts.push(`Requires: ${req.requiredFlags.join(", ")}`);
      }
  
      return parts.join(" • ");
    }
  
    // --- Continue / Abandon handlers ---
    window.continueRun = () => {
      window.location.href = "dungeon-room.html";
    };
  
    window.abandonRun = () => {
      if (!confirm("Are you sure you want to abandon your current run?")) return;
      player.activeDungeonRun = null;
      PlayerStorage.save(username, player);
      window.location.reload();
    };
  
    function goBack() {
      window.location.href = "town.html";
    }
  
    // expose for inline onclick
    window.goBack = goBack;
  </script>
  

</body>
</html>
